<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Agent team responsibility map</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --accent: #eb6c36;
      --ink: #2d3142;
      --link: #2e5aa8;
      --mono: 'Geist Mono', ui-monospace, monospace
      --muted: #4f5d75;
      --paper: #f5f5f5;
      --rule: rgba(45, 49, 66, .12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #7a8399;
      --paper-2: #fff;
      --accent-tint: rgba(235, 108, 54, .08);
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans);
      justify-content: center;
      min-height: 100vh;
      padding: 48px 32px
    }

    .frame {
      max-width: 1180px;
      width: 100%
    }

    .eyebrow {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
      margin-bottom: 8px
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -.02em;
      line-height: 1.08;
      margin-bottom: 20px
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px
      max-width: 720px;
    }

    svg {
      display: block
      min-width: 980px;
      width: 100%;
    }

    .cards {
      display: grid;
      gap: 16px;
      grid-template-columns:1.1fr 1fr .9fr;
      margin-top: 20px
    }

    .card {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 16px
    }

    .card h2 {
      font-size: 14px;
      margin-bottom: 8px
    }

    .card p {
      color: var(--muted)
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 860px) {
      body {
        display: block;
        padding: 32px 20px
      }

      .cards {
        grid-template-columns:1fr;
        overflow: visible
      }

      .frame {
        overflow-x: auto
      }
    }
  </style>
</head>
