<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>The self-improving loop · Terminal</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #ff5a36;
      --bar: #1b1b1b;
      --border: #2b2b2b;
      --ink: #f5f5f5;
      --mono: "Geist Mono", ui-monospace, monospace;
      --muted: #9a9a9a;
      --page: #0a0a0a;
      --paper: #141414;
      --soft: #5c5c5c;
      --accent-tint: rgba(255, 90, 54, 0.12);
    }

    body {
      align-items: center;
      background: var(--page);
      display: flex;
      font-family: var(--mono);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .terminal {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 1200px;
      overflow: hidden;
      width: 100%;
    }

    .titlebar {
      align-items: center;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    .dot {
      background: var(--soft);
      border-radius: 50%;
      height: 10px;
      width: 10px;
    }

    .dot.accent {
      background: var(--accent);
    }

    .titlebar-name {
      color: var(--muted);
      flex: 1;
      font: 500 0.7rem var(--mono);
      letter-spacing: 0.04em;
      margin-right: 46px;
      text-align: center;
    }

    .frame {
      padding: 2.25rem 2.5rem 2.5rem;
    }

    .prompt {
      color: var(--muted);
      display: flex;
      font: 500 0.8rem var(--mono);
      gap: 0.6em;
      letter-spacing: 0.01em;
      margin-bottom: 0.9rem;
    }

    .prompt .sign {
      color: var(--accent);
    }

    h1 {
      color: var(--ink);
      font: 700 clamp(1.5rem, 2.2vw + 0.8rem, 2.05rem)/1.2 var(--mono);
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
    }

    h1::before {
      color: var(--soft);
      content: "# ";
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }

    .ring {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.2;
    }

    .spoke {
      fill: none;
      stroke: var(--soft);
      stroke-dasharray: 5 4;
      stroke-width: 1;
    }

    .station {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 1;
    }

    .station.focal {
      fill: var(--accent-tint);
      stroke: var(--accent);
      stroke-width: 1.4;
    }

    .hub {
      fill: var(--ink);
    }

    .node-name {
      fill: var(--ink);
      font: 600 14px var(--mono);
      text-anchor: middle;
    }

    .focal-name {
      fill: var(--accent);
    }

    .sublabel {
      fill: var(--muted);
      font: 400 9.5px var(--mono);
      text-anchor: middle;
    }

    .hub-name {
      fill: var(--paper);
      font: 700 18px var(--mono);
      text-anchor: middle;
    }

    .hub-sub {
      fill: var(--paper);
      font: 400 9.5px var(--mono);
      opacity: 0.7;
      text-anchor: middle;
    }

    .arrow-label {
      fill: var(--muted);
      font: 500 9px var(--mono);
      letter-spacing: 0.08em;
      text-anchor: middle;
    }
  </style>
</head>
<body>
<div class="terminal">
  <div class="titlebar">
    <div class="dot accent"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="titlebar-name">loop.sh — self-improving-loop</div>
  </div>
  <main class="frame">
    <p class="prompt">
      <span class="sign">$</span> diagram-design render --type loop
    </p>
    <h1>The self-improving loop</h1>

    <svg
        aria-labelledby="loop-terminal-title loop-terminal-desc"
        role="img"
        viewBox="0 0 1040 680"
        xmlns="http://www.w3.org/2000/svg"
    >
      <title id="loop-terminal-title">The self-improving loop</title>
      <desc id="loop-terminal-desc">
        Six stations flow clockwise from Capture through Learn and back to
        Capture. Each station writes shared state into one central memory
        hub, with Decide highlighted as the human approval gate.
      </desc>
      <defs>
        <pattern
            height="22"
            id="dots"
            patternUnits="userSpaceOnUse"
            width="22"
        >
          <circle cx="1" cy="1" fill="rgba(255,255,255,0.08)" r="0.9"/>
        </pattern>
        <marker
            id="arrow"
            markerHeight="6"
            markerWidth="8"
            orient="auto"
            refX="7"
            refY="3"
        >
          <polygon fill="#9a9a9a" points="0 0, 8 3, 0 6"/>
        </marker>
        <marker
            id="arrow-soft"
            markerHeight="6"
            markerWidth="8"
            orient="auto"
            refX="7"
            refY="3"
        >
          <polygon fill="#5c5c5c" points="0 0, 8 3, 0 6"/>
        </marker>
      </defs>
      <rect fill="#141414" height="680" width="1040"/>
      <rect fill="url(#dots)" height="680" opacity="0.7" width="1040"/>

      <!-- Solid clockwise ring: six arcs on the same r=240 station circle. -->
      <path
          class="ring"
          d="M600 113.726 A240 240 0 0 1 704.969 187.073"
          marker-end="url(#arrow)"
      />
      <path
          class="ring"
          d="M743.285 252 A240 240 0 0 1 743.722 426.882"
          marker-end="url(#arrow)"
      />
      <path
          class="ring"
          d="M705.731 492 A240 240 0 0 1 601.130 565.871"
          marker-end="url(#arrow)"
      />
      <path
          class="ring"
          d="M440 566.274 A240 240 0 0 1 335.031 492.927"
          marker-end="url(#arrow)"
      />
      <path
          class="ring"
          d="M296.715 428 A240 240 0 0 1 296.278 253.118"
          marker-end="url(#arrow)"
      />
      <path
          class="ring"
          d="M334.269 188 A240 240 0 0 1 438.870 114.129"
          marker-end="url(#arrow)"
      />

      <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
      <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)"/>
      <path
          class="spoke"
          d="M672 252 L616 284"
          marker-end="url(#arrow-soft)"
      />
      <path
          class="spoke"
          d="M672 428 L616 396"
          marker-end="url(#arrow-soft)"
      />
      <path class="spoke" d="M520 548 V400" marker-end="url(#arrow-soft)"/>
      <path
          class="spoke"
          d="M368 428 L424 396"
          marker-end="url(#arrow-soft)"
      />
      <path
          class="spoke"
          d="M368 252 L424 284"
          marker-end="url(#arrow-soft)"
      />

      <!-- Curated spoke labels sit beside the line with an 8px visible gap. -->
      <rect fill="#141414" height="17" rx="4" width="52" x="530" y="199"/>
      <text class="arrow-label" x="556" y="211.5">SIGNALS</text>
      <rect fill="#141414" height="17" rx="4" width="58" x="457" y="463"/>
      <text class="arrow-label" x="486" y="475.5">OUTCOMES</text>

      <!-- Stations -->
      <rect class="station" height="64" rx="6" width="160" x="440" y="68"/>
      <text class="node-name" x="520" y="96.5">Capture</text>
      <text class="sublabel" x="520" y="116.5">signals in / intake</text>

      <rect
          class="station"
          height="64"
          rx="6"
          width="160"
          x="648"
          y="188"
      />
      <text class="node-name" x="728" y="216.5">Research</text>
      <text class="sublabel" x="728" y="236.5">evidence pulled</text>

      <rect
          class="station focal"
          height="64"
          rx="6"
          width="160"
          x="648"
          y="428"
      />
      <text class="node-name focal-name" x="728" y="456.5">Decide</text>
      <text class="sublabel" x="728" y="476.5">human approves</text>

      <rect
          class="station"
          height="64"
          rx="6"
          width="160"
          x="440"
          y="548"
      />
      <text class="node-name" x="520" y="576.5">Act</text>
      <text class="sublabel" x="520" y="596.5">work ships</text>

      <rect
          class="station"
          height="64"
          rx="6"
          width="160"
          x="232"
          y="428"
      />
      <text class="node-name" x="312" y="456.5">Measure</text>
      <text class="sublabel" x="312" y="476.5">outcomes logged</text>

      <rect
          class="station"
          height="64"
          rx="6"
          width="160"
          x="232"
          y="188"
      />
      <text class="node-name" x="312" y="216.5">Learn</text>
      <text class="sublabel" x="312" y="236.5">playbook updated</text>

      <!-- The one shared-state hub. -->
      <rect class="hub" height="104" rx="8" width="200" x="420" y="288"/>
      <text class="hub-name" x="520" y="337.5">Shared memory</text>
      <text class="hub-sub" x="520" y="360.5">one record, every loop</text>
    </svg>
  </main>
</div>
</body>
</html>
