<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>The CLAUDE.md Hierarchy</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Nested · Diagram Design</p>
  <h1>The CLAUDE.md Hierarchy</h1>

  <svg aria-labelledby="nested-title nested-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="nested-title">The CLAUDE.md Hierarchy</title>
    <desc id="nested-desc">Nested diagram showing how project CLAUDE.md instructions inherit broader
      scopes from the global, vault, business, and marketing levels.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(45,49,66,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Level 1: ~/.claude/ (global) — outermost -->
    <rect fill="rgba(45,49,66,0.015)" height="380" rx="8" stroke="rgba(45,49,66,0.30)" stroke-width="1" width="920"
          x="40" y="60"/>
    <!-- Level 2: ~/vault/ -->
    <rect fill="rgba(45,49,66,0.02)" height="308" rx="8" stroke="rgba(45,49,66,0.35)" stroke-width="1" width="856"
          x="72" y="96"/>
    <!-- Level 3: /business -->
    <rect fill="rgba(45,49,66,0.025)" height="236" rx="8" stroke="rgba(45,49,66,0.45)" stroke-width="1" width="792"
          x="104" y="132"/>
    <!-- Level 4: /marketing -->
    <rect fill="rgba(45,49,66,0.03)" height="164" rx="8" stroke="#4f5d75" stroke-width="1" width="728"
          x="136" y="168"/>
    <!-- Level 5: /project — innermost, coral focal -->
    <rect fill="rgba(235,108,54,0.06)" height="92" rx="8" stroke="#eb6c36" stroke-width="1" width="664"
          x="168" y="204"/>

    <!-- Level labels on paper-colored masks -->
    <rect fill="#f5f5f5" height="16" width="188" x="56" y="52"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="64"
          y="64">~/.claude/ (global)
    </text>

    <rect fill="#f5f5f5" height="16" width="148" x="88" y="88"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="96"
          y="100">~/vault/ (notes)
    </text>

    <rect fill="#f5f5f5" height="16" width="96" x="120" y="124"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="128"
          y="136">/business
    </text>

    <rect fill="#f5f5f5" height="16" width="108" x="152" y="160"/>
    <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="160"
          y="172">/marketing
    </text>

    <rect fill="#f5f5f5" height="16" width="88" x="184" y="196"/>
    <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.14em"
          x="192" y="208">/project
    </text>

    <!-- File-icon glyphs (simple rect with folded corner) inside each level -->
    <!-- Glyph in level 1 (bottom-right area of outer ring) -->
    <g transform="translate(908, 408)">
      <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="rgba(45,49,66,0.35)"
            stroke-width="1"/>
      <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
    </g>
    <!-- Glyph in level 2 ring -->
    <g transform="translate(876, 372)">
      <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="rgba(45,49,66,0.40)"
            stroke-width="1"/>
      <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
    </g>
    <!-- Glyph in level 3 ring -->
    <g transform="translate(844, 336)">
      <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="rgba(45,49,66,0.50)"
            stroke-width="1"/>
      <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.50)" stroke-width="1"/>
    </g>
    <!-- Glyph in level 4 ring -->
    <g transform="translate(812, 300)">
      <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <path d="M16 0 L16 4 L20 4" fill="none" stroke="#4f5d75" stroke-width="1"/>
    </g>

    <!-- Innermost label — human readable -->
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle"
          x="500" y="248">CLAUDE.md
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em" text-anchor="middle"
          x="500" y="272">inherits every level above
    </text>

    <!-- Annotation top-right: italic callout with curved arrow -->
    <text fill="#2d3142" font-family="'Instrument Serif', serif" font-size="14" font-style="italic" text-anchor="end"
          x="904" y="36">no imports, no configuration
    </text>
    <path d="M 820 44 Q 700 84 520 216" fill="none" stroke="rgba(45,49,66,0.40)" stroke-dasharray="4,3"
          stroke-width="1"/>
    <circle cx="520" cy="216" fill="#2d3142" r="2"/>

    <!-- Annotation bottom-left: italic callout -->
    <text fill="#4f5d75" font-family="'Instrument Serif', serif" font-size="14" font-style="italic" x="40"
          y="484">structure IS the index
    </text>
  </svg>
</div>
</body>
</html>
