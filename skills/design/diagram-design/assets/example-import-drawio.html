<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Imported from draw.io — Order platform</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36; /* atomic-tangerine */
      --color-ink: #2d3142; /* jet-black */
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75; /* blue-slate */
      --color-paper: #f5f5f5; /* white-smoke */
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · Imported from draw.io · doc-inline · balanced</p>
  <h1>Order platform — request path</h1>

  <svg aria-labelledby="import-drawio-title import-drawio-desc" role="img" viewBox="0 0 960 600"
       xmlns="http://www.w3.org/2000/svg">
    <title id="import-drawio-title">Order platform — request path</title>
    <desc id="import-drawio-desc">Architecture diagram showing web and mobile clients entering
      through an API Gateway, then reaching authentication, orders, Postgres, object storage, and
      Redis.
    </desc>
    <defs>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#4f5d75" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#eb6c36" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#2e5aa8" points="0 0, 8 3, 0 6"/>
      </marker>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>

    <!-- Zones -->
    <rect fill="none" height="224" rx="8" stroke="rgba(45,49,66,0.12)" stroke-width="1" width="200" x="40"
          y="96"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="56"
          y="120">EDGE
    </text>

    <rect fill="none" height="224" rx="8" stroke="rgba(45,49,66,0.12)" stroke-width="1" width="560" x="320"
          y="96"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="336"
          y="120">CORE SERVICES
    </text>

    <rect fill="none" height="112" rx="8" stroke="rgba(45,49,66,0.12)" stroke-width="1" width="560" x="320"
          y="368"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="336"
          y="392">DATA
    </text>

    <!-- Connectors (drawn before boxes) -->
    <!-- Web App -> API Gateway -->
    <path d="M220,164 H272 A8,8 0 0 1 280,172 V192 A8,8 0 0 0 288,200 H360" fill="none"
          marker-end="url(#arrow-link)" stroke="#2e5aa8" stroke-width="1.2"/>
    <!-- Mobile App -> API Gateway -->
    <path d="M220,252 H296 A8,8 0 0 0 304,244 V232 A8,8 0 0 1 312,224 H360" fill="none"
          marker-end="url(#arrow-link)" stroke="#2e5aa8" stroke-width="1.2"/>
    <!-- API Gateway -> Auth Service -->
    <path d="M560,192 H592 A8,8 0 0 0 600,184 V164 A8,8 0 0 1 608,156 H640" fill="none"
          marker-end="url(#arrow)" stroke="#4f5d75" stroke-width="1.2"/>
    <!-- API Gateway -> Orders Service -->
    <path d="M560,224 H592 A8,8 0 0 0 600,232 V252 A8,8 0 0 1 608,260 H640" fill="none"
          marker-end="url(#arrow)" stroke="#4f5d75" stroke-width="1.2"/>
    <!-- Orders Service -> Postgres -->
    <path d="M680,288 V320 A8,8 0 0 1 672,328 H432 A8,8 0 0 0 424,336 V392" fill="none"
          marker-end="url(#arrow)" stroke="#4f5d75" stroke-width="1.2"/>
    <!-- Orders Service -> Object Store (async) -->
    <path d="M760,288 V344 A8,8 0 0 1 752,352 H616 A8,8 0 0 0 608,360 V392" fill="none"
          marker-end="url(#arrow)" stroke="#4f5d75" stroke-dasharray="5,4" stroke-width="1.2"/>
    <!-- Auth Service -> Redis (async) -->
    <path d="M840,156 H848 A8,8 0 0 1 856,164 V392" fill="none" marker-end="url(#arrow)" stroke="#4f5d75"
          stroke-dasharray="5,4" stroke-width="1.2"/>

    <!-- Arrow labels -->
    <rect fill="#f5f5f5" height="12" rx="2" width="44" x="228" y="144"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle"
          x="250" y="153">HTTPS
    </text>

    <rect fill="#f5f5f5" height="12" rx="2" width="44" x="228" y="232"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle"
          x="250" y="241">HTTPS
    </text>

    <rect fill="#f5f5f5" height="12" rx="2" width="44" x="568" y="172"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle"
          x="590" y="181">VERIFY
    </text>

    <rect fill="#f5f5f5" height="12" rx="2" width="44" x="568" y="204"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle"
          x="590" y="213">ROUTE
    </text>

    <rect fill="#f5f5f5" height="12" rx="2" width="32" x="536" y="308"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle"
          x="552" y="317">SQL
    </text>

    <rect fill="#f5f5f5" height="12" rx="2" width="56" x="768" y="326"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle"
          x="796" y="335">ARCHIVE
    </text>

    <rect fill="#f5f5f5" height="12" rx="2" width="56" x="792" y="196"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle"
          x="820" y="205">CACHE
    </text>

    <!-- Nodes: Edge -->
    <rect fill="#f5f5f5" height="56" rx="6" width="160" x="60" y="136"/>
    <rect fill="rgba(79,93,117,0.10)" height="56" rx="6" stroke="#7a8399" stroke-width="1" width="160" x="60"
          y="136"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="140" y="169">Web App
    </text>

    <rect fill="#f5f5f5" height="56" rx="6" width="160" x="60" y="224"/>
    <rect fill="rgba(79,93,117,0.10)" height="56" rx="6" stroke="#7a8399" stroke-width="1" width="160" x="60"
          y="224"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="140" y="257">Mobile App
    </text>

    <!-- Nodes: Core -->
    <rect fill="#f5f5f5" height="64" rx="6" width="200" x="360" y="176"/>
    <rect fill="rgba(235,108,54,0.08)" height="64" rx="6" stroke="#eb6c36" stroke-width="1" width="200"
          x="360" y="176"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="460" y="204">API Gateway
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="460"
          y="220">single entry point
    </text>

    <rect fill="#f5f5f5" height="56" rx="6" width="200" x="640" y="128"/>
    <rect fill="#ffffff" height="56" rx="6" stroke="#2d3142" stroke-width="1" width="200" x="640"
          y="128"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="740" y="153">Auth Service
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="740"
          y="169">token check
    </text>

    <rect fill="#f5f5f5" height="56" rx="6" width="200" x="640" y="232"/>
    <rect fill="#ffffff" height="56" rx="6" stroke="#2d3142" stroke-width="1" width="200" x="640"
          y="232"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="740" y="257">Orders Service
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="740"
          y="273">order write
    </text>

    <!-- Nodes: Data -->
    <rect fill="#f5f5f5" height="64" rx="6" width="160" x="344" y="392"/>
    <rect fill="rgba(45,49,66,0.05)" height="64" rx="6" stroke="#4f5d75" stroke-width="1" width="160" x="344"
          y="392"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="424" y="420">Postgres
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="424"
          y="436">orders
    </text>

    <rect fill="#f5f5f5" height="64" rx="6" width="160" x="528" y="392"/>
    <rect fill="rgba(45,49,66,0.05)" height="64" rx="6" stroke="#4f5d75" stroke-width="1" width="160" x="528"
          y="392"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="608" y="420">Object Store
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="608"
          y="436">archive
    </text>

    <rect fill="#f5f5f5" height="64" rx="6" width="160" x="712" y="392"/>
    <rect fill="rgba(45,49,66,0.05)" height="64" rx="6" stroke="#4f5d75" stroke-width="1" width="160" x="712"
          y="392"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="792" y="420">Redis
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="792"
          y="436">sessions
    </text>

    <!-- Legend -->
    <line stroke="rgba(45,49,66,0.10)" stroke-width="0.8" x1="40" x2="920" y1="512" y2="512"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="40"
          y="532">LEGEND
    </text>

    <rect fill="rgba(235,108,54,0.08)" height="10" rx="2" stroke="#eb6c36" stroke-width="1" width="16"
          x="120" y="524"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" x="144"
          y="532">FOCAL
    </text>

    <rect fill="#ffffff" height="10" rx="2" stroke="#2d3142" stroke-width="1" width="16" x="240"
          y="524"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" x="264"
          y="532">SERVICE
    </text>

    <rect fill="rgba(45,49,66,0.05)" height="10" rx="2" stroke="#4f5d75" stroke-width="1" width="16" x="376"
          y="524"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" x="400"
          y="532">STORE
    </text>

    <rect fill="rgba(79,93,117,0.10)" height="10" rx="2" stroke="#7a8399" stroke-width="1" width="16" x="496"
          y="524"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" x="520"
          y="532">CLIENT
    </text>

    <line stroke="#2e5aa8" stroke-width="1.2" x1="616" x2="648" y1="529" y2="529"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" x="656"
          y="532">HTTP CALL
    </text>

    <line stroke="#4f5d75" stroke-dasharray="5,4" stroke-width="1.2" x1="772" x2="804" y1="529"
          y2="529"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" x="812"
          y="532">ASYNC
    </text>
  </svg>
</div>
</body>
</html>
