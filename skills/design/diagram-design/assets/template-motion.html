<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Motion diagram template</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --color-accent: #eb6c36;
      --motion-ease: cubic-bezier(.2, .8, .2, 1);
      --motion-fast: 160ms;
      --motion-hold: 720ms;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --color-rule: rgba(45, 49, 66, 0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --color-soft: #7a8399;
      --motion-step: 480ms;
      --motion-total: 3600ms;
    }

    body {
      background: var(--color-paper);
      color: var(--color-ink);
      display: grid;
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      padding: 48px 32px;
      place-items: center;
    }

    [data-motion-root] {
      width: min(100%, 1000px);
    }

    .eyebrow {
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      margin: 0 0 8px;
      text-transform: uppercase;
    }

    h1 {
      font: 400 32px/1.15 var(--font-serif);
      margin: 0 0 24px;
    }

    svg {
      display: block;
      min-width: 720px;
      width: 100%;
    }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
      transform var(--motion-step) var(--motion-ease);
    }

    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }

    .draw-path {
      fill: none;
      pointer-events: none;
      stroke: var(--color-accent);
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      stroke-width: 3;
    }

    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }

    .flow-token {
      opacity: 0;
      pointer-events: none;
    }

    .motion-ready.is-playing .flow-token.is-visible {
      animation: token-flow 3.2s linear 1 forwards;
      opacity: 1;
    }

    .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible {
      animation-iteration-count: infinite;
    }

    @keyframes draw-path {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes token-flow {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(240px);
      }
    }

    [data-motion-controls] {
      align-items: center;
      border-top: 1px solid var(--color-rule);
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
    }

    .motion-ready [data-motion-controls] {
      display: flex;
    }

    [data-motion-controls][hidden] {
      display: none !important;
    }

    [data-motion-controls] button {
      background: var(--color-paper);
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      cursor: pointer;
      font: 600 12px/1 var(--font-sans);
      min-height: 44px;
      min-width: 44px;
      padding: 8px 12px;
    }

    [data-motion-controls] button:hover {
      border-color: var(--color-accent);
    }

    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }

    [data-motion-controls] button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    [data-motion-status-visible] {
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      margin-left: auto;
    }

    .sr-only {
      border: 0;
      clip: rect(0, 0, 0, 0);
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }

    noscript p {
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      margin: 12px 0 0;
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] {
      display: none !important;
    }

    html[data-motion="static"] [data-motion-item] {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }

    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] {
      display: none !important;
    }

    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }

      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
      }

      [data-motion-decorative] {
        display: none !important;
      }

      [data-motion-controls] {
        display: none !important;
      }
    }

    @media print {
      [data-motion-controls], [data-motion-decorative] {
        display: none !important;
      }

      [data-motion-item] {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
<!-- Replace template-motion in IDs and prose when copying this file. -->
<main data-frame="static" data-motion-mode="step" data-motion-root data-static-frame="complete"
      data-step-count="5" data-step-current="5">
  <p class="eyebrow">Process · Optional motion</p>
  <h1>Request evaluation</h1>

  <svg aria-labelledby="template-motion-title template-motion-desc" role="img" viewBox="0 0 960 480"
       xmlns="http://www.w3.org/2000/svg">
    <title id="template-motion-title">Request evaluation</title>
    <desc id="template-motion-desc">A request is validated, evaluated against a policy, queued, and
      appended to an audit log.
    </desc>
    <defs>
      <marker id="template-motion-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7"
              refY="3">
        <polygon fill="#4f5d75" points="0 0, 8 3, 0 6"/>
      </marker>
    </defs>
    <rect fill="#f5f5f5" height="480" width="960"/>

    <!-- Persistent connectors carry the static meaning. -->
    <path d="M248 180 H356" fill="none" marker-end="url(#template-motion-arrow)" stroke="#4f5d75"/>
    <path d="M556 180 H664" fill="none" marker-end="url(#template-motion-arrow)" stroke="#4f5d75"/>
    <path d="M764 232 V328" fill="none" marker-end="url(#template-motion-arrow)" stroke="#4f5d75"/>

    <g aria-label="Step 1: Request received" data-motion-item data-step="1">
      <rect fill="#f5f5f5" height="104" rx="8" stroke="#2d3142" width="200" x="48" y="128"/>
      <text fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600"
            text-anchor="middle"
            x="148" y="172">Request
      </text>
      <text fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle"
            x="148"
            y="196">fields complete
      </text>
    </g>
    <g aria-label="Step 2: Policy passed" data-motion-item data-step="2">
      <rect fill="rgba(235,108,54,0.08)" height="104" rx="8" stroke="#eb6c36" width="200" x="356"
            y="128"/>
      <text fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600"
            text-anchor="middle"
            x="456" y="168">Policy
      </text>
      <text fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle"
            x="456"
            y="196">✓ PASS · rule 2
      </text>
    </g>
    <g aria-label="Step 3: Three items queued" data-motion-item data-step="3">
      <rect fill="#f5f5f5" height="104" rx="8" stroke="#2d3142" width="200" x="664" y="128"/>
      <text fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600"
            text-anchor="middle"
            x="764" y="164">Queue
      </text>
      <rect fill="#4f5d75" height="16" width="16" x="700" y="184"/>
      <rect fill="#4f5d75" height="16" width="16" x="724" y="184"/>
      <rect fill="#4f5d75" height="16" width="16" x="748" y="184"/>
      <text fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12" x="796" y="196">3
        queued
      </text>
    </g>
    <g aria-label="Step 4: Audit entry appended" data-motion-item data-step="4">
      <rect fill="#f5f5f5" height="88" rx="8" stroke="#2d3142" width="200" x="664" y="328"/>
      <text fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600"
            text-anchor="middle"
            x="764" y="364">Audit log
      </text>
      <text fill="#4f5d75" font-family="Geist Mono, monospace" font-size="12" text-anchor="middle"
            x="764"
            y="388">0042 · appended
      </text>
    </g>
    <g aria-label="Step 5: Evaluation complete" data-motion-item data-step="5">
      <text fill="#2d3142" font-family="Geist, sans-serif" font-size="16" font-weight="600" x="48"
            y="376">Outcome: accepted and recorded
      </text>
    </g>

    <!-- Decorative duplicate path and token never carry unique meaning. -->
    <path aria-hidden="true" class="draw-path" d="M248 180 H356" data-motion-decorative
          data-motion-item
          data-step="2" focusable="false" pathLength="1"/>
    <circle aria-hidden="true" class="flow-token" cx="556" cy="180"
            data-motion-decorative data-motion-item data-step="3" fill="#eb6c36" focusable="false"
            r="6"/>
  </svg>

  <div aria-label="Diagram playback controls" data-motion-controls role="group">
    <button data-motion-action="prev" type="button">Previous</button>
    <button aria-pressed="false" data-motion-action="play" type="button">Play</button>
    <button aria-pressed="true" data-motion-action="pause" type="button">Pause</button>
    <button data-motion-action="next" type="button">Next</button>
    <button data-motion-action="replay" type="button">Replay</button>
    <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
    <span aria-hidden="true" data-motion-status-visible>Step <span data-motion-step-label>5</span> of 5</span>
  </div>
  <p aria-atomic="true" aria-live="polite" class="sr-only" data-motion-status role="status"></p>
  <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p>
  </noscript>
</main>

<script data-diagram-controls>
  (() => {
    const params = new URLSearchParams(location.search);
    const staticOverride = params.get('motion') === 'static'
        || document.documentElement.dataset.motion === 'static';
    const requestedStep = params.get('step');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    document.fonts.ready.then(() => {
      document.documentElement.dataset.fontsReady = 'true';
    });

    document.querySelectorAll('[data-motion-root]').forEach((root) => {
      const count = Number(root.dataset.stepCount);
      const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
      const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(
          requestedStep) : null;
      const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep)
      && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
      const items = [...root.querySelectorAll('[data-motion-item]')];
      const labels = Array.from({length: count + 1}, (_, index) => index === 0
          ? 'Ready'
          : items.filter(
              (item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step)
                  === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
      const controls = root.querySelector('[data-motion-controls]');
      const status = root.querySelector('[data-motion-status]');
      const visibleStep = root.querySelector('[data-motion-step-label]');
      let step = count;
      let timer = 0;
      let playing = false;
      let stepBeforeReduce = 0;
      let resumeAfterReduce = root.dataset.motionMode === 'reveal';

      const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
      const clearClock = () => {
        window.clearTimeout(timer);
        timer = 0;
      };
      const announce = () => {
        status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`;
      };
      const setControlsAvailable = (available) => {
        controls.hidden = !available;
        controls.setAttribute('aria-hidden', String(!available));
        controls.dataset.playbackDisabled = String(!available);
        controls.querySelectorAll('button').forEach((control) => {
          control.disabled = !available;
        });
      };

      function render(next, userInitiated = false) {
        step = Math.max(0, Math.min(count, next));
        root.dataset.stepCurrent = String(step);
        root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
        items.forEach((item) => {
          const itemStep = Number(item.dataset.step);
          item.classList.toggle('is-visible', itemStep <= step);
          item.classList.toggle('is-current', itemStep === step);
        });
        if (visibleStep) {
          visibleStep.textContent = String(step);
        }
        const unavailable = controls.dataset.playbackDisabled === 'true';
        buttons('prev').disabled = unavailable || step === 0;
        buttons('next').disabled = unavailable || step === count;
        if (userInitiated) {
          announce();
        }
      }

      function pause(userInitiated = false) {
        clearClock();
        playing = false;
        root.classList.remove('is-playing');
        buttons('play').setAttribute('aria-pressed', 'false');
        buttons('pause').setAttribute('aria-pressed', 'true');
        if (userInitiated) {
          status.textContent = `Paused at step ${step} of ${count}`;
        }
      }

      function finish() {
        pause(false);
        root.dataset.frame = 'end';
        status.textContent = `Complete · step ${count} of ${count}`;
      }

      function tick() {
        if (!playing) {
          return;
        }
        if (step >= count) {
          finish();
          return;
        }
        render(step + 1, false);
        if (step >= count) {
          finish();
          return;
        }
        timer = window.setTimeout(tick, hold);
      }

      function play(fromStart = false, userInitiated = false) {
        clearClock();
        if (fromStart || step >= count) {
          render(0, userInitiated);
        }
        playing = true;
        root.classList.add('is-playing');
        buttons('play').setAttribute('aria-pressed', 'true');
        buttons('pause').setAttribute('aria-pressed', 'false');
        timer = window.setTimeout(tick, hold);
      }

      controls.addEventListener('click', (event) => {
        const button = event.target.closest('[data-motion-action]');
        if (!button) {
          return;
        }
        const action = button.dataset.motionAction;
        if (action === 'play') {
          play(false, true);
        }
        if (action === 'pause') {
          pause(true);
        }
        if (action === 'replay') {
          play(true, true);
        }
        if (action === 'prev') {
          pause(false);
          render(step - 1, true);
        }
        if (action === 'next') {
          pause(false);
          render(step + 1, true);
        }
      });

      root.addEventListener('keydown', (event) => {
        if (event.target.matches('input, textarea, select, a[href]')) {
          return;
        }
        const keys = {ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count};
        if (event.code === 'Space' && !event.target.closest('button')) {
          event.preventDefault();
          playing ? pause(true) : play(false, true);
          return;
        }
        if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
          event.preventDefault();
          play(true, true);
          return;
        }
        if (!(event.key in keys)) {
          return;
        }
        event.preventDefault();
        pause(false);
        render(keys[event.key], true);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && playing) {
          pause(false);
        }
      });
      reduce.addEventListener('change', (event) => {
        if (event.matches && root.dataset.motionState !== 'reduced') {
          stepBeforeReduce = step;
          resumeAfterReduce = playing;
        }
        pause(false);
        if (event.matches) {
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'reduced';
          status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
        } else if (staticOverride || root.dataset.motionMode === 'none') {
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else {
          delete root.dataset.motionState;
          if (exactStep !== null) {
            setControlsAvailable(false);
            render(exactStep, false);
            root.dataset.frame = 'step';
            root.dataset.motionState = 'test';
            status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
          } else {
            setControlsAvailable(true);
            render(stepBeforeReduce, false);
            status.textContent = `Ready · step ${step} of ${count}`;
            if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
              play(false, false);
            }
          }
          resumeAfterReduce = false;
        }
      });

      if (staticOverride) {
        document.documentElement.dataset.motion = 'static';
        pause(false);
        setControlsAvailable(false);
        render(count, false);
        root.dataset.frame = 'static';
        root.dataset.motionState = 'static';
        status.textContent = 'Static frame · complete diagram · playback controls unavailable';
      } else if (reduce.matches || root.dataset.motionMode === 'none') {
        pause(false);
        setControlsAvailable(false);
        render(count, false);
        root.dataset.frame = 'static';
        root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
        status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
      } else if (exactStep !== null) {
        document.documentElement.dataset.motion = 'step';
        pause(false);
        setControlsAvailable(false);
        render(exactStep, false);
        root.dataset.frame = 'step';
        root.dataset.motionState = 'test';
        status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
      } else if (root.dataset.motionMode === 'reveal') {
        setControlsAvailable(true);
        render(0, false);
        play(false, false);
      } else {
        pause(false);
        setControlsAvailable(true);
        render(0, false);
        status.textContent = `Ready · step 0 of ${count}`;
      }
      root.classList.add('motion-ready');
    });
  })();
</script>
</body>
</html>
