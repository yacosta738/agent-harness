<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Diagram</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36; /* atomic-tangerine */
      --color-ink: #2d3142; /* jet-black */
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75; /* blue-slate */
      --color-paper: #f5f5f5; /* white-smoke */
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">[Type] · Diagram Design</p>
  <h1>[Diagram title]</h1>

  <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
  <svg aria-labelledby="[diagram-slug]-title [diagram-slug]-desc" role="img" viewBox="0 0 1000 600"
       xmlns="http://www.w3.org/2000/svg">
    <title id="[diagram-slug]-title">[Diagram title]</title>
    <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
    <defs>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#4f5d75" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#eb6c36" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#2e5aa8" points="0 0, 8 3, 0 6"/>
      </marker>

      <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
      <!--
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
      </pattern>
      -->
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

    <!-- Draw arrows first, then nodes. Replace with your content. -->

  </svg>
</div>
</body>
</html>
