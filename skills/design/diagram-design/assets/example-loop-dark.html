<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>The self-improving loop · Dark</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet"/>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #f08a59;
      --ink: #f5f5f5;
      --link: #6a95d8;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --muted: #bfc0c0;
      --paper: #2d3142;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #8e98ac;
      --accent-tint: rgba(240, 138, 89, 0.10);
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--muted);
      font: 500 0.66rem var(--mono);
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--ink);
      font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }

    .ring {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.2;
    }

    .spoke {
      fill: none;
      stroke: var(--soft);
      stroke-dasharray: 5 4;
      stroke-width: 1;
    }

    .station {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 1;
    }

    .station.focal {
      fill: var(--accent-tint);
      stroke: var(--accent);
      stroke-width: 1.2;
    }

    .hub {
      fill: var(--ink);
    }

    .node-name {
      fill: var(--ink);
      font: 600 12px var(--sans);
      text-anchor: middle;
    }

    .focal-name {
      fill: var(--accent);
    }

    .sublabel {
      fill: var(--soft);
      font: 400 8px var(--mono);
      text-anchor: middle;
    }

    .hub-name {
      fill: var(--paper);
      font: 600 16px var(--sans);
      text-anchor: middle;
    }

    .hub-sub {
      fill: var(--paper);
      font: 400 8px var(--mono);
      opacity: 0.72;
      text-anchor: middle;
    }

    .arrow-label {
      fill: var(--soft);
      font: 400 8px var(--mono);
      letter-spacing: 0.06em;
      text-anchor: middle;
    }
  </style>
</head>
<body>
<main class="frame">
  <p class="eyebrow">Loop · Diagram Design</p>
  <h1>The self-improving loop</h1>

  <svg aria-labelledby="loop-dark-title loop-dark-desc" role="img" viewBox="0 0 1040 680"
       xmlns="http://www.w3.org/2000/svg">
    <title id="loop-dark-title">The self-improving loop</title>
    <desc id="loop-dark-desc">Six stations flow clockwise from Capture through Learn and back to
      Capture. Each station writes shared state into one central memory hub, with Decide highlighted
      as the human approval gate.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#bfc0c0" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#f08a59" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#6a95d8" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-soft" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#8e98ac" points="0 0, 8 3, 0 6"/>
      </marker>
    </defs>
    <rect fill="#2d3142" height="680" width="1040"/>
    <rect fill="url(#dots)" height="680" opacity="0.55" width="1040"/>

    <!-- Solid clockwise ring: six arcs on the same r=240 station circle. -->
    <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#arrow)"/>
    <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#arrow)"/>
    <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#arrow)"/>
    <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#arrow)"/>
    <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#arrow)"/>
    <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#arrow)"/>

    <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
    <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)"/>
    <path class="spoke" d="M672 252 L616 284" marker-end="url(#arrow-soft)"/>
    <path class="spoke" d="M672 428 L616 396" marker-end="url(#arrow-soft)"/>
    <path class="spoke" d="M520 548 V400" marker-end="url(#arrow-soft)"/>
    <path class="spoke" d="M368 428 L424 396" marker-end="url(#arrow-soft)"/>
    <path class="spoke" d="M368 252 L424 284" marker-end="url(#arrow-soft)"/>

    <!-- Curated spoke labels sit beside the line with an 8px visible gap. -->
    <rect fill="#2d3142" height="16" rx="4" width="48" x="532" y="200"/>
    <text class="arrow-label" x="556" y="212">SIGNALS</text>
    <rect fill="#2d3142" height="16" rx="4" width="52" x="460" y="464"/>
    <text class="arrow-label" x="486" y="476">OUTCOMES</text>

    <!-- Stations -->
    <rect class="station" height="64" rx="6" width="160" x="440" y="68"/>
    <text class="node-name" x="520" y="96">Capture</text>
    <text class="sublabel" x="520" y="116">signals in / intake</text>

    <rect class="station" height="64" rx="6" width="160" x="648" y="188"/>
    <text class="node-name" x="728" y="216">Research</text>
    <text class="sublabel" x="728" y="236">evidence pulled</text>

    <rect class="station focal" height="64" rx="6" width="160" x="648" y="428"/>
    <text class="node-name focal-name" x="728" y="456">Decide</text>
    <text class="sublabel" x="728" y="476">human approves</text>

    <rect class="station" height="64" rx="6" width="160" x="440" y="548"/>
    <text class="node-name" x="520" y="576">Act</text>
    <text class="sublabel" x="520" y="596">work ships</text>

    <rect class="station" height="64" rx="6" width="160" x="232" y="428"/>
    <text class="node-name" x="312" y="456">Measure</text>
    <text class="sublabel" x="312" y="476">outcomes logged</text>

    <rect class="station" height="64" rx="6" width="160" x="232" y="188"/>
    <text class="node-name" x="312" y="216">Learn</text>
    <text class="sublabel" x="312" y="236">playbook updated</text>

    <!-- The one shared-state hub. -->
    <rect class="hub" height="104" rx="8" width="200" x="420" y="288"/>
    <text class="hub-name" x="520" y="336">Shared memory</text>
    <text class="hub-sub" x="520" y="360">one record, every loop</text>
  </svg>
</main>
</body>
</html>
