<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Sprint velocity · Bar chart · dark</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #f08a59;
      --color-ink: #f5f5f5;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #bfc0c0;
      --color-paper: #2d3142;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 760px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Bar · Diagram Design</p>
  <h1>Sprint velocity · 8-sprint view</h1>

  <svg aria-labelledby="bar-dark-title bar-dark-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="bar-dark-title">Sprint velocity · 8-sprint view</title>
    <desc id="bar-dark-desc">Bar chart showing story points delivered across sprints S1 through S8,
      with Sprint 5 as the record high.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Y-axis rotated label -->
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em" text-anchor="middle"
          transform="rotate(-90 24 230)" x="24" y="230">STORY
      POINTS
    </text>

    <!-- Horizontal gridlines (drawn before bars) -->
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="357" y2="357"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="293" y2="293"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="230" y2="230"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="167" y2="167"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="103" y2="103"/>
    <line stroke="rgba(245,245,245,0.06)" stroke-width="0.8" x1="80" x2="960" y1="40" y2="40"/>

    <!-- Y-axis line and X-axis baseline -->
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="80" x2="80" y1="40" y2="420"/>
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="80" x2="960" y1="420" y2="420"/>

    <!-- Y-axis tick labels -->
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="361">20
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="297">40
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="234">60
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="171">80
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="107">100
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="44">120
    </text>

    <!-- ─── BARS (pitch=110, width=72, pad=19) ─── -->
    <!-- S1: v=72, h=228, y=192 -->
    <rect fill="#f5f5f5" height="228" width="72" x="99" y="192"/>
    <rect fill="rgba(191,192,192,0.15)" height="228" stroke="#bfc0c0" stroke-width="1" width="72" x="99"
          y="192"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" x="135"
          y="184">72
    </text>

    <!-- S2: v=88, h=280, y=140 -->
    <rect fill="#f5f5f5" height="280" width="72" x="209" y="140"/>
    <rect fill="rgba(191,192,192,0.15)" height="280" stroke="#bfc0c0" stroke-width="1" width="72" x="209"
          y="140"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" x="245"
          y="132">88
    </text>

    <!-- S3: v=95, h=300, y=120 -->
    <rect fill="#f5f5f5" height="300" width="72" x="319" y="120"/>
    <rect fill="rgba(191,192,192,0.15)" height="300" stroke="#bfc0c0" stroke-width="1" width="72" x="319"
          y="120"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" x="355"
          y="112">95
    </text>

    <!-- S4: v=78, h=248, y=172 -->
    <rect fill="#f5f5f5" height="248" width="72" x="429" y="172"/>
    <rect fill="rgba(191,192,192,0.15)" height="248" stroke="#bfc0c0" stroke-width="1" width="72" x="429"
          y="172"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" x="465"
          y="164">78
    </text>

    <!-- S5 FOCAL: v=110, h=348, y=72 -->
    <rect fill="#f5f5f5" height="348" width="72" x="539" y="72"/>
    <rect fill="rgba(240,138,89,0.14)" height="348" stroke="#f08a59" stroke-width="1" width="72" x="539"
          y="72"/>
    <text fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle"
          x="575" y="64">110
    </text>

    <!-- S6: v=102, h=324, y=96 -->
    <rect fill="#f5f5f5" height="324" width="72" x="649" y="96"/>
    <rect fill="rgba(191,192,192,0.15)" height="324" stroke="#bfc0c0" stroke-width="1" width="72" x="649"
          y="96"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" x="685"
          y="88">102
    </text>

    <!-- S7: v=85, h=268, y=152 -->
    <rect fill="#f5f5f5" height="268" width="72" x="759" y="152"/>
    <rect fill="rgba(191,192,192,0.15)" height="268" stroke="#bfc0c0" stroke-width="1" width="72" x="759"
          y="152"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" x="795"
          y="144">85
    </text>

    <!-- S8: v=93, h=296, y=124 -->
    <rect fill="#f5f5f5" height="296" width="72" x="869" y="124"/>
    <rect fill="rgba(191,192,192,0.15)" height="296" stroke="#bfc0c0" stroke-width="1" width="72" x="869"
          y="124"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" x="905"
          y="116">93
    </text>

    <!-- X-axis category labels -->
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="135" y="440">S1
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="245" y="440">S2
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="355" y="440">S3
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="465" y="440">S4
    </text>
    <text fill="#f08a59" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="575" y="440">S5
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="685" y="440">S6
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="795" y="440">S7
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="905" y="440">S8
    </text>

    <!-- Legend -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="462" y2="462"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" x="40"
          y="478">LEGEND
    </text>

    <rect fill="rgba(240,138,89,0.14)" height="10" rx="2" stroke="#f08a59" stroke-width="1" width="16" x="40"
          y="488"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="64" y="497">Sprint 5 ·
      record high
    </text>

    <rect fill="rgba(191,192,192,0.15)" height="10" rx="2" stroke="#bfc0c0" stroke-width="1" width="16"
          x="220" y="488"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="244" y="497">Other
      sprints
    </text>
  </svg>
</div>
</body>
</html>
