<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Good design · Desirable × Feasible × Viable</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #f08a59;
      --color-ink: #f5f5f5;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #bfc0c0;
      --color-paper: #2d3142;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Venn · Diagram Design</p>
  <h1>Good design · Desirable × Feasible × Viable</h1>

  <svg aria-labelledby="venn-dark-title venn-dark-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="venn-dark-title">Good design · Desirable × Feasible × Viable</title>
    <desc id="venn-dark-desc">Venn diagram showing desirable, feasible, and viable product qualities
      intersecting at shippable.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
      <clipPath id="clip-center">
        <circle cx="500" cy="180" r="140"/>
      </clipPath>
      <clipPath id="clip-center-2">
        <circle cx="428" cy="320" r="140"/>
      </clipPath>
    </defs>

    <rect fill="#2d3142" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
    <!-- Desirable — top, ink -->
    <circle cx="500" cy="180" fill="rgba(245,245,245,0.04)" r="140" stroke="#f5f5f5"
            stroke-width="1"/>
    <!-- Feasible — bottom-left, muted -->
    <circle cx="428" cy="320" fill="rgba(191,192,192,0.05)" r="140" stroke="#bfc0c0"
            stroke-width="1"/>
    <!-- Viable — bottom-right, soft -->
    <circle cx="572" cy="320" fill="rgba(142,140,131,0.05)" r="140" stroke="#8e98ac"
            stroke-width="1"/>

    <!-- Coral focal tint on the all-three intersection -->
    <g clip-path="url(#clip-center)">
      <g clip-path="url(#clip-center-2)">
        <circle cx="572" cy="320" fill="rgba(240,138,89,0.14)" r="140"/>
      </g>
    </g>

    <!-- Set labels -->
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="middle"
          x="500" y="20">Desirable
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.14em" text-anchor="middle"
          x="500" y="36">PEOPLE WANT IT
    </text>

    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="start"
          x="152" y="400">Feasible
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.14em" text-anchor="start"
          x="152" y="416">WE CAN BUILD IT
    </text>

    <text fill="#8e98ac" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="end"
          x="848" y="400">Viable
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.14em" text-anchor="end"
          x="848" y="416">BUSINESS SUSTAINS
    </text>

    <!-- Pairwise intersection labels -->
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="360" y="232">Prototype
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="360"
          y="248">no business model
    </text>

    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="640" y="232">Vaporware
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="640"
          y="248">can't build it
    </text>

    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="500" y="368">Internal tool
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="500"
          y="384">nobody wants it
    </text>

    <!-- Focal: all-three center -->
    <text fill="#f08a59" font-family="'Geist', sans-serif" font-size="14" font-weight="600" text-anchor="middle"
          x="500" y="260">Shippable
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.14em" text-anchor="middle"
          x="500" y="276">THE SWEET SPOT
    </text>

    <!-- Legend strip -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="456" y2="456"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" x="40"
          y="472">LEGEND
    </text>

    <circle cx="52" cy="488" fill="none" r="6" stroke="#f08a59" stroke-width="1.2"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="68" y="492">All three
      — ship it
    </text>

    <circle cx="192" cy="488" fill="none" r="6" stroke="#bfc0c0" stroke-width="1"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="208" y="492">Two of
      three — incomplete
    </text>

    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" font-style="italic" x="380"
          y="492">Coral marks the intersection that earns the work. The others name the
      traps.
    </text>
  </svg>
</div>
</body>
</html>
