<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Storage backends · Capability radar</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #f08a59;
      --color-ink: #f5f5f5;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #bfc0c0;
      --color-paper: #2d3142;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Radar · Diagram Design</p>
  <h1>Storage backends · Capability radar</h1>

  <svg aria-labelledby="radar-dark-title radar-dark-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="radar-dark-title">Storage backends · Capability radar</title>
    <desc id="radar-dark-desc">Radar chart comparing MinIO, Amazon S3, Ceph, and Google Cloud
      Storage across five storage capabilities.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#2d3142" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Concentric grid rings -->
    <polygon fill="none" points="500,208 530,230 519,266 481,266 470,230"
             stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <polygon fill="none" points="500,176 561,220 538,292 462,292 439,220"
             stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <polygon fill="none" points="500,144 591,211 556,317 444,317 409,211"
             stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <polygon fill="none" points="500,112 622,201 575,343 425,343 378,201"
             stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
    <polygon fill="none" points="500,80 652,191 594,369 406,369 348,191"
             stroke="rgba(245,245,245,0.20)" stroke-width="1"/>

    <!-- Axis spokes -->
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="500" x2="500" y1="240" y2="80"/>
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="500" x2="652" y1="240" y2="191"/>
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="500" x2="594" y1="240" y2="369"/>
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="500" x2="406" y1="240" y2="369"/>
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="500" x2="348" y1="240" y2="191"/>

    <!-- Axis labels -->
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle"
          x="500" y="62">Small-file handling
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="start"
          x="669" y="189">Large-object reads
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="start"
          x="605" y="400">Write throughput
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="end"
          x="395" y="400">Operational simplicity
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="end"
          x="331" y="189">Iceberg integration
    </text>

    <!-- Scale ticks -->
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="494"
          y="82">10
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="494"
          y="114">8
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="494"
          y="146">6
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="494"
          y="178">4
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="494"
          y="210">2
    </text>

    <!-- Non-focal series -->
    <!-- Ceph · series-2 dusty-blue dark -->
    <polygon fill="rgba(130,160,192,0.22)" points="500,128 606,206 566,330 462,292 409,211"
             stroke="#82a0c0" stroke-width="1.5"/>
    <!-- GCS · series-3 mustard dark -->
    <polygon fill="rgba(211,173,122,0.22)" points="500,144 637,196 575,343 444,317 394,206"
             stroke="#d3ad7a" stroke-width="1.5"/>
    <!-- Amazon S3 · series-1 sage dark -->
    <polygon fill="rgba(156,175,143,0.22)" points="500,144 652,191 585,356 453,305 378,201"
             stroke="#9caf8f" stroke-width="1.5"/>

    <!-- Focal series · MinIO -->
    <polygon fill="rgba(240,138,89,0.22)" points="500,96 622,201 585,356 415,356 363,196"
             stroke="#f08a59" stroke-width="1.8"/>

    <!-- Focal vertex dots -->
    <circle cx="500" cy="96" fill="#f08a59" r="4"/>
    <circle cx="622" cy="201" fill="#f08a59" r="4"/>
    <circle cx="585" cy="356" fill="#f08a59" r="4"/>
    <circle cx="415" cy="356" fill="#f08a59" r="4"/>
    <circle cx="363" cy="196" fill="#f08a59" r="4"/>

    <!-- Legend -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="456" y2="456"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" x="40"
          y="472">LEGEND
    </text>

    <rect fill="rgba(240,138,89,0.22)" height="8" stroke="#f08a59" stroke-width="1.5" width="16" x="40"
          y="484"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="64" y="492">MinIO ·
      recommended
    </text>

    <rect fill="rgba(156,175,143,0.22)" height="8" stroke="#9caf8f" stroke-width="1.5" width="16" x="220"
          y="484"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="244" y="492">Amazon
      S3
    </text>

    <rect fill="rgba(130,160,192,0.22)" height="8" stroke="#82a0c0" stroke-width="1.5" width="16" x="344"
          y="484"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="368" y="492">Ceph
    </text>

    <rect fill="rgba(211,173,122,0.22)" height="8" stroke="#d3ad7a" stroke-width="1.5" width="16" x="424"
          y="484"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="448" y="492">Google
      Cloud Storage
    </text>

    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" font-style="italic" x="608"
          y="492">One coral. Position is the signal — color reserved for the recommended
      option.
    </text>
  </svg>
</div>
</body>
</html>
