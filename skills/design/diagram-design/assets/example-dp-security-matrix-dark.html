<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Data Platform · Access Matrix · Dark</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --accent: #f08a59;
      --ink: #f5f5f5;
      --mono: 'Geist Mono', ui-monospace, monospace
      --muted: #bfc0c0;
      --paper: #2d3142;
      --rule: rgba(245, 245, 245, .12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #8e98ac;
      --paper-2: #393e53;
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans)
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px
      width: 100%;
    }

    .eyebrow {
      color: var(--muted);
      font: 500 .66rem/1 var(--mono);
      letter-spacing: .18em;
      margin-bottom: .5rem;
      text-transform: uppercase
    }

    h1 {
      font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -.02em
      margin-bottom: .35rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.5
      margin-bottom: 1.5rem;
    }

    .diagram {
      overflow-x: auto
    }

    svg {
      display: block;
      min-width: 1040px
      width: 100%;
    }

    svg .component-head, svg .component {
      fill: rgba(245, 245, 245, .06);
      stroke: rgba(245, 245, 245, .18);
      stroke-width: .8
    }

    svg .role {
      fill: #f5f5f5
    }

    svg .head-name, svg .component-name, svg .role-name, svg .value {
      font-family: 'Geist', sans-serif
    }

    svg .head-name, svg .component-name, svg .role-name {
      font-size: 11px;
      font-weight: 600
    }

    svg .head-name, svg .component-name {
      fill: #f5f5f5
    }

    svg .role-name, svg .role-code {
      fill: #2d3142
    }

    svg .head-sub, svg .role-code, svg .hint, svg .legend-text, svg .focal-sub {
      font-family: 'Geist Mono', monospace
    }

    svg .head-sub, svg .hint, svg .legend-text {
      fill: #8e98ac
    }

    svg .head-sub, svg .role-code, svg .hint {
      font-size: 9px
    }

    svg .role-code {
      opacity: .85
    }

    svg .cell {
      stroke: rgba(245, 245, 245, .18);
      stroke-width: .6
    }

    svg .full {
      fill: rgba(245, 245, 245, .10)
    }

    svg .write {
      fill: rgba(245, 245, 245, .06)
    }

    svg .read {
      fill: rgba(142, 152, 172, .12)
    }

    svg .none {
      fill: rgba(245, 245, 245, .02)
    }

    svg .value {
      font-size: 10px
    }

    svg .value.full-text {
      fill: #f5f5f5;
      font-weight: 600
    }

    svg .value.write-text {
      fill: #f5f5f5
    }

    svg .value.read-text {
      fill: #8e98ac
    }

    svg .value.none-text {
      fill: #bfc0c0
    }

    svg .focal {
      fill: rgba(240, 138, 89, .12);
      stroke: #f08a59;
      stroke-width: 1.4
    }

    svg .focal-text {
      fill: #f08a59;
      font-weight: 600
    }

    svg .focal-sub {
      fill: #f08a59;
      font-size: 8px;
      opacity: .85
    }

    svg .legend-text {
      font-size: 9px
    }
  </style>
</head>
<body>
<main class="frame"><p class="eyebrow">DP security matrix · Diagram Design</p>

  </div>
</main>
</body>
</html>
