<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Diagram</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #ff5a36;
      --color-accent-tint: rgba(255, 90, 54, 0.12);
      --color-bar: #1b1b1b;
      --color-border: #2b2b2b;
      --color-ink: #f5f5f5;
      --font-mono: "Geist Mono", ui-monospace, monospace;
      --color-muted: #9a9a9a;
      --color-page: #0a0a0a;
      --color-paper: #141414;
      --color-soft: #5c5c5c;
    }

    body {
      align-items: center;
      background: var(--color-page);
      display: flex;
      font-family: var(--font-mono);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .terminal {
      background: var(--color-paper);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      max-width: 1200px;
      overflow: hidden;
      width: 100%;
    }

    .titlebar {
      align-items: center;
      background: var(--color-bar);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    .dot {
      background: var(--color-soft);
      border-radius: 50%;
      height: 10px;
      width: 10px;
    }

    .dot.accent {
      background: var(--color-accent);
    }

    /* exactly one of the three dots gets this */

    .titlebar-name {
      color: var(--color-muted);
      flex: 1;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-right: 46px; /* offsets the three dots so the name optically centers */
      text-align: center;
    }

    .frame {
      padding: 2.25rem 2.5rem 2.5rem;
    }

    .prompt {
      color: var(--color-muted);
      display: flex;
      font-size: 0.8rem;
      font-weight: 500;
      gap: 0.6em;
      margin-bottom: 0.9rem;
    }

    .prompt .sign {
      color: var(--color-accent);
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-mono);
      font-size: clamp(1.5rem, 2.2vw + 0.8rem, 2.05rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    h1::before {
      color: var(--color-soft);
      content: "# ";
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="terminal">
  <div class="titlebar">
    <div class="dot accent"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="titlebar-name">[file.sh] — [diagram-slug]</div>
  </div>
  <main class="frame">
    <p class="prompt">
      <span class="sign">$</span> [command that "generated" this]
    </p>
    <h1>[Diagram title]</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <svg aria-labelledby="[diagram-slug]-title [diagram-slug]-desc" role="img" viewBox="0 0 1000 600"
         xmlns="http://www.w3.org/2000/svg">
      <title id="[diagram-slug]-title">[Diagram title]</title>
      <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
      <defs>
        <marker
            id="arrow"
            markerHeight="6"
            markerWidth="8"
            orient="auto"
            refX="7"
            refY="3"
        >
          <polygon fill="#9a9a9a" points="0 0, 8 3, 0 6"/>
        </marker>
        <marker
            id="arrow-accent"
            markerHeight="6"
            markerWidth="8"
            orient="auto"
            refX="7"
            refY="3"
        >
          <polygon fill="#ff5a36" points="0 0, 8 3, 0 6"/>
        </marker>

        <!-- OPTIONAL: dot-pattern background. Uncomment and add <rect fill="url(#dots)"/> after the paper rect to enable. -->
        <!--
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.08)"/>
      </pattern>
      --></defs>

      <rect fill="#141414" height="100%" width="100%"/>

      <!-- Draw arrows first, then nodes. Replace with your content.
         Text sizes run ~1-2px above the default scale: node-name 14px,
         sublabel/arrow-label 9-10px, hub label 18px. See primitive-terminal.md. -->
    </svg>
  </main>
</div>
</body>
</html>
