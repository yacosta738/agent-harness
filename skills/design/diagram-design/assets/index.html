<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Diagram Design · Gallery</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #f7591f;
      --ink: #0b0d0b;
      --mono: "Geist Mono", ui-monospace, monospace;
      --muted: #52534e;
      --paper: #f5f4ed;
      --rule: rgba(11, 13, 11, 0.12);
      --sans: "Geist", system-ui, sans-serif;
      --serif: "Instrument Serif", serif;
      --soft: #65655c;
      --paper-2: #efeee5;
      --rule-strong: rgba(11, 13, 11, 0.25);
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      font-family: var(--sans);
      overflow: hidden;
    }

    .topbar {
      border-bottom: 1px solid var(--rule);
      flex: 0 0 auto;
      padding: 1rem 1.25rem 0.625rem;
    }

    .title-row {
      align-items: baseline;
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .title-row h1 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .title-row .meta {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .title-row .open-raw {
      border: 1px solid var(--rule);
      border-radius: 4px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.625rem;
      text-decoration: none;
      transition: color 0.15s,
      border-color 0.15s;
    }

    .open-raw:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-bottom: 0.5rem;
    }

    .tabs.variants {
      border-top: 1px solid var(--rule);
      margin-bottom: 0;
      padding-top: 0.5rem;
    }

    .tab {
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--sans);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: -0.005em;
      padding: 0.375rem 0.75rem;
      transition: all 0.12s;
    }

    .tab:hover {
      border-color: var(--rule-strong);
      color: var(--ink);
    }

    .tab:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .tab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .tab .eyebrow {
      color: inherit;
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      margin-right: 0.25rem;
      opacity: 0.5;
      text-transform: uppercase;
    }

    .tab.new::after {
      color: var(--accent);
      content: "NEW";
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.54rem;
      letter-spacing: 0.12em;
      margin-left: 0.35rem;
      vertical-align: 1px;
    }

    .tab.active.new::after {
      color: var(--paper);
    }

    main {
      background: var(--paper-2);
      flex: 1 1 auto;
      overflow: hidden;
      position: relative;
    }

    iframe {
      background: var(--paper);
      border: 0;
      display: block;
      height: 100%;
      inset: 0;
      position: absolute;
      width: 100%;
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="title-row">
    <h1>
      Diagram Design
      <span
          class="meta"
          style="
              font-family: var(--mono);
              font-size: 0.66rem;
              margin-left: 0.5rem;
            "
      >· gallery</span
      >
    </h1>
    <div style="display: flex; gap: 0.5rem">
      <a class="open-raw" href="icons.html" rel="noopener" target="_blank"
      >icon library ↗</a
      >
      <a
          class="open-raw"
          href="#"
          id="open-raw"
          rel="noopener"
          target="_blank"
      >open in new tab ↗</a
      >
    </div>
  </div>

  <div aria-label="Diagram type" class="tabs" id="type-tabs" role="tablist">
    <button class="tab active" data-type="architecture">
      <span class="eyebrow">01</span>Architecture
    </button>
    <button class="tab" data-type="flowchart">
      <span class="eyebrow">02</span>Flowchart
    </button>
    <button class="tab" data-type="sequence">
      <span class="eyebrow">03</span>Sequence
    </button>
    <button class="tab" data-type="state">
      <span class="eyebrow">04</span>State
    </button>
    <button class="tab" data-type="er">
      <span class="eyebrow">05</span>ER
    </button>
    <button class="tab" data-type="timeline">
      <span class="eyebrow">06</span>Timeline
    </button>
    <button class="tab" data-type="swimlane">
      <span class="eyebrow">07</span>Swimlane
    </button>
    <button class="tab" data-type="quadrant">
      <span class="eyebrow">08</span>Quadrant
    </button>
    <button class="tab new" data-type="nested">
      <span class="eyebrow">09</span>Nested
    </button>
    <button class="tab new" data-type="tree">
      <span class="eyebrow">10</span>Tree
    </button>
    <button class="tab new" data-type="org-chart">
      <span class="eyebrow">11</span>Org chart
    </button>
    <button class="tab new" data-type="layers">
      <span class="eyebrow">12</span>Layers
    </button>
    <button class="tab new" data-type="venn">
      <span class="eyebrow">13</span>Venn
    </button>
    <button class="tab new" data-type="pyramid">
      <span class="eyebrow">14</span>Pyramid
    </button>
    <button class="tab new" data-type="radar">
      <span class="eyebrow">15</span>Radar
    </button>
    <button class="tab new" data-type="loop">
      <span class="eyebrow">16</span>Loop
    </button>
    <button class="tab new" data-type="datalake">
      <span class="eyebrow">17</span>Data lake
    </button>
    <button class="tab new" data-type="bar">
      <span class="eyebrow">18</span>Bar
    </button>
    <button class="tab new" data-type="line">
      <span class="eyebrow">19</span>Line
    </button>
    <button class="tab new" data-type="gantt">
      <span class="eyebrow">20</span>Gantt
    </button>
    <button class="tab new" data-type="scatter">
      <span class="eyebrow">21</span>Scatter
    </button>
    <button class="tab new" data-type="medallion">
      <span class="eyebrow">22</span>Medallion
    </button>
    <button class="tab new" data-type="high-level">
      <span class="eyebrow">23</span>High-Level
    </button>
    <button class="tab new" data-type="process">
      <span class="eyebrow">24</span>Process
    </button>
    <button class="tab new" data-type="data-flow">
      <span class="eyebrow">26</span>Data flow
    </button>
    <button class="tab new" data-type="dp-integration">
      <span class="eyebrow">27</span>DP integration
    </button>
    <button class="tab new" data-type="high-level-vertical">
      <span class="eyebrow">28</span>High-Level / Parametric
    </button>
    <button class="tab new" data-type="dp-security-matrix">
      <span class="eyebrow">32</span>DP security matrix
    </button>
    <button class="tab new" data-type="it-state">
      <span class="eyebrow">33</span>IT current-state
    </button>
    <button class="tab new" data-type="sequence-oauth">
      <span class="eyebrow">34</span>Sequence · OAuth
    </button>
    <button class="tab new" data-single data-type="import-drawio">
      <span class="eyebrow">35</span>Import · draw.io
    </button>
    <button class="tab new" data-single data-type="import-mermaid">
      <span class="eyebrow">36</span>Import · Mermaid
    </button>
    <button class="tab new" data-single data-type="quadrant-consultant">
      <span class="eyebrow">37</span>Quadrant · consultant
    </button>
    <button class="tab new" data-single data-type="loop-terminal">
      <span class="eyebrow">38</span>Loop · terminal
    </button>
    <button class="tab new" data-single data-type="policy-trace-animated">
      <span class="eyebrow">39</span>Policy trace · animated
    </button>
    <button class="tab new" data-single data-type="queue-animated">
      <span class="eyebrow">40</span>Fan-in queue · animated
    </button>
    <button class="tab new" data-single data-type="paved-road-animated">
      <span class="eyebrow">41</span>Secure paved road · animated
    </button>
  </div>

  <div
      aria-label="Variant"
      class="tabs variants"
      id="variant-tabs"
      role="tablist"
  >
    <button class="tab active" data-variant="">Minimal light</button>
    <button class="tab" data-variant="-dark">Minimal dark</button>
    <button class="tab" data-variant="-full">Full editorial</button>
  </div>
</header>

<main>
  <iframe
      id="preview"
      src="example-architecture.html"
      title="Preview"
  ></iframe>
</main>

<script>
  const state = {type: "architecture", variant: ""};
  const iframe = document.getElementById("preview");
  const openRaw = document.getElementById("open-raw");

  function update() {
    const activeType = document.querySelector("#type-tabs .tab.active");
    const single = activeType && activeType.hasAttribute("data-single");
    const variantTabs = document.querySelectorAll("#variant-tabs .tab");
    if (single) {
      state.variant = "";
    }
    variantTabs.forEach((tab) => {
      tab.disabled = single && tab.dataset.variant !== "";
      tab.classList.toggle("active", tab.dataset.variant === state.variant);
    });
    const src = `example-${state.type}${state.variant}.html`;
    iframe.src = src;
    openRaw.href = src;
  }

  function bindTabs(containerId, key) {
    const container = document.getElementById(containerId);
    container.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) {
        return;
      }
      container
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      state[key] = btn.dataset[key];
      update();
    });
  }

  bindTabs("type-tabs", "type");
  bindTabs("variant-tabs", "variant");
  update();
</script>
</body>
</html>
