<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Order fulfillment · Process (dark)</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --accent: #eb6c36;
      --chip: rgba(45, 49, 66, .12);
      --db: #5e7a9b;
      --dot: rgba(245, 245, 245, .10);
      --fl: #9c6b50;
      --ink: #2d3142;
      --lane: rgba(45, 49, 66, .018);
      --ls: #7c8f6f;
      --mono: 'Geist Mono', ui-monospace, monospace
      --muted: #4f5d75;
      --node: #fff;
      --paper: #f5f5f5;
      --rule: rgba(45, 49, 66, .12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #7a8399;
      --tb: #b8915a;
      --wb: #6e6479;
      --label-rule: rgba(45, 49, 66, .20);
      --node-stroke: rgba(45, 49, 66, .25);
      --accent-tint: rgba(235, 108, 54, .08);
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem
    }

    .frame {
      max-width: 1120px;
      width: 100%
    }

    .eyebrow {
      color: var(--muted);
      font: 500 .66rem var(--mono);
      letter-spacing: .18em;
      margin-bottom: .5rem
      text-transform: uppercase;
    }

    h1 {
      font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -.02em;
      margin-bottom: 1.5rem
    }

    svg {
      display: block
      min-width: 1000px;
      width: 100%;
    }

    svg text {
      font-family: var(--sans)
    }

    .mono {
      font-family: var(--mono)
    }

    .lane {
      fill: var(--lane)
    }

    .rule {
      stroke: var(--rule)
    }

    .label-rule {
      stroke: var(--label-rule)
    }

    .actor {
      fill: var(--muted);
      font: 500 8px var(--mono);
      letter-spacing: .08em
    }

    .step-label {
      fill: var(--muted);
      font: 500 6px var(--mono);
      letter-spacing: .12em
    }

    .step-chip {
      fill: var(--chip)
    }

    .step-num {
      fill: var(--ink);
      font: 600 7px var(--mono)
    }

    .connector {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1
    }

    .connector.focal {
      stroke: var(--accent);
      stroke-width: 1.2
    }

    .node-mask {
      fill: var(--paper)
    }

    .node {
      fill: var(--node);
      stroke: var(--node-stroke)
    }

    .node.focal {
      fill: var(--accent-tint);
      stroke: var(--accent);
      stroke-width: 1.2
    }

    .role {
      fill: rgba(245, 245, 245, .10)
    }

    .role.focal {
      fill: rgba(240, 138, 89, .26)
    }

    .role-text {
      fill: var(--ink);
      font: 600 6px var(--mono)
    }

    .role-text.focal {
      fill: var(--accent)
    }

    .node-title {
      fill: var(--ink);
      font: 600 9px var(--sans)
    }

    .node-sub {
      fill: var(--muted);
      font: 6.5px var(--mono)
    }

    .node-tool {
      fill: var(--soft);
      font: 6.5px var(--mono)
    }

    .data-text {
      fill: white;
      font: 700 5px var(--mono)
    }

    .legend-key {
      fill: var(--muted);
      font: 500 7px var(--mono);
      letter-spacing: .12em
    }

    .legend-text {
      fill: var(--muted);
      font: 8px var(--sans)
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Process · Diagram Design</p>
  <h1>Order fulfillment across four teams</h1>
  <svg aria-label="Order fulfillment process from customer order to support closure"
       aria-labelledby="process-dark-title process-dark-desc"
       role="img" viewBox="0 0 1064 436"
       xmlns="http://www.w3.org/2000/svg">
    <title id="process-dark-title">Order fulfillment across four teams</title>
    <desc id="process-dark-desc">Process diagram showing an order moving through customer, support,
      warehouse, and finance ownership from placement to close.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="11" cy="11" fill="var(--dot)" r="0.8"/>
      </pattern>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="var(--muted)" points="0 0,8 3,0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="var(--accent)" points="0 0,8 3,0 6"/>
      </marker>
      <marker id="arrow-sm" markerHeight="5" markerWidth="6" orient="auto" refX="5" refY="2.5">
        <polygon fill="var(--muted)" points="0 0,6 2.5,0 5"/>
      </marker>
    </defs>
    <rect fill="var(--paper)" height="436" width="1064"/>
    <rect fill="url(#dots)" height="436" opacity=".55" width="1064"/>
    <rect class="lane" height="80" width="924" x="140" y="36"/>
    <rect class="lane" height="80" width="924" x="140" y="196"/>
    <g class="rule" stroke-width=".8">
      <line x1="0" x2="1064" y1="36" y2="36"/>
      <line x1="0" x2="1064" y1="116" y2="116"/>
      <line x1="0" x2="1064" y1="196" y2="196"/>
      <line x1="0" x2="1064" y1="276" y2="276"/>
      <line x1="0" x2="1064" y1="356" y2="356"/>
    </g>
    <line class="label-rule" x1="140" x2="140" y1="36" y2="356"/>
    <g class="actor" text-anchor="middle">
      <text x="70" y="80">CUSTOMER</text>
      <text x="70" y="160">SUPPORT</text>
      <text x="70" y="240">WAREHOUSE</text>
      <text x="70" y="320">FINANCE</text>
    </g>
    <g text-anchor="middle">
      <rect class="step-chip" height="16" rx="8" width="16" x="190" y="8"/>
      <text class="step-num" x="198" y="19">1</text>
      <text class="step-label" x="198" y="32">ORDER</text>
      <rect class="step-chip" height="16" rx="8" width="16" x="302" y="8"/>
      <text class="step-num" x="310" y="19">2</text>
      <text class="step-label" x="310" y="32">VERIFY</text>
      <rect fill="rgba(240,138,89,.22)" height="16" rx="8" width="16" x="414" y="8"/>
      <text class="mono" fill="var(--accent)" font-size="7" font-weight="600" x="422" y="19">3
      </text>
      <text class="mono" fill="var(--accent)" font-size="6" font-weight="500" letter-spacing=".12em"
            x="422" y="32">ALLOCATE
      </text>
      <rect class="step-chip" height="16" rx="8" width="16" x="526" y="8"/>
      <text class="step-num" x="534" y="19">4</text>
      <text class="step-label" x="534" y="32">PICK</text>
      <rect class="step-chip" height="16" rx="8" width="16" x="638" y="8"/>
      <text class="step-num" x="646" y="19">5</text>
      <text class="step-label" x="646" y="32">PACK</text>
      <rect class="step-chip" height="16" rx="8" width="16" x="750" y="8"/>
      <text class="step-num" x="758" y="19">6</text>
      <text class="step-label" x="758" y="32">PAY</text>
      <rect class="step-chip" height="16" rx="8" width="16" x="862" y="8"/>
      <text class="step-num" x="870" y="19">7</text>
      <text class="step-label" x="870" y="32">RECEIVE</text>
      <rect class="step-chip" height="16" rx="8" width="16" x="974" y="8"/>
      <text class="step-num" x="982" y="19">8</text>
      <text class="step-label" x="982" y="32">CLOSE</text>
    </g>
    <!-- Connectors: right exit, r=8 orthogonal bend, top/bottom entry. -->
    <path class="connector" d="M248 76 H302 Q310 76 310 84 V124" marker-end="url(#arrow)"/>
    <path class="connector focal" d="M360 156 H414 Q422 156 422 164 V204"
          marker-end="url(#arrow-accent)"/>
    <line class="connector focal" marker-end="url(#arrow-accent)" x1="472" x2="484" y1="236"
          y2="236"/>
    <line class="connector" marker-end="url(#arrow)" x1="584" x2="596" y1="236" y2="236"/>
    <path class="connector" d="M696 236 H750 Q758 236 758 244 V284" marker-end="url(#arrow)"/>
    <path class="connector" d="M808 316 H862 Q870 316 870 308 V108" marker-end="url(#arrow)"/>
    <path class="connector" d="M920 76 H974 Q982 76 982 84 V124" marker-end="url(#arrow)"/>
    <!-- Nodes -->
    <g text-anchor="middle">
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="148" y="44"/>
        <rect class="node" height="64" rx="6" width="100" x="148" y="44"/>
        <rect class="role" height="10" rx="2" width="20" x="152" y="48"/>
        <text class="role-text" x="162" y="56">CUS</text>
        <text class="node-title" x="198" y="70">Place order</text>
        <text class="node-sub" x="198" y="84">cart → order</text>
        <text class="node-tool" x="198" y="96">storefront</text>
        <rect fill="var(--db)" height="8" rx="2" width="16" x="228" y="98"/>
        <text class="data-text" x="236" y="104">DB</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="260" y="124"/>
        <rect class="node" height="64" rx="6" width="100" x="260" y="124"/>
        <rect class="role" height="10" rx="2" width="20" x="264" y="128"/>
        <text class="role-text" x="274" y="136">SUP</text>
        <text class="node-title" x="310" y="150">Verify order</text>
        <text class="node-sub" x="310" y="164">order → cleared</text>
        <text class="node-tool" x="310" y="176">service desk</text>
        <rect fill="var(--db)" height="8" rx="2" width="16" x="264" y="178"/>
        <text class="data-text" x="272" y="184">DB</text>
        <rect fill="var(--db)" height="8" rx="2" width="16" x="340" y="178"/>
        <text class="data-text" x="348" y="184">DB</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="372" y="204"/>
        <rect class="node focal" height="64" rx="6" width="100" x="372" y="204"/>
        <rect class="role focal" height="10" rx="2" width="20" x="376" y="208"/>
        <text class="role-text focal" x="386" y="216">WHS</text>
        <text class="node-title" x="422" y="230">Allocate stock</text>
        <text class="node-sub" x="422" y="244">order → pick list</text>
        <text class="node-tool" x="422" y="256">inventory system</text>
        <rect fill="var(--db)" height="8" rx="2" width="16" x="376" y="258"/>
        <text class="data-text" x="384" y="264">DB</text>
        <rect fill="var(--ls)" height="8" rx="2" width="16" x="452" y="258"/>
        <text class="data-text" x="460" y="264">LS</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="484" y="204"/>
        <rect class="node" height="64" rx="6" width="100" x="484" y="204"/>
        <rect class="role" height="10" rx="2" width="20" x="488" y="208"/>
        <text class="role-text" x="498" y="216">WHS</text>
        <text class="node-title" x="534" y="230">Pick items</text>
        <text class="node-sub" x="534" y="244">list → picked</text>
        <text class="node-tool" x="534" y="256">handheld scanner</text>
        <rect fill="var(--ls)" height="8" rx="2" width="16" x="488" y="258"/>
        <text class="data-text" x="496" y="264">LS</text>
        <rect fill="var(--ls)" height="8" rx="2" width="16" x="564" y="258"/>
        <text class="data-text" x="572" y="264">LS</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="596" y="204"/>
        <rect class="node" height="64" rx="6" width="100" x="596" y="204"/>
        <rect class="role" height="10" rx="2" width="20" x="600" y="208"/>
        <text class="role-text" x="610" y="216">WHS</text>
        <text class="node-title" x="646" y="230">Pack order</text>
        <text class="node-sub" x="646" y="244">picked → shipment</text>
        <text class="node-tool" x="646" y="256">packing station</text>
        <rect fill="var(--ls)" height="8" rx="2" width="16" x="600" y="258"/>
        <text class="data-text" x="608" y="264">LS</text>
        <rect fill="var(--fl)" height="8" rx="2" width="16" x="676" y="258"/>
        <text class="data-text" x="684" y="264">FL</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="708" y="284"/>
        <rect class="node" height="64" rx="6" width="100" x="708" y="284"/>
        <rect class="role" height="10" rx="2" width="20" x="712" y="288"/>
        <text class="role-text" x="722" y="296">FIN</text>
        <text class="node-title" x="758" y="310">Capture payment</text>
        <text class="node-sub" x="758" y="324">shipment → receipt</text>
        <text class="node-tool" x="758" y="336">payment gateway</text>
        <rect fill="var(--fl)" height="8" rx="2" width="16" x="712" y="338"/>
        <text class="data-text" x="720" y="344">FL</text>
        <rect fill="var(--tb)" height="8" rx="2" width="16" x="788" y="338"/>
        <text class="data-text" x="796" y="344">TB</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="820" y="44"/>
        <rect class="node" height="64" rx="6" width="100" x="820" y="44"/>
        <rect class="role" height="10" rx="2" width="20" x="824" y="48"/>
        <text class="role-text" x="834" y="56">CUS</text>
        <text class="node-title" x="870" y="70">Receive shipment</text>
        <text class="node-sub" x="870" y="84">receipt → confirmed</text>
        <text class="node-tool" x="870" y="96">delivery portal</text>
        <rect fill="var(--tb)" height="8" rx="2" width="16" x="824" y="98"/>
        <text class="data-text" x="832" y="104">TB</text>
        <rect fill="var(--wb)" height="8" rx="2" width="16" x="900" y="98"/>
        <text class="data-text" x="908" y="104">WB</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="100" x="932" y="124"/>
        <rect class="node" height="64" rx="6" width="100" x="932" y="124"/>
        <rect class="role" height="10" rx="2" width="20" x="936" y="128"/>
        <text class="role-text" x="946" y="136">SUP</text>
        <text class="node-title" x="982" y="150">Close order</text>
        <text class="node-sub" x="982" y="164">confirmed → closed</text>
        <text class="node-tool" x="982" y="176">service desk</text>
        <rect fill="var(--wb)" height="8" rx="2" width="16" x="936" y="178"/>
        <text class="data-text" x="944" y="184">WB</text>
      </g>
    </g>
    <!-- Three-row type key -->
    <g>
      <text class="legend-key" x="144" y="372">STEPS</text>
      <g text-anchor="middle">
        <rect class="step-chip" height="16" rx="8" width="16" x="208" y="364"/>
        <text class="step-num" x="216" y="375">1</text>
        <text class="legend-text" x="248" y="375">ORDER</text>
        <rect class="step-chip" height="16" rx="8" width="16" x="300" y="364"/>
        <text class="step-num" x="308" y="375">2</text>
        <text class="legend-text" x="340" y="375">VERIFY</text>
        <rect fill="rgba(240,138,89,.22)" height="16" rx="8" width="16" x="392" y="364"/>
        <text class="mono" fill="var(--accent)" font-size="7" x="400" y="375">3</text>
        <text fill="var(--accent)" font-size="8" x="432" y="375">ALLOCATE</text>
        <rect class="step-chip" height="16" rx="8" width="16" x="496" y="364"/>
        <text class="step-num" x="504" y="375">4</text>
        <text class="legend-text" x="532" y="375">PICK</text>
        <rect class="step-chip" height="16" rx="8" width="16" x="576" y="364"/>
        <text class="step-num" x="584" y="375">5</text>
        <text class="legend-text" x="612" y="375">PACK</text>
        <rect class="step-chip" height="16" rx="8" width="16" x="656" y="364"/>
        <text class="step-num" x="664" y="375">6</text>
        <text class="legend-text" x="692" y="375">PAY</text>
        <rect class="step-chip" height="16" rx="8" width="16" x="736" y="364"/>
        <text class="step-num" x="744" y="375">7</text>
        <text class="legend-text" x="780" y="375">RECEIVE</text>
        <rect class="step-chip" height="16" rx="8" width="16" x="832" y="364"/>
        <text class="step-num" x="840" y="375">8</text>
        <text class="legend-text" x="872" y="375">CLOSE</text>
      </g>
      <text class="legend-key" x="144" y="393">DATA TYPE</text>
      <rect fill="var(--db)" height="8" rx="2" width="16" x="220" y="386"/>
      <text class="legend-text" x="244" y="393">DB · records</text>
      <rect fill="var(--ls)" height="8" rx="2" width="16" x="328" y="386"/>
      <text class="legend-text" x="352" y="393">LS · task</text>
      <rect fill="var(--fl)" height="8" rx="2" width="16" x="428" y="386"/>
      <text class="legend-text" x="452" y="393">FL · document</text>
      <rect fill="var(--tb)" height="8" rx="2" width="16" x="552" y="386"/>
      <text class="legend-text" x="576" y="393">TB · transaction</text>
      <rect fill="var(--wb)" height="8" rx="2" width="16" x="688" y="386"/>
      <text class="legend-text" x="712" y="393">WB · web status</text>
      <text class="legend-key" x="856" y="393">LEFT IN · RIGHT OUT</text>
      <text class="legend-key" x="144" y="414">FLOW</text>
      <line marker-end="url(#arrow-accent)" stroke="var(--accent)" stroke-width="1.2" x1="200"
            x2="228" y1="410"
            y2="410"/>
      <text class="legend-text" x="240" y="414">Critical handoff</text>
      <line marker-end="url(#arrow)" stroke="var(--muted)" x1="360" x2="388" y1="410" y2="410"/>
      <text class="legend-text" x="400" y="414">Sequential handoff</text>
    </g>
  </svg>
</div>
</body>
</html>
