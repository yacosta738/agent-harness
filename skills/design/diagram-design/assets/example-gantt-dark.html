<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Q2 product launch · Gantt · dark</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 760px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Gantt · Diagram Design</p>
  <h1>Q2 product launch · 12-week plan</h1>

  <!-- viewBox 0 0 1000 500. Timeline x=200-956 = 756px / 12 weeks = 63px per week -->
  <!-- Rows: label col x=20-196, timeline x=200-956 -->
  <!-- Row height=40, bar h=24, bar top pad=8 -->
  <!-- Week x = 200 + i*63, i=0..12 -->
  <svg aria-labelledby="gantt-dark-title gantt-dark-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="gantt-dark-title">Q2 product launch · 12-week plan</title>
    <desc id="gantt-dark-desc">Gantt chart showing a twelve-week product launch from market research
      and interviews through design review, development, beta testing, and launch.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Phase zones (drawn before everything) -->
    <!-- Phase 1 DISCOVERY: rows y=84,124 → zone y=72, h=84 -->
    <rect fill="rgba(245,245,245,0.03)" height="84" rx="6" stroke="rgba(245,245,245,0.10)" stroke-width="0.8" width="976"
          x="12" y="72"/>
    <!-- Phase 2 DESIGN: rows y=184,224,264 → zone y=172, h=120 -->
    <rect fill="rgba(245,245,245,0.03)" height="120" rx="6" stroke="rgba(245,245,245,0.10)" stroke-width="0.8" width="976"
          x="12" y="172"/>
    <!-- Phase 3 LAUNCH: rows y=324,364 → zone y=312, h=88 -->
    <rect fill="rgba(245,245,245,0.03)" height="88" rx="6" stroke="rgba(245,245,245,0.10)" stroke-width="0.8" width="976"
          x="12" y="312"/>

    <!-- Month headers at y=40-56 -->
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="9" font-weight="600" text-anchor="middle"
          x="326" y="52">April
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="9" font-weight="600" text-anchor="middle"
          x="578" y="52">May
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="9" font-weight="600" text-anchor="middle"
          x="830" y="52">June
    </text>

    <!-- Month separator lines -->
    <line stroke="rgba(245,245,245,0.08)" stroke-dasharray="3,3" stroke-width="0.8" x1="452" x2="452" y1="36"
          y2="416"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-dasharray="3,3" stroke-width="0.8" x1="704" x2="704" y1="36"
          y2="416"/>

    <!-- Week gridlines (vertical, hairline) -->
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="263" x2="263" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="326" x2="326" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="389" x2="389" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="515" x2="515" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="578" x2="578" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="641" x2="641" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="767" x2="767" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="830" x2="830" y1="60" y2="416"/>
    <line stroke="rgba(245,245,245,0.05)" stroke-width="0.6" x1="893" x2="893" y1="60" y2="416"/>

    <!-- Timeline header line -->
    <line stroke="rgba(245,245,245,0.15)" stroke-width="0.8" x1="200" x2="956" y1="60" y2="60"/>
    <!-- Left divider -->
    <line stroke="rgba(245,245,245,0.15)" stroke-width="0.8" x1="200" x2="200" y1="36" y2="416"/>

    <!-- Phase labels (eyebrow style) -->
    <text fill="rgba(245,245,245,0.35)" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em"
          x="20" y="85">DISCOVERY
    </text>
    <text fill="rgba(245,245,245,0.35)" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em"
          x="20" y="185">DESIGN
    </text>
    <text fill="rgba(245,245,245,0.35)" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em"
          x="20" y="325">LAUNCH
    </text>

    <!-- ─── TASK BARS ─── -->
    <!-- W_x = 200 + week_index * 63 -->
    <!-- Row 1 y=84: Market research W1-W3 (i=0..2, x=200, dur=2*63=126) -->
    <rect fill="#f5f5f5" height="24" width="176" x="20" y="92"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="10" font-weight="600" x="20"
          y="108">Market research
    </text>
    <rect fill="#f5f5f5" height="24" rx="4" width="126" x="200" y="92"/>
    <rect fill="rgba(191,192,192,0.15)" height="24" rx="4" stroke="#bfc0c0" stroke-width="1" width="126"
          x="200" y="92"/>

    <!-- Row 2 y=124: User interviews W2-W4 (i=1..3, x=263, dur=2*63=126) -->
    <rect fill="#f5f5f5" height="24" width="176" x="20" y="132"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="10" font-weight="600" x="20"
          y="148">User interviews
    </text>
    <rect fill="#f5f5f5" height="24" rx="4" width="126" x="263" y="132"/>
    <rect fill="rgba(191,192,192,0.15)" height="24" rx="4" stroke="#bfc0c0" stroke-width="1" width="126"
          x="263" y="132"/>

    <!-- Row 3 y=184: Wireframes W4-W6 (i=3..5, x=389, dur=2*63=126) -->
    <rect fill="#f5f5f5" height="24" width="176" x="20" y="192"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="10" font-weight="600" x="20"
          y="208">Wireframes
    </text>
    <rect fill="#f5f5f5" height="24" rx="4" width="126" x="389" y="192"/>
    <rect fill="rgba(191,192,192,0.15)" height="24" rx="4" stroke="#bfc0c0" stroke-width="1" width="126"
          x="389" y="192"/>

    <!-- Row 4 y=224: Prototype W5-W8 (i=4..7, x=452, dur=3*63=189) -->
    <rect fill="#f5f5f5" height="24" width="176" x="20" y="232"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="10" font-weight="600" x="20"
          y="248">Prototype
    </text>
    <rect fill="#f5f5f5" height="24" rx="4" width="189" x="452" y="232"/>
    <rect fill="rgba(191,192,192,0.15)" height="24" rx="4" stroke="#bfc0c0" stroke-width="1" width="189"
          x="452" y="232"/>

    <!-- Row 5 y=264 FOCAL: Design review W8-W9 (i=7..8, x=641, dur=63) -->
    <rect fill="#f5f5f5" height="24" width="176" x="20" y="272"/>
    <text fill="#f08a59" font-family="'Geist', sans-serif" font-size="10" font-weight="600" x="20"
          y="288">Design review
    </text>
    <rect fill="#f5f5f5" height="24" rx="4" width="63" x="641" y="272"/>
    <rect fill="rgba(240,138,89,0.14)" height="24" rx="4" stroke="#f08a59" stroke-width="1" width="63"
          x="641" y="272"/>
    <text fill="#f08a59" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="672"
          y="289">GATE
    </text>

    <!-- Row 6 y=324: Development W7-W11 (i=6..10, x=578, dur=4*63=252) -->
    <rect fill="#f5f5f5" height="24" width="176" x="20" y="332"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="10" font-weight="600" x="20"
          y="348">Development
    </text>
    <rect fill="#f5f5f5" height="24" rx="4" width="252" x="578" y="332"/>
    <rect fill="rgba(191,192,192,0.15)" height="24" rx="4" stroke="#bfc0c0" stroke-width="1" width="252"
          x="578" y="332"/>

    <!-- Row 7 y=364: Beta testing W10-W12 (i=9..11, x=767, dur=2*63=126) -->
    <rect fill="#f5f5f5" height="24" width="176" x="20" y="372"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="10" font-weight="600" x="20"
          y="388">Beta testing
    </text>
    <rect fill="#f5f5f5" height="24" rx="4" width="126" x="767" y="372"/>
    <rect fill="rgba(191,192,192,0.15)" height="24" rx="4" stroke="#bfc0c0" stroke-width="1" width="126"
          x="767" y="372"/>

    <!-- Legend -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="430" y2="430"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" x="40"
          y="446">LEGEND
    </text>

    <rect fill="rgba(240,138,89,0.14)" height="12" rx="3" stroke="#f08a59" stroke-width="1" width="20" x="40"
          y="456"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="68" y="466">Design
      review · critical gate
    </text>

    <rect fill="rgba(191,192,192,0.15)" height="12" rx="3" stroke="#bfc0c0" stroke-width="1" width="20"
          x="280" y="456"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="308" y="466">Task
    </text>

    <rect fill="rgba(245,245,245,0.03)" height="12" rx="3" stroke="rgba(245,245,245,0.10)" stroke-width="0.8" width="20"
          x="368" y="456"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="396" y="466">Phase
    </text>
  </svg>
</div>
</body>
</html>
