<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Content pyramid · what compounds</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Pyramid · Diagram Design</p>
  <h1>Content pyramid · what compounds</h1>

  <svg aria-labelledby="pyramid-title pyramid-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="pyramid-title">Content pyramid · what compounds</title>
    <desc id="pyramid-desc">Content pyramid showing short posts, essays, long-form guides, and a
      flagship book ordered by shipping cadence and leverage.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(45,49,66,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Left axis: direction of rarity -->
    <line stroke="rgba(45,49,66,0.30)" stroke-width="1" x1="100" x2="100" y1="40" y2="320"/>
    <polygon fill="rgba(45,49,66,0.45)" points="96,40 104,40 100,28"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          text-anchor="middle"
          transform="rotate(-90 80 216)" x="80" y="216">RARER · FEWER
      · COMPOUNDS ↑
    </text>

    <!-- Base layer: Short posts -->
    <polygon fill="#ececec" points="244,280 756,280 820,344 180,344" stroke="rgba(45,49,66,0.12)"
             stroke-width="1"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="308">Short posts
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="500"
          y="324">daily · ~200 words
    </text>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em"
          x="836"
          y="316">~240/yr
    </text>

    <!-- L3: Essays -->
    <polygon fill="#ececec" points="308,216 692,216 756,280 244,280" stroke="rgba(45,49,66,0.12)"
             stroke-width="1"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="244">Essays
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="500"
          y="260">weekly · 800–1,500 words
    </text>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em"
          x="776"
          y="252">~48/yr
    </text>

    <!-- L2: Long-form guides -->
    <polygon fill="#ececec" points="372,152 628,152 692,216 308,216" stroke="rgba(45,49,66,0.12)"
             stroke-width="1"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="180">Long-form guides
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="500"
          y="196">quarterly · 4,000+ words
    </text>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em"
          x="716"
          y="188">~4/yr
    </text>

    <!-- Apex: Flagship book — CORAL FOCAL (true pyramid peak — single triangle, consistent slope with layers below) -->
    <polygon fill="rgba(235,108,54,0.08)" points="500,24 628,152 372,152" stroke="#eb6c36"
             stroke-width="1"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="120">Flagship book
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="500"
          y="136">every 3–5 years
    </text>
    <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em"
          x="656"
          y="112">the apex
    </text>

    <!-- Footnote under pyramid -->
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" font-style="italic"
          text-anchor="middle"
          x="500" y="384">The base funds the apex. The apex defines the
      base.
    </text>

    <!-- Legend -->
    <line stroke="rgba(45,49,66,0.10)" stroke-width="0.8" x1="40" x2="960" y1="436" y2="436"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          x="40"
          y="452">LEGEND
    </text>

    <rect fill="rgba(235,108,54,0.08)" height="12" stroke="#eb6c36" stroke-width="1" width="16"
          x="40"
          y="464"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="64" y="474">Apex —
      rarest, highest leverage
    </text>

    <rect fill="#ececec" height="12" stroke="rgba(45,49,66,0.25)" stroke-width="1" width="16"
          x="280"
          y="464"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="304" y="474">
      Supporting layer — the volume work
    </text>

    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" font-style="italic"
          x="560"
          y="474">Layer width is honest: narrower = rarer shipping cadence.
    </text>
  </svg>
</div>
</body>
</html>
