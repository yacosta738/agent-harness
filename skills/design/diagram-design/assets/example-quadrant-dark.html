<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Content ideas · Impact × Effort</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #f08a59;
      --color-ink: #f5f5f5;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #bfc0c0;
      --color-paper: #2d3142;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Quadrant · Diagram Design</p>
  <h1>Content ideas · Impact × Effort</h1>

  <svg aria-labelledby="quadrant-dark-title quadrant-dark-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="quadrant-dark-title">Content ideas · Impact × Effort</title>
    <desc id="quadrant-dark-desc">Impact-effort matrix showing eight content projects across do
      first, major projects, quick wins, and avoid quadrants.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#2d3142" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Quadrant backgrounds (very subtle, only coral on DO FIRST) -->
    <rect fill="rgba(240,138,89,0.03)" height="170" width="380" x="120" y="80"/>

    <!-- Axis cross -->
    <line stroke="rgba(245,245,245,0.45)" stroke-width="1" x1="120" x2="880" y1="250" y2="250"/>
    <line stroke="rgba(245,245,245,0.45)" stroke-width="1" x1="500" x2="500" y1="80" y2="420"/>

    <!-- Axis end labels -->
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          text-anchor="end"
          x="880" y="266">HIGH EFFORT →
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          x="120"
          y="266">← LOW EFFORT
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          x="512"
          y="80">↑ HIGH IMPACT
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          x="512"
          y="432">↓ LOW IMPACT
    </text>

    <!-- Quadrant corner labels -->
    <text fill="#f08a59" font-family="'Geist Mono', monospace" font-size="9" font-weight="600"
          letter-spacing="0.18em"
          x="140" y="104">DO FIRST
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.18em"
          text-anchor="end"
          x="860" y="104">MAJOR PROJECTS
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.18em"
          x="140"
          y="412">QUICK WINS
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.18em"
          text-anchor="end"
          x="860" y="412">AVOID
    </text>

    <!-- Items: TL (Do First) -->
    <!-- coral focal -->
    <circle cx="220" cy="140" fill="#f08a59" r="6"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600" x="232"
          y="144">Schematic skill v4
    </text>

    <circle cx="320" cy="200" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11" x="332" y="204">Update
      changelog
    </text>

    <!-- Items: TR (Major Projects) -->
    <circle cx="620" cy="140" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11" x="632" y="144">Design v4
      refresh
    </text>

    <circle cx="760" cy="180" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11" x="772" y="184">New
      publication
    </text>

    <!-- Items: BL (Quick Wins) -->
    <circle cx="260" cy="320" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11" x="272" y="324">Fix footer
      link
    </text>

    <circle cx="360" cy="380" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11" x="372" y="384">Update OG
      tags
    </text>

    <!-- Items: BR (Avoid) -->
    <circle cx="640" cy="380" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11" x="652" y="384">Rewrite
      build pipeline
    </text>

    <circle cx="780" cy="320" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="11" x="792" y="324">Port to
      Nuxt
    </text>

    <!-- Legend -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="456" y2="456"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          x="40"
          y="472">LEGEND
    </text>

    <circle cx="52" cy="488" fill="#f08a59" r="6"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="68" y="492">Start
      tomorrow
    </text>

    <circle cx="192" cy="488" fill="#f5f5f5" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="208" y="492">Candidate
      project
    </text>

    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" font-style="italic"
          x="336"
          y="492">Position is the signal. Colour is reserved for the single action item.
    </text>
  </svg>
</div>
</body>
</html>
