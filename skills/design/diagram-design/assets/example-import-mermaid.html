<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Imported from Mermaid — Request validation</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #eb6c36;
      --ink: #2d3142;
      --muted: #4f5d75;
      --paper: #f5f5f5;
      --soft: #7a8399;
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: 'Geist', system-ui, sans-serif;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 32px;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--muted);
      font: 500 8px 'Geist Mono', monospace;
      letter-spacing: .14em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    h1 {
      font: 400 28px/1.15 'Instrument Serif', serif;
      margin-bottom: 24px;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<main class="frame">
  <p class="eyebrow">Flowchart · Imported from Mermaid · doc-inline · balanced</p>
  <h1>Request validation and order storage</h1>
  <svg aria-labelledby="import-mermaid-title import-mermaid-desc" role="img" viewBox="0 0 960 600"
       xmlns="http://www.w3.org/2000/svg">
    <title id="import-mermaid-title">Request validation flow</title>
    <desc id="import-mermaid-desc">Web and mobile requests enter an API gateway, pass a token
      decision, and reach an order service and Postgres.
    </desc>
    <defs>
      <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
        <path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
        <path d="M0,0 L8,4 L0,8 Z" fill="#eb6c36"/>
      </marker>
    </defs>
    <rect fill="#f5f5f5" height="600" width="960"/>

    <rect fill="none" height="336" rx="8" stroke="rgba(45,49,66,0.12)" width="200" x="40" y="80"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".14em" x="56"
          y="104">EDGE
    </text>
    <rect fill="none" height="336" rx="8" stroke="rgba(45,49,66,0.12)" width="632" x="288" y="80"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".14em" x="304"
          y="104">CORE SERVICES
    </text>

    <!-- Connectors precede nodes. -->
    <path d="M208,168 H328" fill="none" marker-end="url(#arrow)" stroke="#4f5d75"
          stroke-width="1.2"/>
    <path d="M208,296 H264 A8,8 0 0 0 272,288 V200 A8,8 0 0 1 280,192 H328" fill="none"
          marker-end="url(#arrow)" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M488,192 H568" fill="none" marker-end="url(#arrow-accent)" stroke="#eb6c36"
          stroke-width="1.2"/>
    <path d="M696,192 H744 A8,8 0 0 1 752,200 V272" fill="none" marker-end="url(#arrow)" stroke="#4f5d75"
          stroke-width="1.2"/>
    <path d="M632,256 V336 A8,8 0 0 1 624,344 H488 A8,8 0 0 1 480,336 V232" fill="none"
          marker-end="url(#arrow)" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M408,160 V136 A8,8 0 0 1 416,128 H504 A8,8 0 0 1 512,136 V168 A8,8 0 0 1 504,176 H488"
          fill="none" marker-end="url(#arrow)" stroke="#4f5d75" stroke-dasharray="4,4"
          stroke-width="1.2"/>
    <path d="M752,336 V352 A8,8 0 0 1 744,360 H696 A8,8 0 0 0 688,368 V384" fill="none"
          marker-end="url(#arrow)" stroke="#4f5d75" stroke-width="1.2"/>

    <rect fill="#f5f5f5" height="12" rx="2" width="56" x="240" y="148"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="268"
          y="156">REQUEST
    </text>
    <rect fill="#f5f5f5" height="12" rx="2" width="56" x="220" y="276"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="248"
          y="284">REQUEST
    </text>
    <rect fill="#f5f5f5" height="12" rx="2" width="48" x="504" y="172"/>
    <text fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="528"
          y="180">VERIFY
    </text>
    <rect fill="#f5f5f5" height="12" rx="2" width="32" x="708" y="172"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="724"
          y="180">YES
    </text>
    <rect fill="#f5f5f5" height="12" rx="2" width="32" x="544" y="324"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="560"
          y="332">NO
    </text>
    <rect fill="#f5f5f5" height="12" rx="2" width="48" x="432" y="108"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="456"
          y="116">RETRY
    </text>
    <rect fill="#f5f5f5" height="12" rx="2" width="48" x="696" y="340"/>
    <text fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="720"
          y="348">WRITES
    </text>

    <rect fill="rgba(79,93,117,0.10)" height="56" rx="6" stroke="#7a8399" width="144" x="64"
          y="140"/>
    <text fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="136" y="172">Web App
    </text>
    <rect fill="rgba(79,93,117,0.10)" height="56" rx="8" stroke="#7a8399" width="144" x="64"
          y="268"/>
    <text fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="136" y="300">Mobile App
    </text>
    <rect fill="rgba(235,108,54,0.08)" height="64" rx="8" stroke="#eb6c36" width="160" x="328"
          y="160"/>
    <text fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="408" y="188">API Gateway
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="408"
          y="204">single entry
    </text>
    <polygon fill="#ffffff" points="632,128 696,192 632,256 568,192" stroke="#2d3142"/>
    <text fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="632" y="188">Token
    </text>
    <text fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="632" y="204">valid?
    </text>
    <rect fill="#ffffff" height="64" rx="6" stroke="#2d3142" width="160" x="744" y="272"/>
    <text fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="824" y="300">Orders Service
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="824"
          y="316">order write
    </text>
    <rect fill="rgba(45,49,66,0.05)" height="56" rx="6" stroke="#4f5d75" width="160" x="608"
          y="384"/>
    <text fill="#2d3142" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle"
          x="688" y="408">Postgres
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" x="688"
          y="424">orders
    </text>

    <line stroke="rgba(45,49,66,0.10)" stroke-width="0.8" x1="40" x2="920" y1="504" y2="504"/>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".14em" x="40"
          y="528">LEGEND
    </text>
    <rect fill="rgba(235,108,54,0.08)" height="12" rx="2" stroke="#eb6c36" width="16" x="128"
          y="516"/>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" x="152" y="528">FOCAL
    </text>
    <polygon fill="#ffffff" points="248,516 256,522 248,528 240,522" stroke="#2d3142"/>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" x="268" y="528">
      DECISION
    </text>
    <rect fill="rgba(45,49,66,0.05)" height="12" rx="2" stroke="#4f5d75" width="16" x="376"
          y="516"/>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" x="400" y="528">STORE
    </text>
    <rect fill="rgba(79,93,117,0.10)" height="12" rx="2" stroke="#7a8399" width="16" x="472"
          y="516"/>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" x="496" y="528">INPUT
    </text>
    <rect fill="#ffffff" height="12" rx="2" stroke="#2d3142" width="16" x="568" y="516"/>
    <text fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" x="592" y="528">
      SERVICE
    </text>
  </svg>
</main>
</body>
</html>
