<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Northwind Retail · Current IT Landscape</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #eb6c36;
      --ink: #2d3142;
      --link: #2e5aa8;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --muted: #4f5d75;
      --paper: #f5f5f5;
      --rule: rgba(45, 49, 66, 0.12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #7a8399;
      --paper-2: #ececec;
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--muted);
      font: 500 0.66rem/1 var(--mono);
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--ink);
      font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .diagram {
      overflow-x: auto;
    }

    svg {
      display: block;
      min-width: 920px;
      width: 100%;
    }

    svg .zone {
      fill: rgba(45, 49, 66, 0.02);
      stroke: rgba(45, 49, 66, 0.10);
      stroke-width: 0.8;
    }

    svg .zone-mask, svg .node-mask, svg .label-mask {
      fill: #f5f5f5;
    }

    svg .zone-label, svg .arrow-label, svg .legend-label {
      font-family: 'Geist Mono', monospace;
    }

    svg .zone-label {
      fill: rgba(45, 49, 66, 0.40);
      font-size: 8px;
      letter-spacing: 0.14em;
    }

    svg .node {
      fill: #fff;
      stroke: #2d3142;
      stroke-width: 1;
    }

    svg .node.external {
      stroke: #4f5d75;
      stroke-dasharray: 4 3;
    }

    svg .node.focal {
      fill: rgba(235, 108, 54, 0.07);
      stroke: #eb6c36;
      stroke-width: 1.4;
    }

    svg .node.survivor {
      fill: rgba(124, 143, 111, 0.06);
      stroke: rgba(124, 143, 111, 0.45);
    }

    svg .node-name {
      fill: #2d3142;
      font: 600 12px 'Geist', sans-serif;
    }

    svg .node-name.survivor {
      fill: #7c8f6f;
    }

    svg .sub {
      fill: #4f5d75;
      font: 400 10px 'Geist Mono', monospace;
    }

    svg .sub.focal {
      fill: #eb6c36;
    }

    svg .arrow-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    svg .legend-label {
      fill: #4f5d75;
      font-size: 8px;
    }
  </style>
</head>
<body>
<main class="frame">
  <p class="eyebrow">IT current-state · Northwind Retail</p>
  <h1>Legacy retail reporting landscape</h1>
  <p class="subtitle">File exports, desktop spreadsheets, and manual publication before a shared
    data platform.</p>
  <div class="diagram">
    <svg aria-labelledby="it-state-title it-state-desc" role="img" viewBox="0 0 960 500"
         xmlns="http://www.w3.org/2000/svg">
      <title id="it-state-title">Northwind Retail current IT landscape</title>
      <desc id="it-state-desc">Three zones show collection, processing, and dissemination through
        manual file handoffs.
      </desc>
      <defs>
        <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
          <polygon fill="#4f5d75" points="0 0, 8 3, 0 6"/>
        </marker>
        <marker id="arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
          <polygon fill="#2e5aa8" points="0 0, 8 3, 0 6"/>
        </marker>
        <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
          <polygon fill="#eb6c36" points="0 0, 8 3, 0 6"/>
        </marker>
        <symbol fill="none" id="icon-file" stroke="currentColor" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
          <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2"/>
        </symbol>
        <symbol fill="none" id="icon-screen" stroke="currentColor" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24">
          <rect height="12" rx="1" width="18" x="3" y="4"/>
          <path d="M7 20h10M9 16v4M15 16v4"/>
        </symbol>
        <symbol fill="none" id="icon-db" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24">
          <ellipse cx="12" cy="6" rx="8" ry="3"/>
          <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
        </symbol>
        <symbol fill="none" id="icon-users" stroke="currentColor" stroke-linecap="round"
                stroke-width="1.5" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="4"/>
          <path
              d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 4.5a4 4 0 0 1 0 7M18 15a4 4 0 0 1 3 4v2"/>
        </symbol>
      </defs>

      <rect fill="#f5f5f5" height="500" width="960"/>

      <!-- Phase zones -->
      <rect class="zone" height="360" rx="8" width="256" x="16" y="52"/>
      <rect class="zone-mask" height="16" width="92" x="36" y="44"/>
      <text class="zone-label" x="40" y="56">COLLECTION</text>
      <rect class="zone" height="360" rx="8" width="360" x="292" y="52"/>
      <rect class="zone-mask" height="16" width="92" x="312" y="44"/>
      <text class="zone-label" x="316" y="56">PROCESSING</text>
      <rect class="zone" height="360" rx="8" width="272" x="672" y="52"/>
      <rect class="zone-mask" height="16" width="116" x="692" y="44"/>
      <text class="zone-label" x="696" y="56">DISSEMINATION</text>

      <!-- Connectors first; Shared Drive entries fan to y=108,124,140 -->
      <path d="M 252,108 H 340" fill="none" marker-end="url(#arrow-link)" stroke="#2e5aa8"
            stroke-width="1.2"/>
      <path d="M 252,196 H 308 Q 316,196 316,188 V 132 Q 316,124 324,124 H 340" fill="none"
            marker-end="url(#arrow-link)" stroke="#2e5aa8" stroke-width="1.2"/>
      <path d="M 252,284 H 324 Q 332,284 332,276 V 148 Q 332,140 340,140" fill="none"
            marker-end="url(#arrow-link)" stroke="#2e5aa8" stroke-dasharray="4 3"
            stroke-width="1.2"/>
      <line marker-end="url(#arrow-accent)" stroke="#eb6c36" stroke-dasharray="4 3"
            stroke-width="1.4" x1="472" x2="472"
            y1="148" y2="232"/>
      <line marker-end="url(#arrow)" stroke="#4f5d75" stroke-width="1" x1="472" x2="472" y1="304"
            y2="344"/>
      <path d="M 604,268 H 654 Q 662,268 662,260 V 72 Q 662,64 670,64 H 800 Q 808,64 808,72 V 80"
            fill="none" marker-end="url(#arrow-accent)" stroke="#eb6c36" stroke-width="1.4"/>
      <line marker-end="url(#arrow-link)" stroke="#2e5aa8" stroke-width="1.2" x1="808" x2="808"
            y1="140"
            y2="216"/>
      <line marker-end="url(#arrow-link)" stroke="#2e5aa8" stroke-dasharray="4 3" stroke-width="1.2"
            x1="808" x2="808"
            y1="272" y2="344"/>

      <!-- Collection -->
      <rect class="node-mask" height="56" rx="6" width="216" x="36" y="80"/>
      <rect class="node" height="56" rx="6" width="216" x="36" y="80"/>
      <use color="#2d3142" height="24" href="#icon-file" width="24" x="48" y="96"/>
      <text class="node-name" x="80" y="106">Point-of-Sale Exports</text>
      <text class="sub" x="80" y="122">nightly · CSV</text>
      <rect class="node-mask" height="56" rx="6" width="216" x="36" y="168"/>
      <rect class="node" height="56" rx="6" width="216" x="36" y="168"/>
      <use color="#2d3142" height="24" href="#icon-file" width="24" x="48" y="184"/>
      <text class="node-name" x="80" y="194">Online Store Export</text>
      <text class="sub" x="80" y="210">orders · flat file</text>
      <rect class="node-mask" height="56" rx="6" width="216" x="36" y="256"/>
      <rect class="node external" height="56" rx="6" width="216" x="36" y="256"/>
      <use color="#4f5d75" height="24" href="#icon-file" width="24" x="48" y="272"/>
      <text class="node-name" x="80" y="282">Supplier Price Lists</text>
      <text class="sub" x="80" y="298">external · XLSX</text>

      <!-- Processing -->
      <rect class="node-mask" height="68" rx="6" width="264" x="340" y="80"/>
      <rect class="node focal" height="68" rx="6" width="264" x="340" y="80"/>
      <use color="#eb6c36" height="24" href="#icon-file" width="24" x="352" y="100"/>
      <text class="node-name" x="384" y="108">Shared Drive</text>
      <text class="sub focal" x="384" y="124">no version control</text>
      <text class="sub" x="384" y="140">department folders</text>
      <rect class="node-mask" height="72" rx="6" width="264" x="340" y="232"/>
      <rect class="node" height="72" rx="6" width="264" x="340" y="232"/>
      <use color="#2d3142" height="24" href="#icon-screen" width="24" x="352" y="256"/>
      <text class="node-name" x="384" y="262">Spreadsheet Handoffs</text>
      <text class="sub" x="384" y="278">local workbooks · macros</text>
      <text class="sub" x="384" y="292">manual reconciliation</text>
      <rect class="node-mask" height="56" rx="6" width="264" x="340" y="344"/>
      <rect class="node survivor" height="56" rx="6" width="264" x="340" y="344"/>
      <use color="#7c8f6f" height="24" href="#icon-db" width="24" x="352" y="360"/>
      <text class="node-name survivor" x="384" y="370">On-prem RDBMS</text>
      <text class="sub" x="384" y="386">inventory · finance</text>

      <!-- Dissemination -->
      <rect class="node-mask" height="60" rx="6" width="208" x="704" y="80"/>
      <rect class="node focal" height="60" rx="6" width="208" x="704" y="80"/>
      <use color="#eb6c36" height="24" href="#icon-screen" width="24" x="716" y="100"/>
      <text class="node-name" x="748" y="108">Reporting Portal</text>
      <text class="sub focal" x="748" y="124">manual refresh</text>
      <rect class="node-mask" height="56" rx="6" width="208" x="704" y="216"/>
      <rect class="node" height="56" rx="6" width="208" x="704" y="216"/>
      <use color="#2d3142" height="24" href="#icon-file" width="24" x="716" y="232"/>
      <text class="node-name" x="748" y="242">Email Report Packs</text>
      <text class="sub" x="748" y="258">weekly · PDF</text>
      <rect class="node-mask" height="56" rx="6" width="208" x="704" y="344"/>
      <rect class="node external" height="56" rx="6" width="208" x="704" y="344"/>
      <use color="#4f5d75" height="24" href="#icon-users" width="24" x="716" y="360"/>
      <text class="node-name" x="748" y="370">Regional Managers</text>
      <text class="sub" x="748" y="386">12 store regions</text>

      <!-- Labels are source-bound with a 6px perpendicular gap -->
      <rect class="label-mask" height="16" rx="2" width="40" x="260" y="86"/>
      <text class="arrow-label" fill="#2e5aa8" text-anchor="middle" x="280" y="98">CSV</text>
      <rect class="label-mask" height="16" rx="2" width="52" x="260" y="174"/>
      <text class="arrow-label" fill="#2e5aa8" text-anchor="middle" x="286" y="186">EXPORT</text>
      <rect class="label-mask" height="16" rx="2" width="44" x="260" y="262"/>
      <text class="arrow-label" fill="#2e5aa8" text-anchor="middle" x="282" y="274">XLSX</text>
      <rect class="label-mask" height="16" rx="2" width="40" x="478" y="156"/>
      <text class="arrow-label" fill="#eb6c36" text-anchor="middle" x="498" y="168">COPY</text>
      <rect class="label-mask" height="16" rx="2" width="40" x="478" y="312"/>
      <text class="arrow-label" fill="#4f5d75" text-anchor="middle" x="498" y="324">LOAD</text>
      <rect class="label-mask" height="16" rx="2" width="44" x="612" y="246"/>
      <text class="arrow-label" fill="#eb6c36" text-anchor="middle" x="634" y="258">XLSX</text>
      <rect class="label-mask" height="16" rx="2" width="36" x="814" y="148"/>
      <text class="arrow-label" fill="#2e5aa8" text-anchor="middle" x="832" y="160">PDF</text>
      <rect class="label-mask" height="16" rx="2" width="48" x="814" y="280"/>
      <text class="arrow-label" fill="#2e5aa8" text-anchor="middle" x="838" y="292">EMAIL</text>

      <!-- Legend strip -->
      <line stroke="rgba(45,49,66,0.12)" stroke-width="0.8" x1="16" x2="944" y1="440" y2="440"/>
      <text class="legend-label" letter-spacing="0.14em" x="16" y="460">LEGEND</text>
      <line stroke="#2e5aa8" stroke-width="1.2" x1="80" x2="104" y1="456" y2="456"/>
      <text class="legend-label" x="112" y="460">data flow</text>
      <line stroke="#eb6c36" stroke-width="1.4" x1="208" x2="232" y1="456" y2="456"/>
      <text class="legend-label" x="240" y="460">pain-point</text>
      <rect fill="#fff" height="12" rx="2" stroke="#4f5d75" stroke-dasharray="4 3"
            stroke-width="0.8" width="16"
            x="372" y="450"/>
      <text class="legend-label" x="396" y="460">external</text>
      <rect fill="rgba(235,108,54,0.07)" height="12" rx="2" stroke="#eb6c36" width="16" x="492"
            y="450"/>
      <text class="legend-label" x="516" y="460">bottleneck</text>
    </svg>
  </div>
</main>
</body>
</html>
