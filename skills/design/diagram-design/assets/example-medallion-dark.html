<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>E-commerce analytics · Medallion · Dark</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #f08a59;
      --ink: #f5f5f5;
      --link: #6a95d8;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --muted: #bfc0c0;
      --paper: #2d3142;
      --rule: rgba(245, 245, 245, 0.12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #8e98ac;
      --paper-2: #393e53;
      --accent-tint: rgba(240, 138, 89, 0.10);
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--muted);
      font: 500 0.66rem var(--mono);
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--ink);
      font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 1040px;
      width: 100%;
    }

    .tier-title {
      fill: var(--ink);
      font: 600 13px var(--sans);
      text-anchor: middle;
    }

    .bucket, .field-value, .example-value {
      fill: var(--muted);
      font: 400 9px var(--mono);
    }

    .bucket {
      text-anchor: middle;
    }

    .field-value {
      color: var(--muted);
    }

    .focal-text {
      fill: var(--accent);
    }

    .field-label {
      fill: var(--ink);
      font: 600 11px var(--sans);
    }

    .example-label, .arc-label, .path-tag {
      font-family: var(--mono);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .example-label {
      fill: var(--soft);
      font-size: 8px;
    }

    .arc-label {
      font-size: 10px;
      text-anchor: middle;
    }

    .path-title {
      fill: var(--ink);
      font: 600 11px var(--sans);
    }

    .path-sub {
      fill: var(--muted);
      font: 400 9px var(--mono);
    }
  </style>
</head>
<body>
<main class="frame">
  <p class="eyebrow">Medallion · Diagram Design</p>
  <h1>Five-tier e-commerce analytics storage</h1>

  <svg aria-labelledby="medallion-dark-title medallion-dark-desc" role="img" viewBox="0 0 1040 548"
       xmlns="http://www.w3.org/2000/svg">
    <title id="medallion-dark-title">Five-tier e-commerce analytics medallion</title>
    <desc id="medallion-dark-desc">Clickstream events and order records move from raw storage
      through anonymized, staging, and aggregated tiers before lifecycle archiving.
    </desc>
    <defs>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#bfc0c0" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#f08a59" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#6a95d8" points="0 0, 8 3, 0 6"/>
      </marker>
      <clipPath id="clip-raw">
        <rect height="380" rx="6" width="172" x="16" y="80"/>
      </clipPath>
      <clipPath id="clip-anon">
        <rect height="380" rx="6" width="172" x="204" y="80"/>
      </clipPath>
      <clipPath id="clip-stage">
        <rect height="380" rx="6" width="172" x="392" y="80"/>
      </clipPath>
      <clipPath id="clip-aggregate">
        <rect height="380" rx="6" width="172" x="580" y="80"/>
      </clipPath>
      <clipPath id="clip-archive">
        <rect height="380" rx="6" width="172" x="768" y="80"/>
      </clipPath>
    </defs>
    <rect fill="#2d3142" height="548" width="1040"/>

    <!-- Promotion arcs are the medallion type's required connector grammar. -->
    <path d="M102 80 C102 0 290 0 290 80" fill="none" marker-end="url(#arrow)" stroke="#bfc0c0"
          stroke-width="1.4"/>
    <path d="M290 80 C290 0 478 0 478 80" fill="none" marker-end="url(#arrow)" stroke="#bfc0c0"
          stroke-width="1.4"/>
    <path d="M478 80 C478 0 666 0 666 80" fill="none" marker-end="url(#arrow-accent)"
          stroke="#f08a59"
          stroke-width="1.6"/>
    <path d="M666 80 C666 0 854 0 854 80" fill="none" marker-end="url(#arrow)" stroke="#bfc0c0"
          stroke-dasharray="4,3" stroke-width="1.4"/>
    <text class="arc-label" fill="#bfc0c0" x="196" y="50">MASK IDS</text>
    <text class="arc-label" fill="#bfc0c0" x="384" y="50">CLEAN + JOIN</text>
    <text class="arc-label" fill="#f08a59" x="572" y="50">AGGREGATE</text>
    <text class="arc-label" fill="#bfc0c0" x="760" y="50">LIFECYCLE</text>

    <!-- Raw -->
    <rect fill="rgba(245,245,245,0.04)" height="380" rx="6" width="172" x="16" y="80"/>
    <rect clip-path="url(#clip-raw)" fill="rgba(142,152,172,0.16)" height="50" width="172" x="16"
          y="80"/>
    <rect fill="none" height="380" rx="6" stroke="#bfc0c0" width="172" x="16" y="80"/>
    <text class="tier-title" x="102" y="106">Raw</text>
    <text class="bucket" x="102" y="144">raw-commerce</text>
    <text class="field-label" x="32" y="180">Tool</text>
    <foreignObject height="24" width="140" x="32" y="186">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">NiFi
        ingest
      </div>
    </foreignObject>
    <text class="field-label" x="32" y="220">Format</text>
    <foreignObject height="24" width="140" x="32" y="226">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">JSON ·
        Parquet
      </div>
    </foreignObject>
    <text class="field-label" x="32" y="260">Writer</text>
    <foreignObject height="24" width="140" x="32" y="266">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Data
        Engineer
      </div>
    </foreignObject>
    <text class="example-label" x="32" y="360">E-COMMERCE EXAMPLE</text>
    <text class="example-value" x="32" y="374">clickstream events</text>
    <text class="example-value" x="32" y="388">order records</text>

    <!-- Anonymized -->
    <rect fill="rgba(245,245,245,0.04)" height="380" rx="6" width="172" x="204" y="80"/>
    <rect clip-path="url(#clip-anon)" fill="rgba(245,245,245,0.08)" height="50" width="172" x="204"
          y="80"/>
    <rect fill="none" height="380" rx="6" stroke="rgba(245,245,245,0.30)" width="172" x="204"
          y="80"/>
    <text class="tier-title" x="290" y="106">Anonymized</text>
    <text class="bucket" x="290" y="144">anon-commerce</text>
    <text class="field-label" x="220" y="180">Tool</text>
    <foreignObject height="24" width="140" x="220" y="186">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Trino
        SQL
      </div>
    </foreignObject>
    <text class="field-label" x="220" y="220">Format</text>
    <foreignObject height="24" width="140" x="220" y="226">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Iceberg
        · partitioned
      </div>
    </foreignObject>
    <text class="field-label" x="220" y="260">Writer</text>
    <foreignObject height="24" width="140" x="220" y="266">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Data
        Engineer
      </div>
    </foreignObject>
    <text class="example-label" x="220" y="360">E-COMMERCE EXAMPLE</text>
    <text class="example-value" x="220" y="374">session pseudonyms</text>
    <text class="example-value" x="220" y="388">masked customer IDs</text>

    <!-- Staging -->
    <rect fill="rgba(245,245,245,0.04)" height="380" rx="6" width="172" x="392" y="80"/>
    <rect clip-path="url(#clip-stage)" fill="rgba(245,245,245,0.08)" height="50" width="172" x="392"
          y="80"/>
    <rect fill="none" height="380" rx="6" stroke="rgba(245,245,245,0.30)" width="172" x="392"
          y="80"/>
    <text class="tier-title" x="478" y="106">Staging</text>
    <text class="bucket" x="478" y="144">staging-commerce</text>
    <text class="field-label" x="408" y="180">Tool</text>
    <foreignObject height="24" width="140" x="408" y="186">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Trino ·
        notebooks
      </div>
    </foreignObject>
    <text class="field-label" x="408" y="220">Format</text>
    <foreignObject height="24" width="140" x="408" y="226">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Iceberg
        · cleaned
      </div>
    </foreignObject>
    <text class="field-label" x="408" y="260">Writer</text>
    <foreignObject height="24" width="140" x="408" y="266">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Data
        Scientist
      </div>
    </foreignObject>
    <text class="example-label" x="408" y="360">E-COMMERCE EXAMPLE</text>
    <text class="example-value" x="408" y="374">joined order facts</text>
    <text class="example-value" x="408" y="388">validated event rows</text>

    <!-- Aggregated focal tier -->
    <rect fill="rgba(240,138,89,0.12)" height="380" rx="6" width="172" x="580" y="80"/>
    <rect clip-path="url(#clip-aggregate)" fill="rgba(240,138,89,0.20)" height="50" width="172"
          x="580"
          y="80"/>
    <rect fill="none" height="380" rx="6" stroke="#f08a59" stroke-width="1.6" width="172" x="580"
          y="80"/>
    <text class="tier-title" x="666" y="106">Aggregated</text>
    <text class="bucket focal-text" x="666" y="144">analytics-marts</text>
    <text class="field-label" x="596" y="180">Tool</text>
    <foreignObject height="24" width="140" x="596" y="186">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Trino
        INSERT
      </div>
    </foreignObject>
    <text class="field-label" x="596" y="220">Format</text>
    <foreignObject height="24" width="140" x="596" y="226">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Iceberg
        · metrics
      </div>
    </foreignObject>
    <text class="field-label" x="596" y="260">Writer</text>
    <foreignObject height="24" width="140" x="596" y="266">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Data
        Scientist
      </div>
    </foreignObject>
    <text class="example-label" x="596" y="360">E-COMMERCE EXAMPLE</text>
    <text class="example-value focal-text" x="596" y="374">daily conversion rate</text>
    <text class="example-value focal-text" x="596" y="388">revenue by channel</text>

    <!-- Archive -->
    <rect fill="rgba(245,245,245,0.06)" height="380" rx="6" width="172" x="768" y="80"/>
    <rect clip-path="url(#clip-archive)" fill="rgba(142,152,172,0.24)" height="50" width="172"
          x="768"
          y="80"/>
    <rect fill="none" height="380" rx="6" stroke="#bfc0c0" stroke-dasharray="5,3" width="172"
          x="768"
          y="80"/>
    <text class="tier-title" x="854" y="106">Archive</text>
    <text class="bucket" x="854" y="144">archive-commerce</text>
    <text class="field-label" x="784" y="180">Tool</text>
    <foreignObject height="24" width="140" x="784" y="186">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Object
        storage lifecycle
      </div>
    </foreignObject>
    <text class="field-label" x="784" y="220">Format</text>
    <foreignObject height="24" width="140" x="784" y="226">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Cold
        tier · immutable
      </div>
    </foreignObject>
    <text class="field-label" x="784" y="260">Writer</text>
    <foreignObject height="24" width="140" x="784" y="266">
      <div class="field-value" style="line-height:1.25" xmlns="http://www.w3.org/1999/xhtml">Data

    <text class="example-label" x="784" y="360">E-COMMERCE EXAMPLE</text>
    <text class="example-value" x="784" y="374">retained clickstream</text>

    <!-- Write-method paths -->
    <rect fill="rgba(245,245,245,0.04)" height="56" rx="6" stroke="rgba(245,245,245,0.20)"
          width="460" x="16"
          y="476"/>
    <rect fill="none" height="12" rx="2" stroke="rgba(245,245,245,0.30)" stroke-width="0.8"
          width="64" x="24"
          y="482"/>
    <text class="path-tag" fill="#f5f5f5" font-size="7" text-anchor="middle" x="56" y="491">SQL
      PATH
    </text>
    <text class="path-title" x="96" y="506">Trino INSERT INTO … SELECT</text>
    <text class="path-sub" x="96" y="522">filter · join · aggregate — repeatable transforms</text>
    <rect fill="rgba(245,245,245,0.04)" height="56" rx="6" stroke="rgba(245,245,245,0.20)"
          width="460" x="492"
          y="476"/>
    <rect fill="none" height="12" rx="2" stroke="rgba(245,245,245,0.30)" stroke-width="0.8"
          width="96" x="500"
          y="482"/>
    <text class="path-tag" fill="#f5f5f5" font-size="7" text-anchor="middle" x="548" y="491">
      NOTEBOOK PATH
    </text>
    <text class="path-title" x="604" y="506">Python notebooks on object storage</text>
    <text class="path-sub" x="604" y="522">explore · validate · model — interactive analysis</text>
  </svg>
</main>
</body>
</html>
