<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Product milestones · Timeline</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Timeline · Diagram Design</p>
  <h1>Product launch · fourteen months</h1>

  <svg aria-labelledby="timeline-title timeline-desc" role="img" viewBox="0 0 1000 420"
       xmlns="http://www.w3.org/2000/svg">
    <title id="timeline-title">Product launch · fourteen months</title>
    <desc id="timeline-desc">Timeline showing product milestones from the first post in February
      2025 through three design versions and the schematic skill in April 2026.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(45,49,66,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Year markers (background) -->
    <text fill="rgba(45,49,66,0.06)" font-family="'Geist Mono', monospace" font-size="72"
          font-weight="600" x="60"
          y="340">2025
    </text>
    <text fill="rgba(45,49,66,0.06)" font-family="'Geist Mono', monospace" font-size="72"
          font-weight="600" x="700"
          y="340">2026
    </text>

    <!-- Baseline -->
    <line stroke="rgba(79,93,117,0.45)" stroke-width="1" x1="80" x2="920" y1="240" y2="240"/>

    <!-- Year boundary tick (between 2025 and 2026) -->
    <line stroke="rgba(45,49,66,0.20)" stroke-width="1" x1="680" x2="680" y1="232" y2="248"/>
    <text fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          text-anchor="middle"
          x="680" y="260">JAN '26
    </text>

    <!-- Start / end caps -->
    <line stroke="rgba(45,49,66,0.20)" stroke-width="1" x1="80" x2="80" y1="232" y2="248"/>
    <line stroke="rgba(45,49,66,0.20)" stroke-width="1" x1="920" x2="920" y1="232" y2="248"/>

    <!-- Event 1: FEB 2025 · First post (below) -->
    <line stroke="rgba(45,49,66,0.30)" stroke-width="1" x1="100" x2="100" y1="240" y2="296"/>
    <circle cx="100" cy="240" fill="#2d3142" r="4"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          text-anchor="middle"
          x="100" y="312">FEB 2025
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="100" y="328">First post
    </text>

    <!-- Event 2: APR 2025 · Design v1 (above) -->
    <line stroke="rgba(45,49,66,0.30)" stroke-width="1" x1="240" x2="240" y1="184" y2="240"/>
    <circle cx="240" cy="240" fill="#2d3142" r="4"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          text-anchor="middle"
          x="240" y="156">APR 2025
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="240" y="172">Design v1
    </text>

    <!-- Event 3: SEP 2025 · Design v2 (below) -->
    <line stroke="rgba(45,49,66,0.30)" stroke-width="1" x1="500" x2="500" y1="240" y2="296"/>
    <circle cx="500" cy="240" fill="#2d3142" r="4"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          text-anchor="middle"
          x="500" y="312">SEP 2025
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="328">Design v2
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="500"
          y="344">typography pass
    </text>

    <!-- Event 4: JAN 2026 · Design v3 (above, coral major) -->
    <line stroke="#eb6c36" stroke-width="1" x1="740" x2="740" y1="160" y2="240"/>
    <circle cx="740" cy="240" fill="#eb6c36" r="6"/>
    <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          text-anchor="middle"
          x="740" y="128">JAN 2026
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
          text-anchor="middle"
          x="740" y="148">Design v3
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="740"
          y="164">complexity budget
    </text>

    <!-- Event 5: APR 2026 · now · Diagram Design skill (below, coral) -->
    <line stroke="#eb6c36" stroke-width="1" x1="900" x2="900" y1="240" y2="296"/>
    <circle cx="900" cy="240" fill="#eb6c36" r="6"/>
    <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em"
          text-anchor="middle"
          x="900" y="312">APR 2026 · NOW
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="900" y="328">Schematic skill
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="900"
          y="344">eight diagram types
    </text>

    <!-- Legend -->
    <line stroke="rgba(45,49,66,0.10)" stroke-width="0.8" x1="40" x2="960" y1="376" y2="376"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          x="40"
          y="392">LEGEND
    </text>

    <circle cx="52" cy="408" fill="#2d3142" r="4"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="68" y="412">Event
    </text>

    <circle cx="148" cy="408" fill="#eb6c36" r="6"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="164" y="412">Major
      milestone
    </text>

    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" font-style="italic"
          x="296"
          y="412">Spacing is proportional to real elapsed time.
    </text>
  </svg>
</div>
</body>
</html>
