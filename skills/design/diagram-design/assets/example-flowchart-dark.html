<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Should you write this as a skill?</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #f08a59;
      --color-ink: #f5f5f5;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #bfc0c0;
      --color-paper: #2d3142;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart · Diagram Design</p>
  <h1>Should you write this as a skill?</h1>

  <svg aria-labelledby="flowchart-dark-title flowchart-dark-desc" role="img" viewBox="0 0 1000 600"
       xmlns="http://www.w3.org/2000/svg">
    <title id="flowchart-dark-title">Should you write this as a skill?</title>
    <desc id="flowchart-dark-desc">Flowchart showing when a new workflow should stay manual, become
      a project note, or be written as a reusable skill.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#bfc0c0" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#f08a59" points="0 0, 8 3, 0 6"/>
      </marker>
    </defs>

    <rect fill="#2d3142" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Arrows (drawn first, behind nodes) -->
    <!-- Start → Step -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="500" x2="500" y1="88"
          y2="120"/>
    <!-- Step → Diamond 1 -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="500" x2="500" y1="168"
          y2="192"/>
    <!-- Diamond 1 "NO" right -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="600" x2="720" y1="240"
          y2="240"/>
    <!-- Diamond 1 "YES" down -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="500" x2="500" y1="288"
          y2="328"/>
    <!-- Diamond 2 "NO" right -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="600" x2="720" y1="376"
          y2="376"/>
    <!-- Diamond 2 "YES" down (coral — happy path) -->
    <line marker-end="url(#arrow-accent)" stroke="#f08a59" stroke-width="1.4" x1="500" x2="500"
          y1="424"
          y2="464"/>

    <!-- Arrow labels -->
    <rect fill="#2d3142" height="12" rx="2" width="24" x="644" y="230"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em"
          text-anchor="middle"
          x="656" y="239">NO
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="32" x="484" y="298"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em"
          text-anchor="middle"
          x="500" y="307">YES
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="24" x="644" y="366"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em"
          text-anchor="middle"
          x="656" y="375">NO
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="32" x="484" y="434"/>
    <text fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em"
          text-anchor="middle"
          x="500" y="443">YES
    </text>

    <!-- Start oval -->
    <rect fill="rgba(245,245,245,0.03)" height="48" rx="24" stroke="rgba(245,245,245,0.30)"
          stroke-width="1" width="160"
          x="420" y="40"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="68">New workflow
    </text>

    <!-- Rectangle: Step -->
    <rect fill="#393e53" height="48" rx="6" stroke="#f5f5f5" stroke-width="1" width="160" x="420"
          y="120"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="148">Do it manually once
    </text>

    <!-- Diamond 1: Repeated >3 times? -->
    <polygon fill="#393e53" points="500,192 600,240 500,288 400,240" stroke="#f5f5f5"
             stroke-width="1"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600"
          text-anchor="middle"
          x="500" y="238">Will you repeat
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600"
          text-anchor="middle"
          x="500" y="252">it >3 times?
    </text>

    <!-- End oval: One-off -->
    <rect fill="rgba(245,245,245,0.03)" height="48" rx="24" stroke="rgba(245,245,245,0.30)"
          stroke-width="1" width="160"
          x="720" y="216"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="800" y="240">One-off
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="800"
          y="254">keep manual
    </text>

    <!-- Diamond 2: Reusable across projects? -->
    <polygon fill="#393e53" points="500,328 600,376 500,424 400,376" stroke="#f5f5f5"
             stroke-width="1"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600"
          text-anchor="middle"
          x="500" y="374">Reusable across
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="11" font-weight="600"
          text-anchor="middle"
          x="500" y="388">projects?
    </text>

    <!-- End oval: CLAUDE.md note -->
    <rect fill="rgba(245,245,245,0.03)" height="48" rx="24" stroke="rgba(245,245,245,0.30)"
          stroke-width="1" width="160"
          x="720" y="352"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="800" y="376">CLAUDE.md note
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="800"
          y="390">project-scoped
    </text>

    <!-- End oval: Write a skill (coral focal) -->
    <rect fill="rgba(240,138,89,0.08)" height="56" rx="28" stroke="#f08a59" stroke-width="1"
          width="160"
          x="420" y="464"/>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="492">Write a skill
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="500"
          y="508">reusable + assets
    </text>

    <!-- Legend -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="540" y2="540"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          x="40"
          y="556">LEGEND · SHAPE CARRIES TYPE
    </text>

    <rect fill="rgba(245,245,245,0.03)" height="12" rx="6" stroke="rgba(245,245,245,0.30)"
          stroke-width="1" width="24"
          x="40" y="572"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="72" y="582">Start /
      end (oval)
    </text>

    <rect fill="#393e53" height="12" rx="2" stroke="#f5f5f5" stroke-width="1" width="24" x="220"
          y="572"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="252" y="582">Step
      (rectangle)
    </text>

    <polygon fill="#393e53" points="412,578 424,572 436,578 424,584" stroke="#f5f5f5"
             stroke-width="1"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="448" y="582">Decision
      (diamond)
    </text>

    <line marker-end="url(#arrow-accent)" stroke="#f08a59" stroke-width="1.4" x1="604" x2="632"
          y1="580"
          y2="580"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="640" y="582">Happy
      path
    </text>

    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="768" x2="796" y1="580"
          y2="580"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="804" y="582">Branch
    </text>
  </svg>
</div>
</body>
</html>
