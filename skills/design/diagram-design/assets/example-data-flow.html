<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Analytics pipeline · Data flow</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #eb6c36;
      --ink: #2d3142;
      --link: #2e5aa8;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --muted: #4f5d75;
      --paper: #f5f5f5;
      --rule: rgba(45, 49, 66, 0.12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #7a8399;
      --paper-2: #ececec;
      --accent-tint: rgba(235, 108, 54, 0.08);
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--muted);
      font: 500 0.66rem var(--mono);
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--ink);
      font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 728px;
      width: 100%;
    }

    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label {
      font-family: var(--mono);
      text-anchor: middle;
    }

    .step-number {
      fill: var(--ink);
      font-size: 7px;
      font-weight: 600;
    }

    .step-label {
      fill: var(--muted);
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .lane-label {
      fill: var(--muted);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.14em;
    }

    .role-text {
      fill: var(--ink);
      font-size: 6px;
      font-weight: 600;
    }

    .node-title {
      fill: var(--ink);
      font: 600 9px var(--sans);
      text-anchor: middle;
    }

    .node-sub {
      fill: var(--muted);
      font: 400 6.5px var(--mono);
      text-anchor: middle;
    }

    .node-tool {
      fill: var(--soft);
      font: 400 6.5px var(--mono);
      text-anchor: middle;
    }

    .chip-text {
      fill: #fff;
      font-size: 5px;
      font-weight: 700;
    }

    .focal-text {
      fill: var(--accent);
    }

    .legend-label {
      fill: var(--muted);
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-anchor: end;
    }

    .legend-text {
      fill: var(--muted);
      font: 400 7px var(--sans);
    }
  </style>
</head>
<body>
<main class="frame">
  <p class="eyebrow">Data flow · Diagram Design</p>
  <h1>Role-scoped analytics pipeline</h1>

  <svg aria-labelledby="data-flow-title data-flow-desc" role="img" viewBox="0 0 728 356"
       xmlns="http://www.w3.org/2000/svg">
    <title id="data-flow-title">Role-scoped analytics data flow</title>
    <desc id="data-flow-desc">A Data Engineer ingests and stores commerce data, a Data Scientist
      transforms and analyzes it, and an Analyst publishes a dashboard.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="11" cy="11" fill="rgba(45,49,66,0.10)" r="0.8"/>
      </pattern>
      <marker id="arr-muted" markerHeight="6" markerWidth="6" orient="auto" refX="5" refY="3">
        <path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/>
      </marker>
      <marker id="arr-accent" markerHeight="6" markerWidth="6" orient="auto" refX="5" refY="3">
        <path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/>
      </marker>
      <marker id="arr-link" markerHeight="6" markerWidth="6" orient="auto" refX="5" refY="3">
        <path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/>
      </marker>
    </defs>
    <rect fill="#f5f5f5" height="356" width="728"/>
    <rect fill="url(#dots)" height="356" width="728"/>
    <rect fill="rgba(45,49,66,0.018)" height="80" width="728" x="0" y="36"/>
    <rect fill="rgba(45,49,66,0.018)" height="80" width="728" x="0" y="196"/>

    <!-- Header and lane structure -->
    <line stroke="rgba(45,49,66,0.12)" stroke-width="0.8" x1="0" x2="728" y1="36" y2="36"/>
    <line stroke="rgba(45,49,66,0.12)" stroke-width="0.8" x1="0" x2="728" y1="116" y2="116"/>
    <line stroke="rgba(45,49,66,0.12)" stroke-width="0.8" x1="0" x2="728" y1="196" y2="196"/>
    <line stroke="rgba(45,49,66,0.12)" stroke-width="0.8" x1="0" x2="728" y1="276" y2="276"/>
    <line stroke="rgba(45,49,66,0.12)" stroke-width="0.8" x1="140" x2="140" y1="36" y2="276"/>

    <g aria-label="Pipeline steps">
      <rect fill="rgba(45,49,66,0.12)" height="16" rx="8" width="32" x="180" y="6"/>
      <text class="step-number" x="196" y="14">01</text>
      <text class="step-label" x="196" y="29">INGEST</text>
      <rect fill="rgba(45,49,66,0.12)" height="16" rx="8" width="32" x="292" y="6"/>
      <text class="step-number" x="308" y="14">02</text>
      <text class="step-label" x="308" y="29">STORE</text>
      <rect fill="rgba(235,108,54,0.20)" height="16" rx="8" width="32" x="404" y="6"/>
      <text class="step-number focal-text" x="420" y="14">03</text>
      <text class="step-label focal-text" x="420" y="29">TRANSFORM</text>
      <rect fill="rgba(45,49,66,0.12)" height="16" rx="8" width="32" x="516" y="6"/>
      <text class="step-number" x="532" y="14">04</text>
      <text class="step-label" x="532" y="29">ANALYZE</text>
      <rect fill="rgba(45,49,66,0.12)" height="16" rx="8" width="32" x="628" y="6"/>
      <text class="step-number" x="644" y="14">05</text>
      <text class="step-label" x="644" y="29">PUBLISH</text>
    </g>

    <g aria-label="Role lanes">
      <text class="lane-label" x="70" y="72">DATA</text>
      <text class="lane-label" x="70" y="84">ENGINEER</text>
      <text class="lane-label" x="70" y="152">DATA</text>
      <text class="lane-label" x="70" y="164">SCIENTIST</text>
      <text class="lane-label" x="70" y="232">ANALYTICS</text>
      <text class="lane-label" x="70" y="244">ANALYST</text>
    </g>

    <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
    <path d="M246 76 H258" fill="none" marker-end="url(#arr-muted)" stroke="#4f5d75"/>
    <path d="M358 76 H412 Q420 76 420 84 V124" fill="none" marker-end="url(#arr-accent)"
          stroke="#eb6c36"
          stroke-width="1.2"/>
    <path d="M470 156 H482" fill="none" marker-end="url(#arr-muted)" stroke="#4f5d75"/>
    <path d="M582 156 H636 Q644 156 644 164 V204" fill="none" marker-end="url(#arr-link)"
          stroke="#2e5aa8"/>
    <rect fill="#f5f5f5" height="12" rx="2" width="48" x="368" y="56"/>
    <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em"
          text-anchor="middle"
          x="392" y="65">RAW TABLE
    </text>

    <!-- Data Engineer: Capture Events -->
    <rect fill="#f5f5f5" height="64" rx="6" stroke="rgba(45,49,66,0.25)" width="100" x="146"
          y="44"/>
    <rect fill="rgba(45,49,66,0.12)" height="10" rx="3" width="18" x="150" y="48"/>
    <text class="role-text" x="159" y="53">ENG</text>
    <text class="node-title" x="196" y="67">Capture Events</text>
    <text class="node-sub" x="196" y="79">shop events → batch</text>
    <text class="node-tool" x="196" y="91">NiFi ingest</text>
    <rect fill="#7c8f6f" height="8" rx="3" width="16" x="150" y="98"/>
    <text class="chip-text" x="158" y="104">LS</text>
    <rect fill="#5e7a9b" height="8" rx="3" width="16" x="226" y="98"/>
    <text class="chip-text" x="234" y="104">DB</text>

    <!-- Data Engineer: Land Records -->
    <rect fill="#f5f5f5" height="64" rx="6" stroke="rgba(45,49,66,0.25)" width="100" x="258"
          y="44"/>
    <rect fill="rgba(45,49,66,0.12)" height="10" rx="3" width="18" x="262" y="48"/>
    <text class="role-text" x="271" y="53">ENG</text>
    <text class="node-title" x="308" y="67">Land Records</text>
    <text class="node-sub" x="308" y="79">events · orders</text>
    <text class="node-tool" x="308" y="91">Object storage</text>
    <rect fill="#5e7a9b" height="8" rx="3" width="16" x="262" y="98"/>
    <text class="chip-text" x="270" y="104">DB</text>
    <rect fill="#5e7a9b" height="8" rx="3" width="16" x="338" y="98"/>
    <text class="chip-text" x="346" y="104">DB</text>

    <!-- Data Scientist: Clean and Model (focal) -->
    <rect fill="rgba(235,108,54,0.07)" height="64" rx="6" stroke="#eb6c36" stroke-width="1.2"
          width="100"
          x="370" y="124"/>
    <rect fill="rgba(235,108,54,0.20)" height="10" rx="3" width="18" x="374" y="128"/>
    <text class="role-text focal-text" x="383" y="133">SCI</text>
    <text class="node-title" x="420" y="147">Clean &amp; Model</text>
    <text class="node-sub" x="420" y="159">raw → trusted table</text>
    <text class="node-tool" x="420" y="171">Trino · notebooks</text>
    <rect fill="#5e7a9b" height="8" rx="3" width="16" x="374" y="178"/>
    <text class="chip-text" x="382" y="184">DB</text>
    <rect fill="#b8915a" height="8" rx="3" width="16" x="450" y="178"/>
    <text class="chip-text" x="458" y="184">TB</text>

    <!-- Data Scientist: Curate Metrics -->
    <rect fill="#f5f5f5" height="64" rx="6" stroke="rgba(45,49,66,0.25)" width="100" x="482"
          y="124"/>
    <rect fill="rgba(45,49,66,0.12)" height="10" rx="3" width="18" x="486" y="128"/>
    <text class="role-text" x="495" y="133">SCI</text>
    <text class="node-title" x="532" y="147">Curate Metrics</text>
    <text class="node-sub" x="532" y="159">conversion · revenue</text>
    <text class="node-tool" x="532" y="171">Trino SQL</text>
    <rect fill="#b8915a" height="8" rx="3" width="16" x="486" y="178"/>
    <text class="chip-text" x="494" y="184">TB</text>
    <rect fill="#b8915a" height="8" rx="3" width="16" x="562" y="178"/>
    <text class="chip-text" x="570" y="184">TB</text>

    <!-- Analyst: Publish Dashboard -->
    <rect fill="#f5f5f5" height="64" rx="6" stroke="rgba(45,49,66,0.25)" width="100" x="594"
          y="204"/>
    <rect fill="rgba(45,49,66,0.12)" height="10" rx="3" width="18" x="598" y="208"/>
    <text class="role-text" x="607" y="213">ANL</text>
    <text class="node-title" x="644" y="227">Publish Dashboard</text>
    <text class="node-sub" x="644" y="239">metrics → decisions</text>
    <text class="node-tool" x="644" y="251">BI workspace</text>
    <rect fill="#b8915a" height="8" rx="3" width="16" x="598" y="258"/>
    <text class="chip-text" x="606" y="264">TB</text>
    <rect fill="#9c6b50" height="8" rx="3" width="16" x="674" y="258"/>
    <text class="chip-text" x="682" y="264">FL</text>

    <!-- Legend: steps -->
    <text class="legend-label" x="164" y="293">STEPS</text>
    <rect fill="rgba(45,49,66,0.12)" height="12" rx="6" width="24" x="180" y="284"/>
    <text class="step-number" x="192" y="292">01</text>
    <text class="legend-text" x="212" y="293">Ingest</text>
    <rect fill="rgba(45,49,66,0.12)" height="12" rx="6" width="24" x="272" y="284"/>
    <text class="step-number" x="284" y="292">02</text>
    <text class="legend-text" x="304" y="293">Store</text>
    <rect fill="rgba(235,108,54,0.20)" height="12" rx="6" width="24" x="360" y="284"/>
    <text class="step-number focal-text" x="372" y="292">03</text>
    <text class="legend-text" x="392" y="293">Transform</text>
    <rect fill="rgba(45,49,66,0.12)" height="12" rx="6" width="24" x="468" y="284"/>
    <text class="step-number" x="480" y="292">04</text>
    <text class="legend-text" x="500" y="293">Analyze</text>
    <rect fill="rgba(45,49,66,0.12)" height="12" rx="6" width="24" x="568" y="284"/>
    <text class="step-number" x="580" y="292">05</text>
    <text class="legend-text" x="600" y="293">Publish</text>

    <!-- Legend: data types -->
    <text class="legend-label" x="164" y="314">DATA TYPE</text>
    <rect fill="#7c8f6f" height="8" rx="3" width="16" x="180" y="306"/>
    <text class="chip-text" x="188" y="312">LS</text>
    <text class="legend-text" x="202" y="314">Stream</text>
    <rect fill="#5e7a9b" height="8" rx="3" width="16" x="252" y="306"/>
    <text class="chip-text" x="260" y="312">DB</text>
    <text class="legend-text" x="274" y="314">Dataset</text>
    <rect fill="#b8915a" height="8" rx="3" width="16" x="332" y="306"/>
    <text class="chip-text" x="340" y="312">TB</text>
    <text class="legend-text" x="354" y="314">Table</text>
    <rect fill="#9c6b50" height="8" rx="3" width="16" x="404" y="306"/>
    <text class="chip-text" x="412" y="312">FL</text>
    <text class="legend-text" x="426" y="314">Dashboard</text>
    <text class="legend-text" x="500" y="314">left chip = input · right chip = output</text>

    <!-- Legend: flow -->
    <text class="legend-label" x="164" y="336">FLOW</text>
    <line marker-end="url(#arr-muted)" stroke="#4f5d75" x1="180" x2="204" y1="333" y2="333"/>
    <text class="legend-text" x="212" y="336">Standard handoff</text>
    <line marker-end="url(#arr-accent)" stroke="#eb6c36" stroke-width="1.2" x1="324" x2="348"
          y1="333"
          y2="333"/>
    <text class="legend-text" x="356" y="336">Focal handoff</text>
    <line marker-end="url(#arr-link)" stroke="#2e5aa8" x1="460" x2="484" y1="333" y2="333"/>
    <text class="legend-text" x="492" y="336">Published output</text>
  </svg>
</main>
</body>
</html>
