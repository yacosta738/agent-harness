<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Deploy frequency vs lead time · Scatter</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 760px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Scatter · Diagram Design</p>
  <h1>Deploy frequency vs. lead time · 12 teams</h1>

  <!-- X: 0-20 deploys/week → 880px. x = 80 + f/20*880 = 80+44*f -->
  <!-- Y: 0-24 days lead time → 380px. y = 420 - lt/24*380. High lt = high y (worse) -->
  <svg aria-labelledby="scatter-title scatter-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="scatter-title">Deploy frequency vs. lead time · 12 teams</title>
    <desc id="scatter-desc">Scatter plot showing twelve engineering teams by deploy frequency and
      lead time, with Platform in the best-performing quadrant.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(45,49,66,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Axis labels -->
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em"
          text-anchor="middle"
          transform="rotate(-90 24 230)" x="24" y="230">LEAD
      TIME (DAYS)
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em"
          text-anchor="middle"
          x="520" y="492">DEPLOYS PER WEEK
    </text>

    <!-- Gridlines -->
    <!-- Horizontal (constant lead time) -->
    <line stroke="rgba(45,49,66,0.08)" stroke-width="0.8" x1="80" x2="960" y1="325" y2="325"/>
    <line stroke="rgba(45,49,66,0.08)" stroke-width="0.8" x1="80" x2="960" y1="230" y2="230"/>
    <line stroke="rgba(45,49,66,0.08)" stroke-width="0.8" x1="80" x2="960" y1="135" y2="135"/>
    <line stroke="rgba(45,49,66,0.06)" stroke-width="0.8" x1="80" x2="960" y1="40" y2="40"/>
    <!-- Vertical (constant deploy freq) -->
    <line stroke="rgba(45,49,66,0.08)" stroke-width="0.8" x1="256" x2="256" y1="40" y2="420"/>
    <line stroke="rgba(45,49,66,0.08)" stroke-width="0.8" x1="432" x2="432" y1="40" y2="420"/>
    <line stroke="rgba(45,49,66,0.08)" stroke-width="0.8" x1="608" x2="608" y1="40" y2="420"/>
    <line stroke="rgba(45,49,66,0.08)" stroke-width="0.8" x1="784" x2="784" y1="40" y2="420"/>

    <!-- Axes -->
    <line stroke="rgba(45,49,66,0.25)" stroke-width="1" x1="80" x2="80" y1="40" y2="420"/>
    <line stroke="rgba(45,49,66,0.25)" stroke-width="1" x1="80" x2="960" y1="420" y2="420"/>

    <!-- Y-axis labels (lead time: 0 at bottom, 24 at top) -->
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end"
          x="72"
          y="324">6
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end"
          x="72"
          y="234">12
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end"
          x="72"
          y="139">18
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end"
          x="72"
          y="44">24
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end"
          x="72"
          y="424">0
    </text>

    <!-- X-axis labels (deploy frequency) -->
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle"
          x="80"
          y="440">0
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle"
          x="256"
          y="440">4
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle"
          x="432"
          y="440">8
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle"
          x="608"
          y="440">12
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle"
          x="784"
          y="440">16
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle"
          x="960"
          y="440">20
    </text>

    <!-- Trend line (dashed, approximate) -->
    <line stroke="rgba(45,49,66,0.18)" stroke-dasharray="4,3" stroke-width="1" x1="168" x2="900"
          y1="103"
          y2="388"/>

    <!-- ─── DATA POINTS (non-focal first) ─── -->
    <!-- (freq, lt) → (x=80+44*f, y=420-380*lt/24) -->
    <!-- (2,20)→(168,103), (4,18)→(256,135), (4,16)→(256,167), (6,14)→(344,198) -->
    <!-- (8,12)→(432,230), (8,10)→(432,262), (10,8)→(520,293), (12,6)→(608,325) -->
    <!-- (12,10)→(608,262), (16,4)→(784,357), (18,3)→(872,372) FOCAL, (20,2)→(960,388) -->

    <circle cx="168" cy="103" fill="#f5f5f5" r="5"/>
    <circle cx="168" cy="103" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="256" cy="135" fill="#f5f5f5" r="5"/>
    <circle cx="256" cy="135" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="256" cy="167" fill="#f5f5f5" r="5"/>
    <circle cx="256" cy="167" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="344" cy="198" fill="#f5f5f5" r="5"/>
    <circle cx="344" cy="198" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="432" cy="230" fill="#f5f5f5" r="5"/>
    <circle cx="432" cy="230" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="432" cy="262" fill="#f5f5f5" r="5"/>
    <circle cx="432" cy="262" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="520" cy="293" fill="#f5f5f5" r="5"/>
    <circle cx="520" cy="293" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="608" cy="325" fill="#f5f5f5" r="5"/>
    <circle cx="608" cy="325" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="608" cy="262" fill="#f5f5f5" r="5"/>
    <circle cx="608" cy="262" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="784" cy="357" fill="#f5f5f5" r="5"/>
    <circle cx="784" cy="357" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <circle cx="960" cy="388" fill="#f5f5f5" r="5"/>
    <circle cx="960" cy="388" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>

    <!-- FOCAL: Platform team (18,3) → (872,372) -->
    <circle cx="872" cy="372" fill="#f5f5f5" r="6"/>
    <circle cx="872" cy="372" fill="rgba(235,108,54,0.15)" r="6" stroke="#eb6c36"
            stroke-width="1.2"/>

    <!-- Focal label -->
    <rect fill="#f5f5f5" height="12" rx="2" width="64" x="798" y="348"/>
    <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em"
          text-anchor="middle"
          x="830" y="357">PLATFORM
    </text>

    <!-- Quadrant guides (optional) -->
    <text fill="rgba(45,49,66,0.25)" font-family="'Geist Mono', monospace" font-size="8" x="88"
          y="56">HIGH LEAD TIME
    </text>
    <text fill="rgba(45,49,66,0.25)" font-family="'Geist Mono', monospace" font-size="8" x="88"
          y="412">LOW LEAD TIME
    </text>

    <!-- Legend -->
    <line stroke="rgba(45,49,66,0.10)" stroke-width="0.8" x1="40" x2="960" y1="462" y2="462"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          x="40"
          y="478">LEGEND
    </text>

    <circle cx="52" cy="490" fill="rgba(235,108,54,0.15)" r="6" stroke="#eb6c36"
            stroke-width="1.2"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="68" y="494">Platform
      team · best performer
    </text>

    <circle cx="256" cy="490" fill="rgba(79,93,117,0.20)" r="5" stroke="#4f5d75" stroke-width="1"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="272" y="494">
      Engineering team
    </text>

    <line stroke="rgba(45,49,66,0.18)" stroke-dasharray="4,3" stroke-width="1" x1="416" x2="440"
          y1="490"
          y2="490"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="448" y="494">Trend
    </text>
  </svg>
</div>
</body>
</html>
