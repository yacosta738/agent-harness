<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Claude Code skill taxonomy · Tree</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Tree · Diagram Design</p>
  <h1>Claude Code skill taxonomy</h1>

  <svg aria-labelledby="tree-title tree-desc" role="img" viewBox="0 0 1000 480"
       xmlns="http://www.w3.org/2000/svg">
    <title id="tree-title">Claude Code skill taxonomy</title>
    <desc id="tree-desc">Tree diagram showing a Skills root branching into Design, Engineering, and
      Research categories and their leaf skills.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(45,49,66,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Tier tags (left margin) -->
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          x="40"
          y="108">TIER 0 · ROOT
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          text-anchor="start"
          x="40" y="224">TIER 1
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          text-anchor="start"
          x="40" y="324">TIER 2
    </text>

    <!-- Connectors drawn first (behind nodes) -->
    <!-- Root → Tier 1 bus -->
    <path d="M 500 128 L 500 168 L 220 168 L 220 208" fill="none" stroke="#4f5d75"
          stroke-width="1"/>
    <path d="M 500 168 L 500 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 500 168 L 780 168 L 780 208" fill="none" stroke="#4f5d75" stroke-width="1"/>

    <!-- Design → leaves -->
    <path d="M 220 256 L 220 296 L 140 296 L 140 336" fill="none" stroke="#4f5d75"
          stroke-width="1"/>
    <path d="M 220 296 L 300 296 L 300 336" fill="none" stroke="#4f5d75" stroke-width="1"/>

    <!-- Engineering → leaves -->
    <path d="M 500 256 L 500 296 L 480 296 L 480 336" fill="none" stroke="#4f5d75"
          stroke-width="1"/>
    <path d="M 500 296 L 660 296 L 660 336" fill="none" stroke="#4f5d75" stroke-width="1"/>

    <!-- Research → single leaf -->
    <path d="M 780 256 L 780 296 L 840 296 L 840 336" fill="none" stroke="#4f5d75"
          stroke-width="1"/>

    <!-- Root node: Skills (coral focal) -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="420" y="80"/>
    <rect fill="rgba(235,108,54,0.08)" height="48" rx="6" stroke="#eb6c36" stroke-width="1"
          width="160"
          x="420" y="80"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"
          width="32"
          x="428" y="88"/>
    <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="444" y="97">ROOT
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="118">Skills
    </text>

    <!-- Tier 1: Design -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="140" y="208"/>
    <rect fill="#ffffff" height="48" rx="6" stroke="#2d3142" stroke-width="1" width="160" x="140"
          y="208"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"
          width="28"
          x="148" y="216"/>
    <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="162" y="225">CAT
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="220" y="240">Design
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="220"
          y="252">ui · visual · ux
    </text>

    <!-- Tier 1: Engineering -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="420" y="208"/>
    <rect fill="#ffffff" height="48" rx="6" stroke="#2d3142" stroke-width="1" width="160" x="420"
          y="208"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"
          width="28"
          x="428" y="216"/>
    <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="442" y="225">CAT
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="500" y="240">Engineering
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="500"
          y="252">ship · review · test
    </text>

    <!-- Tier 1: Research -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="700" y="208"/>
    <rect fill="#ffffff" height="48" rx="6" stroke="#2d3142" stroke-width="1" width="160" x="700"
          y="208"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"
          width="28"
          x="708" y="216"/>
    <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="722" y="225">CAT
    </text>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="780" y="240">Research
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="780"
          y="252">investigate · analyze
    </text>

    <!-- Tier 2: polish -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="60" y="336"/>
    <rect fill="rgba(45,49,66,0.05)" height="48" rx="6" stroke="#4f5d75" stroke-width="0.8"
          width="160" x="60"
          y="336"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="140" y="360">polish
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="140"
          y="372">align · space · rhythm
    </text>

    <!-- Tier 2: critique -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="220" y="336"/>
    <rect fill="rgba(45,49,66,0.05)" height="48" rx="6" stroke="#4f5d75" stroke-width="0.8"
          width="160" x="220"
          y="336"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="300" y="360">critique
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="300"
          y="372">hierarchy · density
    </text>

    <!-- Tier 2: review -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="400" y="336"/>
    <rect fill="rgba(45,49,66,0.05)" height="48" rx="6" stroke="#4f5d75" stroke-width="0.8"
          width="160" x="400"
          y="336"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="480" y="360">review
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="480"
          y="372">pre-land diff · sql
    </text>

    <!-- Tier 2: ship -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="580" y="336"/>
    <rect fill="rgba(45,49,66,0.05)" height="48" rx="6" stroke="#4f5d75" stroke-width="0.8"
          width="160" x="580"
          y="336"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="660" y="360">ship
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="660"
          y="372">merge · deploy · verify
    </text>

    <!-- Tier 2: investigate -->
    <rect fill="#f5f5f5" height="48" rx="6" width="160" x="760" y="336"/>
    <rect fill="rgba(45,49,66,0.05)" height="48" rx="6" stroke="#4f5d75" stroke-width="0.8"
          width="160" x="760"
          y="336"/>
    <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600"
          text-anchor="middle"
          x="840" y="360">investigate
    </text>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="840"
          y="372">root cause · evidence
    </text>

    <!-- Legend strip -->
    <line stroke="rgba(45,49,66,0.10)" stroke-width="0.8" x1="40" x2="960" y1="412" y2="412"/>
    <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em"
          x="40"
          y="428">LEGEND
    </text>

    <rect fill="rgba(235,108,54,0.08)" height="10" rx="2" stroke="#eb6c36" stroke-width="1"
          width="14" x="40"
          y="444"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="60" y="452">Root ·
      focal
    </text>

    <rect fill="#ffffff" height="10" rx="2" stroke="#2d3142" stroke-width="1" width="14" x="180"
          y="444"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="200" y="452">Category
      branch
    </text>

    <rect fill="rgba(45,49,66,0.05)" height="10" rx="2" stroke="#4f5d75" stroke-width="0.8"
          width="14" x="340"
          y="444"/>
    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" x="360" y="452">Leaf
      skill
    </text>

    <text fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8.5" font-style="italic"
          x="500"
          y="452">Orthogonal connectors only. Coral marks the root — every branch
      descends from one idea.
    </text>
  </svg>
</div>
</body>
</html>
