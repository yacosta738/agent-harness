<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Article lifecycle · State machine</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #f08a59;
      --color-ink: #f5f5f5;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #bfc0c0;
      --color-paper: #2d3142;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">State machine · Diagram Design</p>
  <h1>Article lifecycle</h1>

  <svg aria-labelledby="state-dark-title state-dark-desc" role="img" viewBox="0 0 1000 460"
       xmlns="http://www.w3.org/2000/svg">
    <title id="state-dark-title">Article lifecycle</title>
    <desc id="state-dark-desc">State machine showing an article moving from Draft through In Review
      and Published to Archived, including rejection and revision.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#bfc0c0" points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#f08a59" points="0 0, 8 3, 0 6"/>
      </marker>
    </defs>

    <rect fill="#2d3142" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Transitions (drawn first) -->
    <!-- Start → Draft -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="68" x2="120" y1="200"
          y2="200"/>
    <!-- Draft → In Review -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="280" x2="340" y1="200"
          y2="200"/>
    <!-- In Review → Published (coral — happy path) -->
    <line marker-end="url(#arrow-accent)" stroke="#f08a59" stroke-width="1.4" x1="500" x2="560"
          y1="200"
          y2="200"/>
    <!-- Published → Archived (down) -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="640" x2="640" y1="240"
          y2="300"/>
    <!-- Archived → End (down) -->
    <line marker-end="url(#arrow)" stroke="#bfc0c0" stroke-width="1.2" x1="640" x2="640" y1="400"
          y2="432"/>
    <!-- In Review → Draft (curved back up-and-left) -->
    <path d="M 420 160 C 420 96, 200 96, 200 160" fill="none" marker-end="url(#arrow)"
          stroke="#bfc0c0"
          stroke-dasharray="5,4" stroke-width="1.2"/>

    <!-- Transition labels -->
    <rect fill="#2d3142" height="12" rx="2" width="48" x="172" y="184"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em"
          text-anchor="middle"
          x="196" y="194">CREATE
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="48" x="288" y="184"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em"
          text-anchor="middle"
          x="312" y="194">SUBMIT
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="60" x="500" y="184"/>
    <text fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em"
          text-anchor="middle"
          x="530" y="194">APPROVE
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="56" x="612" y="264"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em"
          text-anchor="middle"
          x="640" y="274">EXPIRE
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="40" x="620" y="416"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em"
          text-anchor="middle"
          x="640" y="426">PURGE
    </text>

    <!-- Reject label on curved path -->
    <rect fill="#2d3142" height="12" rx="2" width="80" x="276" y="92"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em"
          text-anchor="middle"
          x="316" y="102">REJECT · REVISE
    </text>

    <!-- Start dot (filled ink) -->
    <circle cx="60" cy="200" fill="#f5f5f5" r="6"/>

    <!-- State: Draft -->
    <rect fill="#393e53" height="80" rx="8" stroke="#f5f5f5" stroke-width="1" width="160" x="120"
          y="160"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"
          width="40"
          x="128" y="168"/>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="148" y="177">STATE
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
          text-anchor="middle"
          x="200" y="208">Draft
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="200"
          y="224">unpublished
    </text>

    <!-- State: In Review -->
    <rect fill="#393e53" height="80" rx="8" stroke="#f5f5f5" stroke-width="1" width="160" x="340"
          y="160"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"
          width="40"
          x="348" y="168"/>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="368" y="177">STATE
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
          text-anchor="middle"
          x="420" y="208">In Review
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="420"
          y="224">awaiting approval
    </text>

    <!-- State: Published (focal coral) -->
    <rect fill="rgba(240,138,89,0.08)" height="80" rx="8" stroke="#f08a59" stroke-width="1"
          width="160"
          x="560" y="160"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"
          width="40"
          x="568" y="168"/>
    <text fill="#f08a59" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="588" y="177">STATE
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
          text-anchor="middle"
          x="640" y="208">Published
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="640"
          y="224">live on site
    </text>

    <!-- State: Archived -->
    <rect fill="rgba(245,245,245,0.05)" height="100" rx="8" stroke="#bfc0c0" stroke-width="1"
          width="160"
          x="560" y="300"/>
    <rect fill="transparent" height="12" rx="2" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"
          width="40"
          x="568" y="308"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.08em"
          text-anchor="middle"
          x="588" y="317">STATE
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
          text-anchor="middle"
          x="640" y="348">Archived
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="640"
          y="364">noindex · hidden
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle"
          x="640"
          y="382">redirect retained
    </text>

    <!-- End ring dot -->
    <circle cx="640" cy="440" fill="none" r="8" stroke="#f5f5f5" stroke-width="1"/>
    <circle cx="640" cy="440" fill="#f5f5f5" r="5"/>
  </svg>
</div>
</body>
</html>
