<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Weekly signups · Line chart · dark</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #eb6c36;
      --color-ink: #2d3142;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #4f5d75;
      --color-paper: #f5f5f5;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 760px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Line · Diagram Design</p>
  <h1>Weekly signups · Organic leads the growth</h1>

  <svg aria-labelledby="line-dark-title line-dark-desc" role="img" viewBox="0 0 1000 500"
       xmlns="http://www.w3.org/2000/svg">
    <title id="line-dark-title">Weekly signups · Organic leads the growth</title>
    <desc id="line-dark-desc">Line chart showing weekly signups from organic, direct, and referral
      channels across weeks W1 through W8.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
    </defs>

    <rect fill="#f5f5f5" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Y-axis rotated label -->
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em" text-anchor="middle"
          transform="rotate(-90 24 230)" x="24" y="230">SIGNUPS
      / WEEK
    </text>

    <!-- Gridlines -->
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="357" y2="357"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="293" y2="293"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="230" y2="230"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="167" y2="167"/>
    <line stroke="rgba(245,245,245,0.08)" stroke-width="0.8" x1="80" x2="960" y1="103" y2="103"/>
    <line stroke="rgba(245,245,245,0.06)" stroke-width="0.8" x1="80" x2="960" y1="40" y2="40"/>

    <!-- Axes -->
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="80" x2="80" y1="40" y2="420"/>
    <line stroke="rgba(245,245,245,0.20)" stroke-width="1" x1="80" x2="960" y1="420" y2="420"/>

    <!-- Y-axis labels -->
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="361">40
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="297">80
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="234">120
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="171">160
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="107">200
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end" x="72"
          y="44">240
    </text>

    <!-- ─── SERIES (non-focal drawn first) ─── -->
    <!-- Referral: [45,52,48,60,55,68,62,75] series-2 dusty-blue -->
    <polyline fill="none"
              points="80,349 200,338 320,344 440,325 560,333 680,312 800,322 920,301" stroke="#82a0c0" stroke-linejoin="round" stroke-width="1.2"/>

    <!-- Direct: [80,82,88,90,86,92,95,98] series-1 sage -->
    <polyline fill="none"
              points="80,293 200,290 320,281 440,278 560,284 680,274 800,270 920,265" stroke="#9caf8f" stroke-linejoin="round" stroke-width="1.2"/>

    <!-- Organic FOCAL area fill (subtle) -->
    <polygon fill="rgba(240,138,89,0.08)"
             points="80,230 200,206 320,186 440,164 560,175 680,138 800,111 920,88 920,420 80,420"/>

    <!-- Organic FOCAL line: [120,135,148,162,155,178,195,210] accent -->
    <polyline fill="none"
              points="80,230 200,206 320,186 440,164 560,175 680,138 800,111 920,88" stroke="#f08a59" stroke-linejoin="round" stroke-width="1.8"/>

    <!-- Focal vertex dots -->
    <circle cx="80" cy="230" fill="#f08a59" r="4"/>
    <circle cx="200" cy="206" fill="#f08a59" r="4"/>
    <circle cx="320" cy="186" fill="#f08a59" r="4"/>
    <circle cx="440" cy="164" fill="#f08a59" r="4"/>
    <circle cx="560" cy="175" fill="#f08a59" r="4"/>
    <circle cx="680" cy="138" fill="#f08a59" r="4"/>
    <circle cx="800" cy="111" fill="#f08a59" r="4"/>
    <circle cx="920" cy="88" fill="#f08a59" r="4"/>

    <!-- X-axis labels -->
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="80"
          y="440">W1
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="200"
          y="440">W2
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="320"
          y="440">W3
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="440"
          y="440">W4
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="560"
          y="440">W5
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="680"
          y="440">W6
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="800"
          y="440">W7
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" x="920"
          y="440">W8
    </text>

    <!-- Legend -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="462" y2="462"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" x="40"
          y="478">LEGEND
    </text>

    <line stroke="#f08a59" stroke-width="1.8" x1="40" x2="64" y1="492" y2="492"/>
    <circle cx="52" cy="492" fill="#f08a59" r="4"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="72" y="496">Organic ·
      focal
    </text>

    <line stroke="#9caf8f" stroke-width="1.2" x1="200" x2="224" y1="492" y2="492"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="232" y="496">Direct
    </text>

    <line stroke="#82a0c0" stroke-width="1.2" x1="316" x2="340" y1="492" y2="492"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="348" y="496">
      Referral
    </text>
  </svg>
</div>
</body>
</html>
