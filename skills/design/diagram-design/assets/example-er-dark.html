<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Content platform · ER model</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-accent: #f08a59;
      --color-ink: #f5f5f5;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --color-muted: #bfc0c0;
      --color-paper: #2d3142;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    body {
      align-items: center;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      font-family: var(--font-sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    h1 {
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    svg {
      display: block;
      min-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">ER · Diagram Design</p>
  <h1>Content platform · data model</h1>

  <svg aria-labelledby="er-dark-title er-dark-desc" role="img" viewBox="0 0 1000 480"
       xmlns="http://www.w3.org/2000/svg">
    <title id="er-dark-title">Content platform · data model</title>
    <desc id="er-dark-desc">Entity-relationship diagram showing authors writing articles and
      articles connecting to tags and categories.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="rgba(245,245,245,0.10)" r="0.9"/>
      </pattern>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="#bfc0c0" points="0 0, 8 3, 0 6"/>
      </marker>
    </defs>

    <rect fill="#2d3142" height="100%" width="100%"/>
    <rect fill="url(#dots)" height="100%" opacity="0.55" width="100%"/>

    <!-- Relationship lines (drawn first) -->
    <!-- 1. Author — Article (1:N "writes") -->
    <line stroke="#bfc0c0" stroke-width="1" x1="260" x2="400" y1="240" y2="240"/>
    <!-- 2. Article — ArticleTag (1:N) -->
    <path d="M 640,320 H 702 Q 710,320 710,328 H 780" fill="none" stroke="#bfc0c0"
          stroke-width="1"/>
    <!-- 3. Tag — ArticleTag (1:N, vertical) -->
    <line stroke="#bfc0c0" stroke-width="1" x1="880" x2="880" y1="248" y2="280"/>

    <!-- Cardinality labels -->
    <rect fill="#2d3142" height="12" rx="2" width="12" x="266" y="232"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle"
          x="272" y="242">1
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="16" x="378" y="232"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle"
          x="386" y="242">N
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="12" x="646" y="316"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle"
          x="652" y="326">1
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="16" x="760" y="324"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle"
          x="768" y="334">N
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="16" x="872" y="252"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle"
          x="880" y="262">1
    </text>

    <rect fill="#2d3142" height="12" rx="2" width="16" x="872" y="268"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" text-anchor="middle"
          x="880" y="278">N
    </text>

    <!-- Relationship labels -->
    <rect fill="#2d3142" height="14" rx="2" width="56" x="304" y="220"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em" text-anchor="middle"
          x="332" y="230">WRITES
    </text>

    <rect fill="#2d3142" height="14" rx="2" width="56" x="688" y="300"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em" text-anchor="middle"
          x="716" y="310">TAGGED
    </text>

    <!-- Entity: Author -->
    <rect fill="#393e53" height="160" rx="6" stroke="#f5f5f5" stroke-width="1" width="200" x="60"
          y="160"/>
    <rect fill="rgba(245,245,245,0.04)" height="40" rx="6" stroke="none" width="200" x="60"
          y="160"/>
    <rect fill="rgba(245,245,245,0.04)" height="8" width="200" x="60" y="192"/>
    <line stroke="rgba(245,245,245,0.22)" stroke-width="1" x1="60" x2="260" y1="200" y2="200"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="76"
          y="176">ENTITY
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600" x="76"
          y="192">Author
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="76" y="220"># id
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="220"
          y="220">uuid
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="76" y="240">
      handle
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="220"
          y="240">text
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="76" y="260">name
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="220"
          y="260">text
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="76" y="280">bio
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="220"
          y="280">text
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="76" y="300">
      site_url
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="220"
          y="300">text
    </text>

    <!-- Entity: Article (focal coral) -->
    <rect fill="rgba(240,138,89,0.04)" height="240" rx="6" stroke="#f08a59" stroke-width="1" width="240"
          x="400" y="120"/>
    <rect fill="rgba(240,138,89,0.10)" height="40" rx="6" stroke="none" width="240" x="400"
          y="120"/>
    <rect fill="rgba(240,138,89,0.10)" height="8" width="240" x="400" y="152"/>
    <line stroke="rgba(240,138,89,0.40)" stroke-width="1" x1="400" x2="640" y1="160" y2="160"/>
    <text fill="#f08a59" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="416"
          y="136">ENTITY · AGGREGATE ROOT
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600" x="416"
          y="152">Article
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="180"># id
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="180">uuid
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="200">
      title
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="200">text
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="220">slug
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="220">text · unique
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="240">
      body_mdx
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="240">text
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="260">
      published_at
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="260">timestamp
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="280">→
      author_id
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="280">uuid
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="300">
      status
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="300">enum
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="416" y="320">
      og_image
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="600"
          y="320">text · url
    </text>

    <!-- Entity: Tag -->
    <rect fill="#393e53" height="128" rx="6" stroke="#f5f5f5" stroke-width="1" width="200" x="780"
          y="120"/>
    <rect fill="rgba(245,245,245,0.04)" height="40" rx="6" stroke="none" width="200" x="780"
          y="120"/>
    <rect fill="rgba(245,245,245,0.04)" height="8" width="200" x="780" y="152"/>
    <line stroke="rgba(245,245,245,0.22)" stroke-width="1" x1="780" x2="980" y1="160" y2="160"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="796"
          y="136">ENTITY
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600" x="796"
          y="152">Tag
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="796" y="180"># id
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="940"
          y="180">uuid
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="796" y="200">slug
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="940"
          y="200">text · unique
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="796" y="220">name
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="940"
          y="220">text
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="796" y="240">
      description
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="940"
          y="240">text
    </text>

    <!-- Entity: ArticleTag (join) -->
    <rect fill="rgba(245,245,245,0.04)" height="96" rx="6" stroke="#bfc0c0" stroke-dasharray="4,3" stroke-width="1"
          width="200" x="780" y="280"/>
    <rect fill="rgba(245,245,245,0.06)" height="40" rx="6" stroke="none" width="200" x="780"
          y="280"/>
    <rect fill="rgba(245,245,245,0.06)" height="8" width="200" x="780" y="312"/>
    <line stroke="rgba(245,245,245,0.22)" stroke-width="1" x1="780" x2="980" y1="320" y2="320"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" x="796"
          y="296">JOIN
    </text>
    <text fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="14" font-weight="600" x="796"
          y="312">ArticleTag
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="796" y="340">→
      article_id
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="940"
          y="340">uuid
    </text>
    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" x="796" y="360">→
      tag_id
    </text>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end" x="940"
          y="360">uuid
    </text>

    <!-- Legend -->
    <line stroke="rgba(245,245,245,0.10)" stroke-width="0.8" x1="40" x2="960" y1="404" y2="404"/>
    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" x="40"
          y="420">LEGEND
    </text>

    <rect fill="rgba(240,138,89,0.04)" height="10" rx="2" stroke="#f08a59" stroke-width="1" width="14" x="40"
          y="436"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="60" y="444">Aggregate
      root
    </text>

    <rect fill="#393e53" height="10" rx="2" stroke="#f5f5f5" stroke-width="1" width="14" x="180"
          y="436"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="200" y="444">Entity
    </text>

    <rect fill="rgba(245,245,245,0.04)" height="10" rx="2" stroke="#bfc0c0" stroke-dasharray="3,2" stroke-width="1"
          width="14" x="268" y="436"/>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="288" y="444">Join
      table
    </text>

    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" x="372"
          y="444">#
    </text>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="388" y="444">Primary
      key
    </text>

    <text fill="#f5f5f5" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" x="476"
          y="444">→
    </text>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="492" y="444">Foreign
      key
    </text>

    <text fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" x="584"
          y="444">1 / N
    </text>
    <text fill="#bfc0c0" font-family="'Geist', sans-serif" font-size="8.5" x="616" y="444">
      Cardinality
    </text>
  </svg>
</div>
</body>
</html>
