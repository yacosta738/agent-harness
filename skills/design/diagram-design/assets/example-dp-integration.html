<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Generic data platform · Integration topology</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --accent: #eb6c36;
      --dot: rgba(45, 49, 66, .10);
      --ink: #2d3142;
      --link: #2e5aa8;
      --mono: 'Geist Mono', ui-monospace, monospace
      --muted: #4f5d75;
      --paper: #f5f5f5;
      --rule: rgba(45, 49, 66, .12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #7a8399;
      --paper-2: #ececec;
      --custom-blue: #5e7a9b;
      --custom-blue-fill: rgba(94, 122, 155, .06);
      --custom-blue-stroke: rgba(94, 122, 155, .35);
      --bar-fill: rgba(45, 49, 66, .05);
      --node-fill: #fff;
      --side-fill: rgba(79, 93, 117, .06);
      --zone-fill: rgba(45, 49, 66, .025);
      --custom-red: #9c6b50;
      --custom-red-fill: rgba(156, 107, 80, .06);
      --custom-red-stroke: rgba(156, 107, 80, .35);
      --side-stroke: #7a8399;
      --zone-stroke: rgba(45, 49, 66, .32);
      --accent-tint: rgba(235, 108, 54, .08);
    }

    body {
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      font-family: var(--sans);
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem
    }

    .frame {
      max-width: 1200px;
      width: 100%
    }

    .eyebrow {
      color: var(--muted);
      font: 500 .66rem var(--mono);
      letter-spacing: .18em;
      margin-bottom: .5rem
      text-transform: uppercase;
    }

    h1 {
      font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -.02em;
      margin-bottom: 1.5rem
    }

    svg {
      display: block
      min-width: 1100px;
      width: 100%;
    }

    svg text {
      font-family: var(--sans)
    }

    .mono {
      font-family: var(--mono)
    }

    .connector {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.2
    }

    .connector.primary {
      stroke: var(--accent);
      stroke-width: 1.4
    }

    .connector.trigger {
      stroke: var(--muted);
      stroke-dasharray: 4 3
      stroke-width: 1;
    }

    .connector.auth {
      stroke: var(--accent);
      stroke-dasharray: 5 4
      stroke-width: 1.2;
    }

    .label-mask {
      fill: var(--paper)
    }

    .edge-label {
      fill: var(--accent);
      font: 8px var(--mono);
      letter-spacing: .06em
    }

    .zone {
      fill: var(--zone-fill);
      stroke: var(--zone-stroke)
    }

    .zone-mask, .node-mask {
      fill: var(--paper)
    }

    .zone-label {
      fill: var(--soft);
      font: 500 8px var(--mono);
      letter-spacing: .18em
    }

    .side-node {
      fill: var(--side-fill);
      stroke: var(--side-stroke)
    }

    .core-node {
      fill: var(--accent-tint);
      stroke: var(--accent)
    }

    .bar {
      fill: var(--bar-fill);
      stroke: var(--zone-stroke)
    }

    .role-box {
      fill: transparent;
      stroke: var(--side-stroke);
      stroke-opacity: .5
    }

    .role-box.focal {
      stroke: var(--accent)
    }

    .role-text {
      fill: var(--side-stroke);
      font: 500 7px var(--mono);
      letter-spacing: .08em
    }

    .role-text.focal {
      fill: var(--accent)
    }

    .node-name {
      fill: var(--ink);
      font: 600 12px var(--sans)
    }

    .node-name.focal {
      fill: var(--ink)
    }

    .node-sub {
      fill: var(--muted);
      font: 9px var(--mono)
    }

    .footer-red {
      fill: var(--custom-red-fill);
      stroke: var(--custom-red-stroke)
    }

    .footer-blue {
      fill: var(--custom-blue-fill);
      stroke: var(--custom-blue-stroke)
    }

    .footer-red-text {
      fill: var(--custom-red)
    }

    .footer-blue-text {
      fill: var(--custom-blue)
    }

    .legend-key {
      fill: var(--muted);
      font: 500 8px var(--mono);
      letter-spacing: .14em
    }

    .legend-text {
      fill: var(--muted);
      font: 8px var(--sans)
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">DP Integration · Diagram Design</p>
  <h1>Generic data platform integration topology</h1>
  <svg aria-label="Sources connect to a core data platform and three consumer surfaces" aria-labelledby="dp-integration-title dp-integration-desc"
       role="img" viewBox="0 0 1200 664"
       xmlns="http://www.w3.org/2000/svg">
    <title id="dp-integration-title">Generic data platform integration topology</title>
    <desc id="dp-integration-desc">Integration topology showing CRM, POS exports, and an event
      stream landing in object storage for query, notebooks, dashboards, and a partner API.
    </desc>
    <defs>
      <pattern height="22" id="dots" patternUnits="userSpaceOnUse" width="22">
        <circle cx="1" cy="1" fill="var(--dot)" r="0.9"/>
      </pattern>
      <marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="var(--muted)" points="0 0,8 3,0 6"/>
      </marker>
      <marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="var(--accent)" points="0 0,8 3,0 6"/>
      </marker>
      <marker id="arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="var(--link)" points="0 0,8 3,0 6"/>
      </marker>
      <marker id="arrow-sm" markerHeight="5" markerWidth="6" orient="auto" refX="5" refY="2.5">
        <polygon fill="var(--muted)" points="0 0,6 2.5,0 5"/>
      </marker>
      <marker id="arrow-dim" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
        <polygon fill="var(--soft)" points="0 0,8 3,0 6"/>
      </marker>
      <g fill="none" id="ico-db" stroke="currentColor" stroke-width="1.2">
        <ellipse cx="0" cy="-5" rx="7" ry="3"/>
        <path d="M-7-5V5c0 2 14 2 14 0V-5M-7 0c0 2 14 2 14 0"/>
      </g>
      <g fill="none" id="ico-file" stroke="currentColor" stroke-width="1.2">
        <path d="M-6-8H2l4 4V8H-6ZM2-8v4h4"/>
      </g>
      <g fill="none" id="ico-stream" stroke="currentColor" stroke-width="1.2">
        <path d="M-8-5H2M-4 0H8M-8 5H2"/>
        <path d="m0-8 3 3-3 3M6-3l3 3-3 3M0 2l3 3-3 3"/>
      </g>
      <g fill="none" id="ico-chart" stroke="currentColor" stroke-width="1.2">
        <path d="M-8 8H8M-6 6V0H-2V6M0 6V-7H4V6M6 6V-3H9"/>
      </g>
      <g fill="none" id="ico-notebook" stroke="currentColor" stroke-width="1.2">
        <rect height="16" rx="2" width="14" x="-7" y="-8"/>
        <path d="M-3-8V8M0-3h4M0 1h4"/>
      </g>
      <g fill="none" id="ico-api" stroke="currentColor" stroke-width="1.2">
        <path
            d="M-3-8c-3 0-3 2-3 4v2c0 2-1 2-3 2 2 0 3 0 3 2v2c0 2 0 4 3 4M3-8c3 0 3 2 3 4v2c0 2 1 2 3 2-2 0-3 0-3 2v2c0 2 0 4-3 4"/>
      </g>
      <g fill="none" id="ico-key" stroke="currentColor" stroke-width="1.2">
        <circle cx="-4" cy="0" r="4"/>
        <path d="M0 0H9M6 0v3M3 0v2"/>
      </g>
      <g fill="none" id="ico-log" stroke="currentColor" stroke-width="1.2">
        <path d="M-8 6h16M-6 3l3-4 3 2 4-7 3 2"/>
      </g>
    </defs>
    <rect fill="var(--paper)" height="664" width="1200"/>
    <rect fill="url(#dots)" height="664" opacity=".55" width="1200"/>
    <rect class="zone" height="336" rx="8" stroke-width="1" width="696" x="260" y="72"/>
    <!-- Connectors are emitted before all node rectangles. -->
    <path class="connector primary" d="M200 124 H360 Q368 124 368 132 V180 Q368 188 376 188 H400"
          marker-end="url(#arrow-accent)"/>
    <line class="connector primary" marker-end="url(#arrow-accent)" x1="200" x2="400" y1="212"
          y2="212"/>
    <path class="connector primary" d="M200 300 H360 Q368 300 368 292 V244 Q368 236 376 236 H400"
          marker-end="url(#arrow-accent)"/>
    <line class="connector primary" marker-end="url(#arrow-accent)" x1="560" x2="656" y1="212"
          y2="212"/>
    <path class="connector primary" d="M816 188 H960 Q968 188 968 180 V132 Q968 124 976 124 H1000"
          marker-end="url(#arrow-accent)"/>
    <line class="connector primary" marker-end="url(#arrow-accent)" x1="816" x2="1000" y1="212"
          y2="212"/>
    <path class="connector primary" d="M816 236 H960 Q968 236 968 244 V292 Q968 300 976 300 H1000"
          marker-end="url(#arrow-accent)"/>
    <line class="connector trigger" marker-end="url(#arrow)" x1="480" x2="480" y1="160" y2="176"/>
    <line class="connector trigger" marker-end="url(#arrow)" x1="736" x2="736" y1="160" y2="176"/>
    <line class="connector auth" marker-end="url(#arrow-accent)" x1="592" x2="592" y1="460"
          y2="408"/>
    <!-- Dashed transit crosses the identity footer without treating it as an endpoint. -->
    <line class="connector auth" marker-end="url(#arrow-accent)" x1="624" x2="624" y1="524"
          y2="408"/>
    <!-- Protocol labels retain an 8px gap from their connector segment. -->
    <g text-anchor="middle">
      <rect class="label-mask" height="12" rx="2" width="44" x="252" y="104"/>
      <text class="edge-label" x="274" y="113">REST</text>
      <rect class="label-mask" height="12" rx="2" width="48" x="272" y="192"/>
      <text class="edge-label" x="296" y="201">CSV</text>
      <rect class="label-mask" height="12" rx="2" width="56" x="248" y="280"/>
      <text class="edge-label" x="276" y="289">EVENTS</text>
      <rect class="label-mask" height="12" rx="2" width="48" x="584" y="192"/>
      <text class="edge-label" x="608" y="201">READ</text>
      <rect class="label-mask" height="12" rx="2" width="48" x="856" y="168"/>
      <text class="edge-label" x="880" y="177">JDBC</text>
      <rect class="label-mask" height="12" rx="2" width="56" x="872" y="192"/>
      <text class="edge-label" x="900" y="201">KERNEL</text>
      <rect class="label-mask" height="12" rx="2" width="56" x="856" y="216"/>
      <text class="edge-label" x="884" y="225">HTTPS</text>
    </g>
    <g>
      <rect class="label-mask" height="12" rx="2" width="32" x="548" y="420"/>
      <text class="edge-label" text-anchor="middle" x="564" y="429">AUTH</text>
      <rect class="label-mask" height="12" rx="2" width="32" x="636" y="420"/>
      <text class="edge-label" text-anchor="middle" x="652" y="429">AUTH</text>
    </g>
    <!-- Zone label -->
    <rect class="zone-mask" height="16" rx="2" width="120" x="548" y="68"/>
    <text class="zone-label" text-anchor="middle" x="608" y="79">DATA PLATFORM</text>
    <!-- Sources -->
    <g text-anchor="middle">
      <g>
        <rect class="node-mask" height="64" rx="6" width="160" x="40" y="92"/>
        <rect class="side-node" height="64" rx="6" width="160" x="40" y="92"/>
        <use href="#ico-db" style="color:var(--muted)" transform="translate(64 124)"/>
        <text class="node-name" x="120" y="120">CRM</text>
        <text class="node-sub" x="120" y="140">customer records</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="160" x="40" y="180"/>
        <rect class="side-node" height="64" rx="6" width="160" x="40" y="180"/>
        <use href="#ico-file" style="color:var(--muted)" transform="translate(64 212)"/>
        <text class="node-name" x="120" y="208">POS exports</text>
        <text class="node-sub" x="120" y="228">daily CSV batches</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="160" x="40" y="268"/>
        <rect class="side-node" height="64" rx="6" width="160" x="40" y="268"/>
        <use href="#ico-stream" style="color:var(--muted)" transform="translate(64 300)"/>
        <text class="node-name" x="120" y="296">Event stream</text>
        <text class="node-sub" x="120" y="316">near-real-time events</text>
      </g>
    </g>
    <!-- Core: fixed 160px nodes keep clean connector corridors; centers remain evenly spaced. -->
    <g text-anchor="middle">
      <rect class="node-mask" height="44" rx="6" width="664" x="276" y="116"/>
      <rect class="bar" height="44" rx="6" width="664" x="276" y="116"/>
      <rect class="role-box" height="12" rx="2" width="32" x="288" y="128"/>
      <text class="role-text" x="304" y="137">DAG</text>
      <text class="node-name" x="608" y="136">Orchestrator</text>
      <text class="node-sub" x="608" y="151">schedules · retries · lineage</text>
      <rect class="node-mask" height="72" rx="6" width="160" x="400" y="176"/>
      <rect class="core-node" height="72" rx="6" width="160" x="400" y="176"/>
      <rect class="role-box focal" height="12" rx="2" width="44" x="408" y="184"/>
      <text class="role-text focal" x="430" y="193">STORE</text>
      <text class="node-name focal" x="480" y="214">Object storage</text>
      <text class="node-sub" x="480" y="232">versioned data objects</text>
      <rect class="node-mask" height="72" rx="6" width="160" x="656" y="176"/>
      <rect class="core-node" height="72" rx="6" width="160" x="656" y="176"/>
      <rect class="role-box focal" height="12" rx="2" width="32" x="664" y="184"/>
      <text class="role-text focal" x="680" y="193">SQL</text>
      <text class="node-name focal" x="736" y="214">Query engine</text>
      <text class="node-sub" x="736" y="232">federated SQL access</text>
    </g>
    <!-- Consumers -->
    <g text-anchor="middle">
      <g>
        <rect class="node-mask" height="64" rx="6" width="160" x="1000" y="92"/>
        <rect class="side-node" height="64" rx="6" width="160" x="1000" y="92"/>
        <use href="#ico-chart" style="color:var(--muted)" transform="translate(1024 124)"/>
        <text class="node-name" x="1080" y="120">BI tool</text>
        <text class="node-sub" x="1080" y="140">dashboards · reports</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="160" x="1000" y="180"/>
        <rect class="side-node" height="64" rx="6" width="160" x="1000" y="180"/>
        <use href="#ico-notebook" style="color:var(--muted)" transform="translate(1024 212)"/>
        <text class="node-name" x="1080" y="208">Notebooks</text>
        <text class="node-sub" x="1080" y="228">Python · exploration</text>
      </g>
      <g>
        <rect class="node-mask" height="64" rx="6" width="160" x="1000" y="268"/>
        <rect class="side-node" height="64" rx="6" width="160" x="1000" y="268"/>
        <use href="#ico-api" style="color:var(--muted)" transform="translate(1024 300)"/>
        <text class="node-name" x="1080" y="296">Partner API</text>
        <text class="node-sub" x="1080" y="316">scoped data products</text>
      </g>
    </g>
    <!-- Layer-wide footer services -->
    <g>
      <rect class="node-mask" height="56" rx="6" width="1120" x="40" y="460"/>
      <rect class="footer-red" height="56" rx="6" width="1120" x="40" y="460"/>
      <use href="#ico-key" style="color:var(--custom-red)" transform="translate(72 488)"/>
      <text class="node-name footer-red-text" x="96" y="486">Identity provider</text>
      <text class="node-sub" x="96" y="502">SSO · service identities · policy groups</text>
      <rect class="node-mask" height="56" rx="6" width="1120" x="40" y="524"/>
      <rect class="footer-blue" height="56" rx="6" width="1120" x="40" y="524"/>
      <use href="#ico-log" style="color:var(--custom-blue)" transform="translate(72 552)"/>
      <text class="node-name footer-blue-text" x="96" y="550">Centralized logging</text>
      <text class="node-sub" x="96" y="566">platform events · audit trail · retention</text>
    </g>
    <!-- Legend -->
    <line stroke="var(--rule)" stroke-width=".8" x1="40" x2="1160" y1="608" y2="608"/>
    <text class="legend-key" x="40" y="628">TYPE KEY</text>
    <rect fill="var(--side-fill)" height="12" rx="2" stroke="var(--side-stroke)" width="16" x="128"
          y="620"/>
    <text class="legend-text" x="152" y="630">Source / consumer</text>
    <rect fill="var(--accent-tint)" height="12" rx="2" stroke="var(--accent)" width="16" x="296"
          y="620"/>
    <text class="legend-text" x="320" y="630">Focal platform surface</text>
    <rect fill="var(--bar-fill)" height="12" rx="2" stroke="var(--zone-stroke)" width="16" x="492"
          y="620"/>
    <text class="legend-text" x="516" y="630">Orchestration</text>
    <line marker-end="url(#arrow-accent)" stroke="var(--accent)" stroke-width="1.4" x1="640" x2="672" y1="626"
          y2="626"/>
    <text class="legend-text" x="684" y="630">Primary data path</text>
    <line marker-end="url(#arrow-accent)" stroke="var(--accent)" stroke-dasharray="5 4" x1="824" x2="856" y1="626"
          y2="626"/>
    <text class="legend-text" x="868" y="630">Layer-wide service</text>
  </svg>
</div>
</body>
</html>
