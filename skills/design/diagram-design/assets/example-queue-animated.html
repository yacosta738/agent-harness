<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Fan-in Queue & Ingress Bottleneck Analysis</title>
  <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --accent: #eb6c36;
      --ink: #2d3142;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --muted: #4f5d75;
      --paper: #f5f5f5;
      --rule: rgba(45, 49, 66, 0.12);
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --soft: #7a8399;
      --paper-2: #ececec;
      --motion-ease: cubic-bezier(.2, .8, .2, 1);
      --motion-fast: 160ms;
      --motion-hold: 720ms;
      --motion-step: 480ms;
      --rule-strong: rgba(45, 49, 66, 0.30);
      --accent-tint: rgba(235, 108, 54, 0.08);
      --motion-total: 3600ms;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      margin: 0;
      min-height: 100vh;
      padding: 32px;
    }

    [data-motion-root] {
      margin: 0 auto;
      width: min(100%, 1280px);
    }

    .page-header {
      align-items: end;
      display: flex;
      gap: 32px;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .eyebrow {
      color: var(--muted);
      font: 500 10px/1.4 var(--mono);
      letter-spacing: .18em;
      margin: 0 0 8px;
      text-transform: uppercase;
    }

    h1 {
      font: 400 clamp(28px, 3vw, 40px)/1.08 var(--serif);
      letter-spacing: -.02em;
      margin: 0;
    }

    .lede {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 4px;
      max-width: 540px;
    }

    .diagram-wrap {
      border-bottom: 1px solid var(--rule);
      border-top: 1px solid var(--rule);
      overflow-x: auto;
    }

    svg {
      display: block;
      min-width: 920px;
      width: 100%;
    }

    /* Motion item states */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
      transform var(--motion-step) var(--motion-ease);
    }

    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }

    /* Queue depth badge transition rule: Step 1 badge hides when Step 2+ is reached */
    [data-step-current="2"] .queue-depth-step1,
    [data-step-current="3"] .queue-depth-step1,
    [data-step-current="4"] .queue-depth-step1,
    [data-step-current="5"] .queue-depth-step1,
    [data-frame="end"] .queue-depth-step1,
    [data-frame="static"] .queue-depth-step1 {
      display: none !important;
    }

    html[data-motion="static"] [data-motion-controls] {
      display: none !important;
    }

    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }

    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] {
      display: none !important;
    }

    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }

      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
      }

      [data-motion-decorative] {
        display: none !important;
      }

      [data-motion-controls] {
        display: none !important;
      }
    }

    @media print {
      body {
        padding: 0;
      }

      [data-motion-controls], [data-motion-decorative] {
        display: none !important;
      }

      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    [data-motion-controls] {
      align-items: center;
      display: none;
      gap: 8px;
      min-height: 60px;
      padding: 8px 0;
    }

    .motion-ready [data-motion-controls] {
      display: flex;
    }

    [data-motion-controls][hidden] {
      display: none !important;
    }

    [data-motion-controls] button {
      background: var(--paper);
      border: 1px solid var(--muted);
      border-radius: 4px;
      color: var(--ink);
      cursor: pointer;
      font: 600 12px/1 var(--sans);
      min-height: 44px;
      min-width: 44px;
      padding: 8px 12px;
    }

    [data-motion-controls] button:hover {
      border-color: var(--accent);
    }

    [data-motion-controls] button:focus-visible,
    [data-motion-root]:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    [data-motion-controls] button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .keyboard-help {
      color: var(--soft);
      font: 500 9px/1.4 var(--mono);
      margin-left: 8px;
    }

    [data-motion-status] {
      color: var(--muted);
      display: block;
      font: 500 10px/1.4 var(--mono);
      margin: 8px 0 0;
      min-height: 16px;
      min-width: 272px;
      text-align: right;
    }

    noscript p {
      color: var(--muted);
      font: 500 10px/1.4 var(--mono);
      margin: 12px 0 0;
    }

    .sr-only {
      border: 0;
      clip: rect(0, 0, 0, 0);
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }
  </style>
</head>
<body>
<main data-frame="static" data-motion-mode="step" data-motion-root data-static-frame="complete"
      data-step-count="5" data-step-current="5" tabindex="-1">
  <header class="page-header">
    <div>
      <p class="eyebrow">Semantic pattern · Fan-in queue / bottleneck</p>
      <h1>Fan-in Queue &amp; Ingress Bottleneck Analysis</h1>
    </div>
    <p class="lede">
      Multiple ingress traffic sources converge on a bounded 5-slot queue buffer before processing
      by a constrained worker service.
    </p>
  </header>

  <div class="diagram-wrap">
    <svg aria-labelledby="queue-animated-title queue-animated-desc"
         data-motion-primitive="fan-in-queue"
         role="img" viewBox="0 0 1160 620"
         xmlns="http://www.w3.org/2000/svg">
      <title id="queue-animated-title">Fan-in Queue and Bottleneck Analysis</title>
      <desc id="queue-animated-desc">Interactive step-by-step demonstration of fan-in request
        ingress, queue buffering, rate-limiting, and worker service processing.
      </desc>
      <rect fill="#f5f5f5" height="620" width="1160"/>
      <defs>
        <marker id="arrow-ink" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8"
                refY="5" viewBox="0 0 10 10">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3142"/>
        </marker>
        <marker id="arrow-accent" markerHeight="6" markerWidth="6" orient="auto-start-reverse"
                refX="8"
                refY="5" viewBox="0 0 10 10">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-muted" markerHeight="6" markerWidth="6" orient="auto-start-reverse"
                refX="8"
                refY="5" viewBox="0 0 10 10">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f5d75"/>
        </marker>
      </defs>

      <!-- Base Layout: Ingress Sources Region (Static) -->
      <rect fill="#ececec" height="510" rx="8" stroke="rgba(45,49,66,0.12)" stroke-width="1"
            width="240"
            x="40" y="40"/>
      <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" letter-spacing="1.6"
            x="60"
            y="72">INGRESS SOURCES
      </text>

      <rect fill="#ffffff" height="72" rx="6" stroke="#2d3142" stroke-width="1.5" width="200" x="60"

            y="128">Web Client App
      </text>
      <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="76" y="148">Rate:

      </text>

      <!-- Producer 2: Mobile API (Steady Flow: 3 req/sec) -->

      </text>
      <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="76" y="248">Rate:

      </text>

      <!-- Producer 3: Payment Webhook (Spike Flow: 8 req/sec) -->
      <rect fill="#ffffff" height="72" rx="6" stroke="#2d3142" stroke-width="1.5" width="200" x="60"
            y="296"/>
      <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600" x="76"
            y="328">Payment Webhooks
      </text>
      <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="76" y="348">Rate:
        8 req/sec (Spike)
      </text>

      <!-- Producer 4: Legacy ERP (Spike Flow: 12 req/sec) -->
      <rect fill="#ffffff" height="72" rx="6" stroke="#2d3142" stroke-width="1.5" width="200" x="60"
            y="396"/>
      <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600" x="76"
            y="428">Legacy ERP Batch
      </text>
      <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="76" y="448">Rate:
        12 req/sec (Spike)
      </text>

      <!-- Central Queue Buffer Region (Width expanded to 370px for generous text margins) -->
      <rect fill="#ececec" height="320" rx="8" stroke="rgba(45,49,66,0.12)" stroke-width="1"
            width="370"
            x="340" y="150"/>
      <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
            x="360"
            y="182">Central Ingress Queue Buffer
      </text>
      <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="360" y="200">
        Capacity: 5 slots (Bounded FIFO)
      </text>

      <!-- STEP 1: Ingress Traffic Arrives (Slots 1 & 2 + Initial 2/5 Queue Depth Badge) -->
      <g aria-label="Step 1: Web App and Mobile API send steady ingress traffic (7 req/sec total) into queue slots 1 and 2"
         data-motion-item
         data-step="1">
        <!-- Ingress Flow Arrows 1 & 2 -->
        <path d="M 260 132 L 340 234" fill="none" marker-end="url(#arrow-ink)" stroke="#2d3142"
              stroke-width="2"/>
        <path d="M 260 232 L 340 282" fill="none" marker-end="url(#arrow-ink)" stroke="#2d3142"
              stroke-width="2"/>

        <!-- Queue Slot 1 -->
        <rect fill="#ffffff" height="36" rx="4" stroke="#2d3142" stroke-width="1.5" width="265"
              x="360"
              y="216"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10.5" x="372" y="239">
          Slot 1: req_web_8019 [GET /api]
        </text>

        <!-- Queue Slot 2 -->
        <rect fill="#ffffff" height="36" rx="4" stroke="#2d3142" stroke-width="1.5" width="265"
              x="360"
              y="260"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10.5" x="372" y="283">
          Slot 2: req_mob_4412 [POST /auth]
        </text>

        <!-- Single Unified Queue Status Badge for Step 1 (DEPTH 2/5 - Spans full height of 5 slots) -->
        <g class="queue-depth-step1">
          <rect fill="#ffffff" height="212" rx="4" stroke="rgba(45,49,66,0.12)" stroke-width="1"
                width="60"
                x="635" y="216"/>
          <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10"
                text-anchor="middle"
                x="665" y="300">DEPTH
          </text>
          <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="22" font-weight="600"
                text-anchor="middle" x="665" y="330">2/5
          </text>
        </g>
      </g>

      <!-- STEP 2: Ingress Spike Fills Queue (Slots 3, 4, 5 + Updated 5/5 Full Warn Queue Depth Badge) -->
      <g aria-label="Step 2: Payment and ERP traffic spike (20 req/sec total) fills queue to 5/5 slots capacity"
         data-motion-item
         data-step="2">
        <!-- Ingress Flow Arrows 3 & 4 -->
        <path d="M 260 332 L 340 322" fill="none" marker-end="url(#arrow-accent)" stroke="#eb6c36"
              stroke-width="2"/>
        <path d="M 260 432 L 340 370" fill="none" marker-end="url(#arrow-accent)" stroke="#eb6c36"
              stroke-width="2"/>

        <!-- Queue Slot 3 -->
        <rect fill="#ffffff" height="36" rx="4" stroke="#eb6c36" stroke-width="1.5" width="265"
              x="360"
              y="304"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="10.5" x="372" y="327">
          Slot 3: req_pay_9920 [WEBHOOK]
        </text>

        <!-- Queue Slot 4 -->
        <rect fill="rgba(235,108,54,0.08)" height="36" rx="4" stroke="#eb6c36" stroke-width="1.5"
              width="265"
              x="360" y="348"/>
        <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="10.5"
              font-weight="600" x="372"
              y="371">Slot 4: req_erp_1044 [BATCH]
        </text>

        <!-- Queue Slot 5 -->
        <rect fill="rgba(235,108,54,0.08)" height="36" rx="4" stroke="#eb6c36" stroke-width="1.5"
              width="265"
              x="360" y="392"/>
        <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="10.5"
              font-weight="600" x="372"
              y="415">Slot 5: req_erp_1045 [FULL]
        </text>

        <!-- Single Unified Queue Status Badge for Step 2+ (FULL 5/5 WARN - Replaces 2/5 badge seamlessly) -->
        <rect fill="rgba(235,108,54,0.08)" height="212" rx="4" stroke="#eb6c36" stroke-width="1.5"
              width="60"
              x="635" y="216"/>
        <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="10" font-weight="600"
              text-anchor="middle" x="665" y="290">FULL
        </text>
        <text fill="#eb6c36" font-family="'Geist', sans-serif" font-size="24" font-weight="600"
              text-anchor="middle"
              x="665" y="325">5/5
        </text>
        <text fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600"
              text-anchor="middle" x="665" y="355">WARN
        </text>
      </g>

      <!-- STEP 3: Rate Limiter Diverts Excess Traffic (429 Dropped Sink) -->
      <g aria-label="Step 3: Overflow backpressure activates, shedding excess 19 req/sec to 429 Rate Limiter sink"
         data-motion-item
         data-step="3">
        <!-- Overflow Diverter Connector -->
        <path d="M 525 150 L 525 92 L 760 92" fill="none" marker-end="url(#arrow-accent)"
              stroke="#eb6c36"
              stroke-dasharray="4 4" stroke-width="2"/>

        <!-- 429 Dropped Traffic Sink Node (Expanded to width 350px) -->
        <rect fill="rgba(235,108,54,0.08)" height="85" rx="6" stroke="#eb6c36" stroke-width="1.5"
              width="350"
              x="760" y="50"/>
        <text fill="#eb6c36" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
              x="780"
              y="82">429 Rate Limiter &amp; Overflow Sink
        </text>
        <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="780" y="104">
          Status: 429 Backpressure (19 req/sec Shed)
        </text>
      </g>

      <!-- STEP 4: Worker Service Processing & Downstream Output -->
      <g aria-label="Step 4: Constrained worker node processes queue at 8 req/sec max emitting 200 OK downstream responses"
         data-motion-item
         data-step="4">
        <!-- Worker Processing Connector -->
        <path d="M 710 310 L 760 280" fill="none" marker-end="url(#arrow-ink)" stroke="#2d3142"
              stroke-width="2"/>

        <!-- Worker Node A (Expanded to width 350px) -->
        <rect fill="#ffffff" height="130" rx="6" stroke="#2d3142" stroke-width="1.5" width="350"
              x="760"
              y="215"/>
        <text fill="#2d3142" font-family="'Geist', sans-serif" font-size="14" font-weight="600"
              x="780"
              y="246">Constrained Worker Service
        </text>
        <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="780" y="268">
          Instance: Worker-Node-01
        </text>
        <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="780" y="290">
          Service Capacity: 8 req/sec max
        </text>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="11" font-weight="600"
              x="780"
              y="312">Status: PROCESSING [FIFO]
        </text>

        <!-- 200 OK Downstream Connector -->
        <path d="M 935 345 L 935 410" fill="none" marker-end="url(#arrow-ink)" stroke="#2d3142"

              x="760" y="410"/>

        </text>
        <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="780" y="464">
          Result: 200 OK Admitted Traffic Stream (8 req/sec)
        </text>
      </g>

      <!-- STEP 5: Equilibrium State & Performance Metrics Summary -->
      <g aria-label="Step 5: System reaches controlled equilibrium protecting worker from overload while shedding excess traffic"
         data-motion-item
         data-step="5">
        <rect fill="#ffffff" height="64" rx="6" stroke="#2d3142" stroke-width="1.5" width="370"

              y="490"/>

              x="360"
              y="516">System State: Controlled Equilibrium
        </text>
        <text fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="11" x="360" y="536">
          Worker Protected · Backpressure Active
        </text>
      </g>

      <!-- Precision SVG Legend Footer (Exact visual mini-arrows and mini-rects) -->
      <g aria-hidden="true" data-motion-decorative>
        <!-- Flow Line 1: Admitted Flow -->
        <line marker-end="url(#arrow-ink)" stroke="#2d3142" stroke-width="2" x1="40" x2="65"
              y1="584"
              y2="584"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="9.5" x="73" y="588">
          Admitted Flow
        </text>

        <!-- Flow Line 2: High Ingress -->
        <line marker-end="url(#arrow-accent)" stroke="#eb6c36" stroke-width="2" x1="165" x2="190"
              y1="584"
              y2="584"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="9.5" x="198" y="588">

        </text>

        <!-- Flow Line 3: 429 Backpressure -->
        <line marker-end="url(#arrow-accent)" stroke="#eb6c36" stroke-dasharray="3 3"

        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="9.5" x="318" y="588">

        </text>

        <!-- Box 1: Normal Slot -->
        <rect fill="#ffffff" height="12" rx="2" stroke="#2d3142" stroke-width="1.5" width="16"
              x="430"
              y="577"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="9.5" x="452" y="588">
          Normal Slot
        </text>

        <!-- Box 2: Capacity Warn Slot -->
        <rect fill="#ffffff" height="12" rx="2" stroke="#eb6c36" stroke-width="1.5" width="16"
              x="540"
              y="577"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="9.5" x="562" y="588">
          Capacity Warn
        </text>

        <!-- Box 3: Overflown 429 Slot -->
        <rect fill="rgba(235,108,54,0.08)" height="12" rx="2" stroke="#eb6c36" stroke-width="1.5"
              width="16"
              x="660" y="577"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="9.5" x="682" y="588">
          Overflown (429)
        </text>

        <!-- Box 4: Depth / Full Counter Badge -->
        <rect fill="#ffffff" height="12" rx="2" stroke="rgba(45,49,66,0.25)" stroke-width="1"
              width="16"
              x="790" y="577"/>
        <text fill="#2d3142" font-family="'Geist Mono', monospace" font-size="9.5" x="812" y="588">
          Queue Depth Badge
        </text>
      </g>
    </svg>
  </div>

  <!-- Pinned Motion Controls -->
  <div aria-label="Diagram playback controls" data-motion-controls role="group">
    <button data-motion-action="prev" type="button">Previous</button>
    <button aria-pressed="false" data-motion-action="play" type="button">Play</button>
    <button aria-pressed="true" data-motion-action="pause" type="button">Pause</button>
    <button data-motion-action="next" type="button">Next</button>
    <button data-motion-action="replay" type="button">Replay</button>
    <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
    <span aria-hidden="true" data-motion-status-visible>Step <span data-motion-step-label>5</span> of 5</span>
  </div>
  <p aria-atomic="true" aria-live="polite" class="sr-only" data-motion-status role="status"></p>
  <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p>
  </noscript>
</main>

<script data-diagram-controls>
  (() => {
    const params = new URLSearchParams(location.search);
    const staticOverride = params.get('motion') === 'static'
        || document.documentElement.dataset.motion === 'static';
    const requestedStep = params.get('step');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    document.fonts.ready.then(() => {
      document.documentElement.dataset.fontsReady = 'true';
    });

    document.querySelectorAll('[data-motion-root]').forEach((root) => {
      const count = Number(root.dataset.stepCount);
      const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
      const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(
          requestedStep) : null;
      const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep)
      && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
      const items = [...root.querySelectorAll('[data-motion-item]')];
      const labels = Array.from({length: count + 1}, (_, index) => index === 0
          ? 'Ready'
          : items.filter(
              (item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step)
                  === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
      const controls = root.querySelector('[data-motion-controls]');
      const status = root.querySelector('[data-motion-status]');
      const visibleStep = root.querySelector('[data-motion-step-label]');
      let step = count;
      let timer = 0;
      let playing = false;
      let stepBeforeReduce = 0;
      let resumeAfterReduce = root.dataset.motionMode === 'reveal';

      const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
      const clearClock = () => {
        window.clearTimeout(timer);
        timer = 0;
      };
      const announce = () => {
        status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`;
      };
      const setControlsAvailable = (available) => {
        controls.hidden = !available;
        controls.setAttribute('aria-hidden', String(!available));
        controls.dataset.playbackDisabled = String(!available);
        controls.querySelectorAll('button').forEach((control) => {
          control.disabled = !available;
        });
      };

      function render(next, userInitiated = false) {
        step = Math.max(0, Math.min(count, next));
        root.dataset.stepCurrent = String(step);
        root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
        items.forEach((item) => {
          const itemStep = Number(item.dataset.step);
          item.classList.toggle('is-visible', itemStep <= step);
          item.classList.toggle('is-current', itemStep === step);
        });
        if (visibleStep) {
          visibleStep.textContent = String(step);
        }
        const unavailable = controls.dataset.playbackDisabled === 'true';
        buttons('prev').disabled = unavailable || step === 0;
        buttons('next').disabled = unavailable || step === count;
        if (userInitiated) {
          announce();
        }
      }

      function pause(userInitiated = false) {
        clearClock();
        playing = false;
        root.classList.remove('is-playing');
        buttons('play').setAttribute('aria-pressed', 'false');
        buttons('pause').setAttribute('aria-pressed', 'true');
        if (userInitiated) {
          status.textContent = `Paused at step ${step} of ${count}`;
        }
      }

      function finish() {
        pause(false);
        root.dataset.frame = 'end';
        status.textContent = `Complete · step ${count} of ${count}`;
      }

      function tick() {
        if (!playing) {
          return;
        }
        if (step >= count) {
          finish();
          return;
        }
        render(step + 1, false);
        if (step >= count) {
          finish();
          return;
        }
        timer = window.setTimeout(tick, hold);
      }

      function play(fromStart = false, userInitiated = false) {
        clearClock();
        if (fromStart || step >= count) {
          render(0, userInitiated);
        }
        playing = true;
        root.classList.add('is-playing');
        buttons('play').setAttribute('aria-pressed', 'true');
        buttons('pause').setAttribute('aria-pressed', 'false');
        timer = window.setTimeout(tick, hold);
      }

      controls.addEventListener('click', (event) => {
        const button = event.target.closest('[data-motion-action]');
        if (!button) {
          return;
        }
        const action = button.dataset.motionAction;
        if (action === 'play') {
          play(false, true);
        }
        if (action === 'pause') {
          pause(true);
        }
        if (action === 'replay') {
          play(true, true);
        }
        if (action === 'prev') {
          pause(false);
          render(step - 1, true);
        }
        if (action === 'next') {
          pause(false);
          render(step + 1, true);
        }
      });

      root.addEventListener('keydown', (event) => {
        if (event.target.matches('input, textarea, select, a[href]')) {
          return;
        }
        const keys = {ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count};
        if (event.code === 'Space' && !event.target.closest('button')) {
          event.preventDefault();
          playing ? pause(true) : play(false, true);
          return;
        }
        if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
          event.preventDefault();
          play(true, true);
          return;
        }
        if (!(event.key in keys)) {
          return;
        }
        event.preventDefault();
        pause(false);
        render(keys[event.key], true);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && playing) {
          pause(false);
        }
      });
      reduce.addEventListener('change', (event) => {
        if (event.matches && root.dataset.motionState !== 'reduced') {
          stepBeforeReduce = step;
          resumeAfterReduce = playing;
        }
        pause(false);
        if (event.matches) {
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'reduced';
          status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
        } else if (staticOverride || root.dataset.motionMode === 'none') {
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else {
          delete root.dataset.motionState;
          if (exactStep !== null) {
            setControlsAvailable(false);
            render(exactStep, false);
            root.dataset.frame = 'step';
            root.dataset.motionState = 'test';
            status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
          } else {
            setControlsAvailable(true);
            render(stepBeforeReduce, false);
            status.textContent = `Ready · step ${step} of ${count}`;
            if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
              play(false, false);
            }
          }
          resumeAfterReduce = false;
        }
      });

      if (staticOverride) {
        document.documentElement.dataset.motion = 'static';
        pause(false);
        setControlsAvailable(false);
        render(count, false);
        root.dataset.frame = 'static';
        root.dataset.motionState = 'static';
        status.textContent = 'Static frame · complete diagram · playback controls unavailable';
      } else if (reduce.matches || root.dataset.motionMode === 'none') {
        pause(false);
        setControlsAvailable(false);
        render(count, false);
        root.dataset.frame = 'static';
        root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
        status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
      } else if (exactStep !== null) {
        document.documentElement.dataset.motion = 'step';
        pause(false);
        setControlsAvailable(false);
        render(exactStep, false);
        root.dataset.frame = 'step';
        root.dataset.motionState = 'test';
        status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
      } else if (root.dataset.motionMode === 'reveal') {
        setControlsAvailable(true);
        render(0, false);
        play(false, false);
      } else {
        pause(false);
        setControlsAvailable(true);
        render(0, false);
        status.textContent = `Ready · step 0 of ${count}`;
      }
      root.classList.add('motion-ready');
    });
  })();
</script>
</body>
</html>
